# Režimy brány sloučení: docs/navrh-rizeni-vyvoje-2027.md, oddíly 4, 5 a 9.
# Brána čte tento soubor vždy z main, úprava ve větvi se uplatní až po sloučení.
# Soubor je v cestách h2, takže jeho změnu brána pustí jen se souhlasem vlastníka.
#
# Vzory cest jako v labeleru: `**` libovolná hloubka, `*` v rámci jedné složky.

verze: 1

# Účet vlastníka. Štítek `schvaleno` z jiného účtu (asistent zadání, boti) brána nebere jako souhlas
# a `stop` odebraný jiným účtem, než který ho přidal, dál platí. Claude Code pracuje přes účet vlastníka.
vlastnik: tangero

# Účet asistenta zadání (Eduarda, RA36). Doklad „Zdroj:“ brána uzná jen v issue od vlastníka nebo asistenta,
# protokol z preview jen od nich nebo od github-actions[bot]; PR jiného autora jen se schvaleno na PR.
asistent: eduarda-prijimacky

# Účet automatiky ve workflow: GitHub App `prijimacky-ai` (#403, RA47). Slučuje PR, mění štítky a zakládá PR s obnovou
# dat. Brána mu věří jen u automatických obnov dat (`datove_obnovy`); není vlastník (souhlas, odebrání `stop`),
# asistent (doklad „Zdroj:“, review, protokol) ani github-actions[bot] (záznamy brány).
automatika: prijimacky-ai[bot]

# Smí AI slučovat skriptem scripts/brana/sloucit.mjs? Zapne se samostatným PR (H2) až po přejímce
# a po přidání brány do rulesetu (docs/postup-zavedeni-faze-0.md, krok 3). Do té doby slučuje vlastník.
slucovani_ai: true

# Schválení `schvaleno` přidaná před tímto dnem brána při prvním vyhodnocení zaznamená
# s tehdejším rozsahem; pozdější schválení zaznamená workflow brány hned při přidání štítku.
platnost_od: "2026-10-03"

# Smyčka review a oprav (#301, docs/navrh-rizeni-vyvoje-2027.md, oddíl 9d). Brána vyžaduje pro aktuální
# hlavu PR komentář „Review“ od účtu `asistent` (nebo automatické review, viz níže) s verdiktem „Bez P1 a P2“ a řádkem `Commit: <sha7>`;
# neplatí pro změny bez dopadu na web (bez_preview) a pro PR se `schvaleno` na PR. Workflow
# oprava-z-review.yml provede na komentář `@claude` nejvýš `max_kol_oprav` kol na PR, pak přidá
# štítek `potrebuje-cloveka`.
review:
  vyzadovat: true
  max_kol_oprav: 5
  # Automatické review modelem Kimi K3 (#455, workflow review.yml): komentář „Review“ od účtu `automatika`
  # s touto značkou platí jako review asistenta a jeho `@claude` se značkou spustí smyčku oprav. Bez značky
  # automatika review ani opravy nespouští (jinak jí brána věří jen u obnov dat).
  znacka_automatiky: "<!-- review:kimi -->"

# Režim L: drobné zadání se sloučí po této době od poslední změny PR, pokud nikdo nepřidal `stop`.
lhuta_l_hodin: 48

# Režim R: nejvýš tolik změněných řádků mimo testy, v jedné oblasti.
rutina_max_radku: 150

# H2, uvolnění pravomocí AI: vždy souhlas vlastníka štítkem `schvaleno` přímo na PR.
# Patří sem i úprava workflow, která přidá nebo změní `secrets.` nebo `permissions:` (brána to čte z diffu).
h2:
  - .github/rezimy.yml
  - .github/labeler.yml
  - .github/CODEOWNERS
  - .github/workflows/brana-slouceni.yml
  - .github/workflows/oblasti-pr.yml
  - .github/workflows/slouceni.yml
  - .github/workflows/oponentura.yml
  - .github/workflows/review.yml
  - scripts/brana/**
  - CLAUDE.md
  - .claude/claude.md
  - .claude/settings*.json
  - docs/smer-vyvoje.md

# K, kontrolované činnosti (oddíl 5). Ve fázi 1 je pustí souhlas vlastníka na PR nebo na propojeném
# issue; ve fázi 2 přibude druhý klíč a mechanismy z oddílu 5.
k:
  migrace:
    - db/migrace/**
    - scripts/*-migrace.mjs
  emaily:
    - src/lib/novinky-*
    - src/lib/portal-email.ts
    - src/app/api/novinky/**
    - content/novinky/sablony/**
  portal:
    - src/app/api/portal/**
    - src/app/api/portal-*/**
    - src/lib/portal-*
    - src/app/admin/**
  nasazeni:
    - vercel.json
    - next.config.ts
    - scripts/vercel-deploy.sh
  adresy:
    - src/app/robots.ts
    - public/sitemap.xml
  workflows:
    - .github/**
  zavislosti:
    - package.json
    - package-lock.json
    - requirements*.txt
  registr:
    - public/stav_datovych_sad.json
  ukazatele:
    - docs/slovnik-ukazatelu.md

# Smazaná nebo přejmenovaná stránka mění adresy (oddíl 5, řádek 9): K.
stranky:
  - src/app/**/page.tsx
  - src/app/**/route.ts

# Automatické obnovy dat (RA46, #385): PR bez propojeného zadání od účtu vlastníka nebo `automatika` (workflow), ne z forku,
# z uvedené větve, který mění jen cesty této větve, projde v režimu R bez souhlasu a bez review. CI zůstává
# povinné. Změna mimo tyto cesty se posuzuje jako dřív. Klíč může být vzor větve: `data/*` jsou předání
# z datové linky (RA49, #440), která vznikají až po potvrzení vlastníka kódem v Telegramu nebo v issue;
# cesty jsou výstupy zpracovatelů linky (scripts/linka/zpracovani.py), registr se přepíná až po sloučení.
datove_obnovy:
  auto/veletrhy-snimek:
    - src/data/veletrhy-2027.json
    - public/stav_datovych_sad.json
    - docs/zdroje-dat.md
  codex/csi-weekly-refresh:
    - data/csi_*.json
    - data/csi_snapshots/**
    - data/inspection_extractions.json
    - inspekce/config/production_reports.json
    - inspekce/data/**
    - public/stav_datovych_sad.json
    - docs/zdroje-dat.md
  data/*:
    - public/pasma_prijeti_*.json
    - public/soubeh_prihlasek_*.json
    - public/kontext_prihlasek_*.json
    - public/simulator_pasma_*.json
    - public/okruhy_oboru_*.json
    - public/druhe_kolo.json
    - public/maturita_skoly.json
    - data/transit_graph.json

# Hlášení škol z portálu (RA52, #461): PR k hlášení přihlášené školy (štítek `portal-skoly`, kanál ověřeného přístupu
# v těle issue od webu) projde bez `schvaleno`, jen když mění tyto cesty: soubory s opravami údajů škol a testy.
# V limitu rutiny jako R, jinak L. Změna kódu nebo textů webu potřebuje `schvaleno` jako dřív.
hlaseni_skol:
  - src/data/opravy-nabidky-skol.json
  - data/inspis_opravy.json
  - tests/**

# Změny jen v těchto cestách nepotřebují protokol z preview (web se nemění).
bez_preview:
  - docs/**
  - "**/*.md"
  - tests/**
  - .github/**
  - .claude/**
  - scripts/brana/**
  - scripts/prehled/**
  - scripts/tabule/**

# Do limitu řádků rutiny se nepočítají.
testy:
  - tests/**
