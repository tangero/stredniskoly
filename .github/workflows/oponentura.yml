# Oponentura při rozjezdu nového projektu (#358, skill .claude/skills/oponentura, docs/spoluprace-na-githubu.md,
# oddíl 3). Na štítek `oponentura` projde problém z issue čtyřmi fázemi: průzkum (Claude Code, smí na web),
# návrhy naslepo (Claude a Kimi zvlášť), anonymní kritika kandidátů (Claude a Kimi zvlášť) a syntéza (Kimi,
# náhradně Claude). Komentář „## Oponentura“ nese syntézu a ve sbalených oddílech podklady. Pak workflow odebere
# štítek a issue bez `navrh` a `schvaleno` vrátí do `navrh`, tedy k rozhodnutí vlastníka.
#
# Pojistky:
# - Spustí se jen na štítek od účtu `vlastnik` nebo `asistent` z rezimy.yml (ruční spuštění totéž).
# - Modely běží v Claude Code jen s nástroji Read, Glob a Grep; průzkum navíc s WebSearch a WebFetch. Bez shellu
#   a zápisu, čtení mimo pracovní složku je zakázané. Text issue jde do souborů, do příkazů se nevkládá.
# - Návrhy vznikají naslepo: nápad z issue a komentáře leží mimo pracovní složku (model je nepřečte), dokud
#   neskončí fáze návrhů.
# - Secrets: každý krok s modelem dostane jen svůj klíč (CLAUDE_CODE_OAUTH_TOKEN, nebo KIMI_API_KEY) a model
#   ho dostane přes `env -i` bez ostatních proměnných. token App prijimacky-ai (#403) jen na změnu štítků, aby se spustila Tabule.
#   Komentář píše GITHUB_TOKEN. Nic neslučuje, štítky `schvaleno`, `zamitnuto` ani `stop` nemění.
# - Komentář se nezapíše, když některý výstup obsahuje klíč nebo syntéza nemá nadpis „## Oponentura“.
name: Oponentura

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: "Číslo issue"
        required: true

permissions: {}

concurrency:
  group: oponentura-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  oponentura:
    name: Oponentura
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'oponentura' && !github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
    env:
      CISLO: ${{ github.event.issue.number || inputs.issue }}
      AKTER: ${{ github.event.sender.login }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Mezinárodní rozhraní Kimi Code; pro účet z kimi.com (Čína) nastav proměnnou repozitáře
      # KIMI_BASE_URL na https://api.kimi.com/coding/.
      KIMI_URL: ${{ vars.KIMI_BASE_URL || 'https://api.kimi.ai/coding/' }}
      KIMI_MODEL: k3-256k
      FAZE: .claude/skills/oponentura/faze
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Kdo oponenturu spustil
        id: kdo
        run: |
          [[ "$CISLO" =~ ^[0-9]+$ ]] || { echo "::error::Číslo issue není číslo."; exit 1; }
          vlastnik=$(yq -r '.vlastnik' .github/rezimy.yml)
          asistent=$(yq -r '.asistent' .github/rezimy.yml)
          if [ "$AKTER" != "$vlastnik" ] && [ "$AKTER" != "$asistent" ]; then
            echo "::error::Oponenturu spouští jen vlastník nebo asistent zadání, ne $AKTER."
            exit 1
          fi
          echo "vlastnik=$vlastnik" >> "$GITHUB_OUTPUT"
          echo "asistent=$asistent" >> "$GITHUB_OUTPUT"

      # Problém jde do pracovní složky (.oponentura/problem.md). Nápad z issue, volné issue a komentáře vlastníka
      # a asistenta leží v $RUNNER_TEMP/skryte, kam modely nevidí; do složky se dostanou až v pozdějších fázích.
      - name: Podklady z issue
        id: podklady
        env:
          VLASTNIK: ${{ steps.kdo.outputs.vlastnik }}
          ASISTENT: ${{ steps.kdo.outputs.asistent }}
        run: |
          mkdir -p .oponentura "$RUNNER_TEMP/skryte"
          gh api "repos/$GH_REPO/issues/$CISLO" > "$RUNNER_TEMP/issue.json"
          if jq -e '.pull_request' "$RUNNER_TEMP/issue.json" > /dev/null; then echo "::error::#$CISLO je PR, ne issue."; exit 1; fi
          gh api --paginate "repos/$GH_REPO/issues/$CISLO/comments" | jq -s 'add // []' > "$RUNNER_TEMP/komentare.json"
          python3 - <<'PY'
          import json, os, re
          tmp = os.environ["RUNNER_TEMP"]
          issue = json.load(open(f"{tmp}/issue.json", encoding="utf-8"))
          komentare = json.load(open(f"{tmp}/komentare.json", encoding="utf-8"))
          duveryhodni = {os.environ["VLASTNIK"], os.environ["ASISTENT"]}
          telo = re.sub(r"<!--.*?-->", "", issue.get("body") or "", flags=re.S).strip()
          hlavicka = f"# Issue #{issue['number']}: {issue['title']}\n\n"
          prazdne = lambda t: not t.strip() or t.strip() in ("_No response_",) or t.strip().startswith("Nepovinné")
          oddily = re.split(r"(?m)^#{2,3}[ \t]+", telo)
          sablona = re.search(r"(?mi)^#{2,3}[ \t]+Co chceme získat", telo) is not None
          napad = ""
          if sablona:
              problem = []
              for o in oddily[1:]:
                  nadpis, _, obsah = o.partition("\n")
                  if re.match(r"(?i)(nápad|návrh) (na )?řešení", nadpis.strip()):
                      if not prazdne(obsah):
                          napad = obsah.strip()
                  else:
                      problem.append(f"### {nadpis.strip()}\n\n{obsah.strip()}\n")
              open(".oponentura/problem.md", "w", encoding="utf-8").write(hlavicka + "\n".join(problem))
              rezim = "sablona"
          else:
              open(f"{tmp}/skryte/issue.md", "w", encoding="utf-8").write(hlavicka + telo + "\n")
              napad = telo
              rezim = "volne"
          if napad:
              open(f"{tmp}/skryte/napad.md", "w", encoding="utf-8").write(napad + "\n")
          dopl = [f"**{k['user']['login']}**, {k['created_at'][:10]}:\n\n{(k.get('body') or '').strip()}\n"
                  for k in komentare if k["user"]["login"] in duveryhodni and "## Oponentura" not in (k.get("body") or "")]
          open(f"{tmp}/skryte/komentare.md", "w", encoding="utf-8").write("\n---\n\n".join(dopl) or "Žádné komentáře vlastníka ani asistenta.\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"rezim={rezim}\nnapad={'ano' if napad else 'ne'}\n")
          print(rezim, "nápad:", bool(napad), "komentářů:", len(dopl))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Připnutá verze bez skriptů závislostí; binárku (volitelná závislost téže verze) propojí jen install.cjs
      # samotného balíčku. Novou verzi připni až po ověření s Kimi.
      - name: Claude Code
        env:
          VERZE: "2.1.289"
        run: |
          npm install -g "@anthropic-ai/claude-code@$VERZE" --ignore-scripts --no-audit --no-fund
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
          # zavolej.sh <claude|kimi> <zadání> <výstup> [web]: model dostane jen svůj klíč přes env -i.
          cat > "$RUNNER_TEMP/zavolej.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          model=$1; zadani=$2; vystup=$3; web=${4:-}
          nastroje=(Read Glob Grep); zakaz='"Bash","Edit","MultiEdit","Write","NotebookEdit","Task","Agent"'
          if [ "$web" = web ]; then nastroje+=(WebSearch WebFetch); else zakaz="$zakaz,\"WebFetch\",\"WebSearch\""; fi
          nastaveni="$RUNNER_TEMP/nastaveni-$model.json"
          printf '{"permissions":{"deny":[%s,"Read(//proc/**)","Read(//sys/**)","Read(//etc/**)","Read(//tmp/**)","Read(//root/**)","Read(//home/runner/.*/**)","Read(//home/runner/work/_temp/**)","Read(//home/runner/work/_actions/**)"]}}' "$zakaz" > "$nastaveni"
          spolecne=(HOME="$HOME" PATH="$PATH" CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1)
          case "$model" in
            claude)
              [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || { echo "::error::Chybí secret CLAUDE_CODE_OAUTH_TOKEN."; exit 1; }
              prostredi=("${spolecne[@]}" CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN") ;;
            kimi)
              [ -n "${KIMI_API_KEY:-}" ] || { echo "::error::Chybí secret KIMI_API_KEY."; exit 1; }
              prostredi=("${spolecne[@]}" ANTHROPIC_BASE_URL="$KIMI_URL" ANTHROPIC_API_KEY="$KIMI_API_KEY"
                ANTHROPIC_MODEL="$KIMI_MODEL" ANTHROPIC_DEFAULT_OPUS_MODEL="$KIMI_MODEL" ANTHROPIC_DEFAULT_SONNET_MODEL="$KIMI_MODEL"
                ANTHROPIC_DEFAULT_HAIKU_MODEL="$KIMI_MODEL" ANTHROPIC_DEFAULT_FABLE_MODEL="$KIMI_MODEL" CLAUDE_CODE_SUBAGENT_MODEL="$KIMI_MODEL"
                CLAUDE_CODE_EFFORT_LEVEL=high CLAUDE_CODE_AUTO_COMPACT_WINDOW=262144 CLAUDE_CODE_MAX_CONTEXT_TOKENS=262144) ;;
            *) echo "::error::Neznámý model $model."; exit 1 ;;
          esac
          surovy="$RUNNER_TEMP/surovy-$model-$(basename "$vystup").json"
          for pokus in 1 2; do
            if env -i "${prostredi[@]}" claude -p "$(cat "$zadani")" --settings "$nastaveni" \
                --allowedTools "${nastroje[@]}" --max-turns 60 --output-format json > "$surovy" \
               && jq -e '.is_error | not' "$surovy" > /dev/null \
               && jq -r '.result // empty' "$surovy" > "$vystup" && [ -s "$vystup" ]; then
              echo "$model: $(wc -c < "$vystup") znaků do $vystup"; exit 0
            fi
            echo "::warning::$model, pokus $pokus selhal: $(jq -r '.result // .' "$surovy" 2>/dev/null | head -c 300)"
            sleep 30
          done
          rm -f "$vystup"; exit 1
          SH
          chmod +x "$RUNNER_TEMP/zavolej.sh"

      - name: Průzkum (Claude Code, web)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REZIM: ${{ steps.podklady.outputs.rezim }}
        run: |
          # Volné issue: průzkum z něj problém odvodí, proto ho na tuto fázi vidí.
          if [ "$REZIM" = volne ]; then cp "$RUNNER_TEMP/skryte/issue.md" .oponentura/issue.md; fi
          "$RUNNER_TEMP/zavolej.sh" claude "$FAZE/pruzkum.md" .oponentura/pruzkum.md web
          rm -f .oponentura/issue.md

      - name: Návrh naslepo (Claude)
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: '"$RUNNER_TEMP/zavolej.sh" claude "$FAZE/navrh.md" "$RUNNER_TEMP/navrh-claude.md"'

      - name: Návrh naslepo (Kimi)
        continue-on-error: true
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: '"$RUNNER_TEMP/zavolej.sh" kimi "$FAZE/navrh.md" "$RUNNER_TEMP/navrh-kimi.md"'

      # Kandidáti pod náhodnými písmeny: oba návrhy a nápad z issue. Přiřazení zůstává mimo pracovní složku.
      - name: Kandidáti
        run: |
          python3 - <<'PY'
          import json, os, random
          tmp = os.environ["RUNNER_TEMP"]
          zdroje = [("Claude", f"{tmp}/navrh-claude.md"), ("Kimi K3", f"{tmp}/navrh-kimi.md"), ("nápad z issue", f"{tmp}/skryte/napad.md")]
          dostupne = [(autor, open(p, encoding="utf-8").read().strip()) for autor, p in zdroje if os.path.exists(p) and os.path.getsize(p)]
          navrhy = [a for a, _ in dostupne if a != "nápad z issue"]
          if not navrhy:
              raise SystemExit("::error::Žádný model nenapsal návrh.")
          random.SystemRandom().shuffle(dostupne)
          pismena = "ABC"
          text = [f"## Kandidát {pismena[i]}\n\n{obsah}\n" for i, (_, obsah) in enumerate(dostupne)]
          open(".oponentura/kandidati.md", "w", encoding="utf-8").write("\n".join(text))
          json.dump({pismena[i]: autor for i, (autor, _) in enumerate(dostupne)}, open(f"{tmp}/prirazeni.json", "w", encoding="utf-8"), ensure_ascii=False)
          print("kandidátů:", len(dostupne), "návrhy od:", navrhy)
          PY

      - name: Kritika (Claude)
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: '"$RUNNER_TEMP/zavolej.sh" claude "$FAZE/kritika.md" "$RUNNER_TEMP/kritika-claude.md"'

      - name: Kritika (Kimi)
        continue-on-error: true
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: '"$RUNNER_TEMP/zavolej.sh" kimi "$FAZE/kritika.md" "$RUNNER_TEMP/kritika-kimi.md"'

      # Kritiky jsou pro syntézu očíslované, ne podle autora; komentáře vlastníka a asistenta vidí až syntéza.
      - name: Podklady pro syntézu
        run: |
          n=0
          for m in claude kimi; do
            if [ -s "$RUNNER_TEMP/kritika-$m.md" ]; then n=$((n+1)); cp "$RUNNER_TEMP/kritika-$m.md" ".oponentura/kritika-$n.md"; fi
          done
          [ "$n" -gt 0 ] || { echo "::error::Žádná kritika nevznikla."; exit 1; }
          for i in 1 2; do [ -f ".oponentura/kritika-$i.md" ] || echo "Druhá kritika nevznikla (model selhal)." > ".oponentura/kritika-$i.md"; done
          cp "$RUNNER_TEMP/skryte/komentare.md" .oponentura/komentare.md
          cp "$FAZE/synteza.md" "$RUNNER_TEMP/synteza.md"
          printf '\nDoplnění od vlastníka a asistenta zadání jsou v `.oponentura/komentare.md`; mají přednost před tvým výkladem problému.\n' >> "$RUNNER_TEMP/synteza.md"

      - name: Syntéza (Kimi)
        id: synteza_kimi
        continue-on-error: true
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: '"$RUNNER_TEMP/zavolej.sh" kimi "$RUNNER_TEMP/synteza.md" "$RUNNER_TEMP/synteza.md.out" && echo kimi > "$RUNNER_TEMP/predseda"'

      - name: Syntéza (Claude, náhradní)
        if: steps.synteza_kimi.outcome != 'success'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: '"$RUNNER_TEMP/zavolej.sh" claude "$RUNNER_TEMP/synteza.md" "$RUNNER_TEMP/synteza.md.out" && echo claude > "$RUNNER_TEMP/predseda"'

      # Text před nadpisem „## Oponentura“ (úvodní věta modelu) se odřízne; bez nadpisu se nic nezapíše.
      - name: Sestavení komentáře
        env:
          KLIC_KIMI: ${{ secrets.KIMI_API_KEY }}
          KLIC_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          REZIM: ${{ steps.podklady.outputs.rezim }}
        run: |
          python3 - <<'PY'
          import json, os, re
          tmp = os.environ["RUNNER_TEMP"]
          cti = lambda p: open(p, encoding="utf-8").read().strip() if os.path.exists(p) else ""
          synteza = cti(f"{tmp}/synteza.md.out")
          m = re.search(r"(?m)^## Oponentura[ \t]*$", synteza)
          if not m:
              raise SystemExit("::error::Syntéza nemá nadpis „## Oponentura“.")
          synteza = synteza[m.start():]
          prirazeni = json.load(open(f"{tmp}/prirazeni.json", encoding="utf-8"))
          predseda = {"kimi": "Kimi K3", "claude": "Claude"}.get(cti(f"{tmp}/predseda"), "?")
          def oddil(nadpis, text, limit):
              text = text if len(text) <= limit else text[:limit] + "\n\n_(zkráceno)_"
              return f"<details>\n<summary>{nadpis}</summary>\n\n{text}\n\n</details>\n"
          autori = ", ".join(f"{k}: {v}" for k, v in sorted(prirazeni.items()))
          kritiky = [(a, cti(f"{tmp}/kritika-{m}.md")) for a, m in (("Claude", "claude"), ("Kimi K3", "kimi"))]
          casti = [synteza, "",
                   oddil("Průzkum (Claude Code)", cti(".oponentura/pruzkum.md"), 12000),
                   oddil(f"Kandidáti ({autori})", cti(".oponentura/kandidati.md"), 16000)]
          casti += [oddil(f"Kritika ({a})", t, 9000) for a, t in kritiky if t]
          poznamka = " Issue nebylo podle šablony Problém: problém odvodil průzkum a text issue byl jedním z kandidátů." if os.environ["REZIM"] == "volne" else ""
          beh = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GH_REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          casti.append(f"---\n_Oponentura podle skillu `oponentura`: průzkum Claude, návrhy a kritiky Claude a Kimi K3 naslepo, syntéza {predseda}.{poznamka} [Běh workflow]({beh})._\n")
          vysledek = "\n".join(casti)
          for klic in (os.environ.get("KLIC_KIMI", ""), os.environ.get("KLIC_CLAUDE", "")):
              if klic and klic in vysledek:
                  raise SystemExit("::error::Výstup obsahuje klíč, nezapisuji.")
          open(f"{tmp}/oponentura.md", "w", encoding="utf-8").write(vysledek)
          print(len(vysledek), "znaků")
          PY

      - name: Komentář do issue
        run: gh api "repos/$GH_REPO/issues/$CISLO/comments" -F "body=@$RUNNER_TEMP/oponentura.md" --jq .html_url

      # Token App (#403): změna štítků spustí Tabule; karta se vrátí do Návrhu (nebo do stavu podle schvaleno).
      # Vzniká až po krocích s modely, které k výstupům kroků přístup nemají.
      - name: Token App prijimacky-ai
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PRIJIMACKY_AI_CLIENT_ID }}
          private-key: ${{ secrets.PRIJIMACKY_AI_PRIVATE_KEY }}
          permission-issues: write

      - name: Štítky
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          stitky=$(gh api "repos/$GH_REPO/issues/$CISLO/labels" --jq '[.[].name]')
          if jq -e 'index("oponentura")' <<< "$stitky" > /dev/null; then
            gh api -X DELETE "repos/$GH_REPO/issues/$CISLO/labels/oponentura" > /dev/null
          fi
          if ! jq -e 'index("navrh") or index("schvaleno")' <<< "$stitky" > /dev/null; then
            gh api "repos/$GH_REPO/issues/$CISLO/labels" -f 'labels[]=navrh' > /dev/null
          fi

      - name: Oznámení o selhání
        if: failure() && steps.kdo.outcome == 'success'
        run: |
          gh api "repos/$GH_REPO/issues/$CISLO/comments" -f body="Oponentura se nepovedla, štítek \`oponentura\` zůstává. Podrobnosti v [běhu workflow]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID); znovu ji spustíš odebráním a přidáním štítku." > /dev/null || true
