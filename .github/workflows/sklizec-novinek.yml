name: Sklízeč školních novinek

# Sklízí novinky z RSS/Atom feedů školních webů a zapisuje je do databáze.
# Návrh: docs/skolske-novinky-rss-2027.md, oddíly 3.1–3.3.
#
# Běh je autonomní: nic nečeká na schválení. Nejisté položky končí u neutrálního
# odkazu, ne ve frontě k moderaci.
#
# Naplánovaný běh se stěhuje na Railway (railway.json, Dockerfile.sklizec).
# Actions čas spuštění nezaručují a obě naplánovaná spuštění 20. 9. se nekonala;
# navíc část českých webů odtamtud odpovídá HTTP 403. Rozbor v
# docs/skolske-novinky-rss-2027.md, oddíl 3.3.
#
# Podmínka z review PR #133 zněla: plán tady nechat, dokud nebude doložený
# úspěšný běh na Railway se zápisem do `sklizen_beh`. Splněno 20. 9. v 18:29 UTC
# (`zdroju_zkouseno` 1, `zdroju_ok` 1, `verze_pravidel` 2026-09-20.6, bez chyby),
# `DATABASE_URL` je na službě nastavená. Plán se proto ruší.
#
# Dva plány naráz by navíc škodily: obě místa míří na 04:10 UTC a to, které
# doběhne první, posune `dalsi_kontrola_at` u zdrojů, takže by se nedalo říct,
# ze které sítě výsledek pochází.
#
# Zůstává ruční záloha. Zapisuje do `sklizen_beh` stejně jako běh na Railway,
# takže se dvojí sklizeň pozná.

on:
  workflow_dispatch:
    inputs:
      jen:
        description: "omezit počet škol (zkouška); prázdné = všechny"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sklizec-novinek
  cancel-in-progress: false

jobs:
  sklizen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bez databáze nemá běh smysl
        run: |
          # Fail-closed: chybějící konfigurace je jiný stav než výpadek, ale ani
          # v jednom případě se nesmí tvářit jako úspěšná sklizeň s nulou položek.
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL není nastavený – sklizeň se nespouští."
            exit 1
          fi

      - run: npm ci
      - run: pip install requests

      - name: Stav zdrojů z databáze
        run: node --experimental-strip-types scripts/skolni-novinky-zapis.mjs --export-stav /tmp/stav.json

      - name: Sklidit feedy
        run: |
          python3 scripts/sklizec-novinek.py \
            --stav /tmp/stav.json \
            --vystup /tmp/davka.json \
            ${{ inputs.jen && format('--jen {0}', inputs.jen) || '' }}

      - name: Zapsat dávku
        run: node --experimental-strip-types scripts/skolni-novinky-zapis.mjs --davka /tmp/davka.json

      - name: Uložit dávku k nahlédnutí
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davka-${{ github.run_id }}
          path: /tmp/davka.json
          retention-days: 7
