# Štítky oblastí na PR podle .github/labeler.yml (docs/navrh-rizeni-vyvoje-2027.md, oddíl 14).
# Slouží přehledu; brána si oblasti počítá sama z diffu.
# pull_request_target: konfigurace se bere z main a kód z PR se nespouští.
name: Oblasti PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  oblasti:
    name: Štítky oblastí
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
