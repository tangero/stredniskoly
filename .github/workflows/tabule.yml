# Tabule projektu „Přijímačky – vývoj webu“ podle štítků (docs/spoluprace-na-githubu.md, oddíl 3).
# Stav karty issue se dopočítá ze štítků a otevřených PR (scripts/tabule/stav.mjs):
# Hlášení, Návrh (navrh nebo stop), Oponentura, Schváleno, V PR, Čeká na souhlas s merge, Hotovo.
# Nahrazuje tabule-schvaleno.yml. Ruční přesun karty se při dalším běhu srovná podle štítků.
#
# PROJECT_TOKEN: klasický token se scopes `project` a `public_repo`; fine-grained token do projektu
# na osobním účtu zapisovat neumí. Kód z PR se nespouští (pull_request_target, checkout main).
name: Tabule

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  pull_request_target:
    types: [opened, reopened, closed, edited, labeled, unlabeled, synchronize]
  schedule:
    - cron: "13 4 * * *"
  # Stav „Čeká na souhlas s merge“ zná až dokončená brána; tabule běžící souběžně s ní by ho minula.
  workflow_run:
    workflows: ["Brána sloučení"]
    types: [completed]
  workflow_dispatch:
    inputs:
      nanecisto:
        description: "Jen vypsat změny"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

jobs:
  stitky:
    name: Štítek navrh podle schvaleno
    if: github.event_name == 'issues' && github.event.label.name == 'schvaleno'
    runs-on: ubuntu-latest
    # Fronta jen pro totéž issue: čekající běh zruší jen novější událost téhož issue, a ta čte aktuální stav.
    concurrency:
      group: tabule-stitky-${{ github.event.issue.number }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CISLO: ${{ github.event.issue.number }}
    steps:
      - name: Upravit štítek navrh
        run: |
          set -euo pipefail
          # Podle aktuálních štítků, ne podle akce události: schválení ukončí návrh, odvolání schválení
          # vrátí otevřené interní zadání do návrhu.
          stav="$(gh issue view "$CISLO" -R "$REPO" --json state,labels --jq '[.state,
            (any(.labels[]; .name == "interni")), (any(.labels[]; .name == "schvaleno")),
            (any(.labels[]; .name == "navrh"))] | map(tostring) | join(" ")')"
          read -r otevreno interni schvaleno navrh <<< "$stav"
          if [ "$schvaleno" = "true" ] && [ "$navrh" = "true" ]; then
            gh issue edit "$CISLO" -R "$REPO" --remove-label navrh
          elif [ "$schvaleno" = "false" ] && [ "$navrh" = "false" ] && [ "$otevreno" = "OPEN" ] && [ "$interni" = "true" ] \
               && [ "${{ github.event.action }}" = "unlabeled" ]; then
            gh issue edit "$CISLO" -R "$REPO" --add-label navrh
          fi

  sync:
    name: Stav karet podle štítků
    needs: [stitky]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Synchronizace je idempotentní a čte aktuální stav; zrušený čekající běh nahradí novější.
    concurrency:
      group: tabule-sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Závislosti
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Srovnat stavy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          NANECISTO: ${{ inputs.nanecisto && '1' || '' }}
        run: node scripts/tabule/sync.mjs
