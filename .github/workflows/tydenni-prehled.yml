# Týdenní přehled pro vlastníka (docs/navrh-rizeni-vyvoje-2027.md, oddíl 16): rozhodnutí štítky
# `schvaleno`, `zamitnuto`, `stop` za týden s účtem, který je udělal (zpětná kontrola podle RA35),
# sloučené PR, co čeká na vlastníka, červené CI na main a expirace tokenů. Dlouhá verze je v souhrnu
# běhu, krátká jde do Telegramu (bot datové linky).
#
# PROJECT_TOKEN vlastníka se použije jen na dotaz na vlastní expiraci (hlavička odpovědi /rate_limit). Token App
# prijimacky-ai (#403) jen s právem metadata: přehled ověří, že se App přihlásí. Nic jiného s nimi skript nedělá.
#
# Oddíl Ponaučení (#521, scripts/prehled/ponauceni.mjs): signály o selhání agentů z GitHubu tohoto repozitáře
# a nejvýš 3 návrhy změny pravidel AI od modelu Codex přes OpenRouter (OPENROUTER_API_KEY jako triáž, model
# v proměnné PONAUCENI_MODEL). Bez klíče nebo při selhání modelu jen výpis signálů. `issues: write` je jen na
# stavový komentář evidence návrhů (issue „Ponaučení: evidence návrhů“); `contents` zůstává čtení: workflow
# nemění CLAUDE.md, .claude ani skills a nezakládá PR.
name: Týdenní přehled

on:
  schedule:
    # Pondělí 5:47 UTC (7:47 letního času v Praze), mimo celou hodinu.
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

jobs:
  prehled:
    name: Týdenní přehled
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Závislosti
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Selhání přihlášení App nezastaví přehled; přehled ho ohlásí.
      - name: Přihlášení App prijimacky-ai
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PRIJIMACKY_AI_CLIENT_ID }}
          private-key: ${{ secrets.PRIJIMACKY_AI_PRIVATE_KEY }}
          permission-metadata: read

      - name: Přehled
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PONAUCENI_MODEL: ${{ vars.PONAUCENI_MODEL }}
        run: node scripts/prehled/tydenni.mjs
