# Štítek `schvaleno` přesune issue na tabuli projektu do sloupce Schváleno
# a odebere štítek `navrh`; odebrání `schvaleno` vrátí otevřené issue ze
# Schváleno do Návrhu. Vestavěné automatizace GitHub Projects na štítky
# nereagují (docs/spoluprace-na-githubu.md, oddíl 3).
#
# PROJECT_TOKEN: klasický token se scopes `project` a `public_repo`.
# Fine-grained token do projektu na osobním účtu zapisovat neumí.
name: Tabule – schváleno

on:
  issues:
    types: [labeled, unlabeled]

permissions: {}

# Skupinu sdílejí jen události štítku schvaleno. Jiné štítky dostanou vlastní
# skupinu, aby čekající běh (třeba odvolání schválení) nenahradily.
concurrency:
  group: tabule-${{ github.event.issue.number }}-${{ github.event.label.name == 'schvaleno' && 'schvaleno' || github.run_id }}

env:
  GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
  REPO: ${{ github.repository }}
  CISLO: ${{ github.event.issue.number }}
  ISSUE_ID: ${{ github.event.issue.node_id }}
  PROJEKT: PVT_kwHOAA82bs4BlVwZ
  POLE_STATUS: PVTSSF_lAHOAA82bs4BlVwZzhkDBOk
  NAVRH: be278a86
  SCHVALENO: 2d8cc121

jobs:
  schvaleno:
    if: github.event.action == 'labeled' && github.event.label.name == 'schvaleno'
    runs-on: ubuntu-latest
    steps:
      - name: Status Schváleno
        run: |
          set -euo pipefail
          # Schválení platí, dokud je issue otevřené a má štítek schvaleno.
          # Zavřené issue patří do Hotovo (automatizace Item closed).
          platne() {
            gh issue view "$CISLO" -R "$REPO" --json state,labels \
              --jq '.state == "OPEN" and any(.labels[]; .name == "schvaleno")'
          }
          if [ "$(platne)" != "true" ]; then
            echo "Issue #$CISLO není otevřené se štítkem schvaleno, nic neměním"
            exit 0
          fi
          gh issue edit "$CISLO" -R "$REPO" --remove-label navrh

          # addProjectV2ItemById je idempotentní: issue, které už na tabuli je,
          # nepřidá znovu a vrátí jeho stávající položku.
          polozka=$(gh api graphql -f query='
            mutation($p: ID!, $c: ID!) { addProjectV2ItemById(input: {projectId: $p, contentId: $c}) { item { id } } }' \
            -f p="$PROJEKT" -f c="$ISSUE_ID" --jq '.data.addProjectV2ItemById.item.id')
          nastav() {
            gh api graphql -f query='
              mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                updateProjectV2ItemFieldValue(input: {projectId: $p, itemId: $i, fieldId: $f,
                  value: {singleSelectOptionId: $o}}) { projectV2Item { id } } }' \
              -f p="$PROJEKT" -f i="$polozka" -f f="$POLE_STATUS" -f o="$SCHVALENO" >/dev/null
          }
          stav() {
            gh api graphql -f query='
              query($i: ID!) { node(id: $i) { ... on ProjectV2Item {
                fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { optionId } } } } }' \
              -f i="$polozka" --jq '.data.node.fieldValueByName.optionId // ""'
          }
          # Přidání na tabuli (i automatické u nového issue) spouští automatizaci
          # „Item added“, která asynchronně nastaví Návrh a může přepsat Schváleno.
          # Stav se proto sleduje celé okno (5 × 15 s), ne jen do prvního úspěchu.
          # Znovu se nastavuje jen Návrh nebo prázdný stav (to dělá automatizace);
          # jiný sloupec, třeba Oponentura, zvolil člověk během okna a zůstává.
          # Před prvním nastavením se stav nečte záměrně: přidání schvaleno je
          # schválení a přesune issue do Schváleno z kteréhokoli sloupce.
          nastav
          for pokus in 1 2 3 4 5; do
            sleep 15
            if [ "$(platne)" != "true" ]; then
              echo "Issue #$CISLO už není otevřené se štítkem schvaleno, Status nechávám"
              exit 0
            fi
            ted=$(stav)
            if [ "$ted" = "$NAVRH" ] || [ -z "$ted" ]; then
              echo "Kontrola $pokus: Status přepsán na Návrh, nastavuji znovu"
              nastav
            elif [ "$ted" != "$SCHVALENO" ]; then
              echo "Issue #$CISLO přesunuto ručně do jiného sloupce, Status nechávám"
              exit 0
            fi
          done
          sleep 5
          ted=$(stav)
          if [ "$(platne)" = "true" ] && { [ "$ted" = "$NAVRH" ] || [ -z "$ted" ]; }; then
            echo "::error::Issue #$CISLO: Status se nepodařilo udržet na Schváleno"
            exit 1
          fi
          echo "Issue #$CISLO: Status Schváleno"

  odvolano:
    if: github.event.action == 'unlabeled' && github.event.label.name == 'schvaleno'
    runs-on: ubuntu-latest
    steps:
      - name: Ze Schváleno zpět do Návrhu
        run: |
          set -euo pipefail
          # Jen otevřené issue bez schvaleno, které na tabuli stojí ve Schváleno.
          # Jiný sloupec (Oponentura, Hotovo) zvolil člověk nebo automatizace.
          if [ "$(gh issue view "$CISLO" -R "$REPO" --json state,labels \
                --jq '.state == "OPEN" and (any(.labels[]; .name == "schvaleno") | not)')" != "true" ]; then
            echo "Issue #$CISLO je zavřené nebo znovu schválené, nic neměním"
            exit 0
          fi
          polozka=$(gh api graphql -f query='
            query($id: ID!) { node(id: $id) { ... on Issue {
              projectItems(first: 100) { nodes { id project { id }
                fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { optionId } } } } } } }' \
            -f id="$ISSUE_ID" \
            --jq ".data.node.projectItems.nodes[] | select(.project.id == \"$PROJEKT\" and .fieldValueByName.optionId == \"$SCHVALENO\") | .id")
          if [ -z "$polozka" ]; then
            echo "Issue #$CISLO na tabuli ve Schváleno není, nic neměním"
            exit 0
          fi
          gh api graphql -f query='
            mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
              updateProjectV2ItemFieldValue(input: {projectId: $p, itemId: $i, fieldId: $f,
                value: {singleSelectOptionId: $o}}) { projectV2Item { id } } }' \
            -f p="$PROJEKT" -f i="$polozka" -f f="$POLE_STATUS" -f o="$NAVRH" >/dev/null
          echo "Issue #$CISLO: Status Návrh"
          # Interní zadání čekající na schválení nese štítek navrh (formulář ho přidává).
          if [ "$(gh issue view "$CISLO" -R "$REPO" --json labels --jq 'any(.labels[]; .name == "interni")')" = "true" ]; then
            gh issue edit "$CISLO" -R "$REPO" --add-label navrh
          fi
