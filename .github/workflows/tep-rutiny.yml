# Tep rutiny Claude Code (#440, #461, scripts/provoz/tep-rutiny.mjs). Rutina na začátku každého běhu přepíše
# komentář se značkou v issue Tep rutiny (#462). Kontrola zjistí čas jeho poslední úpravy; po 12 hodinách ticha
# pošle vlastníkovi zprávu do Telegramu (pak jednou denně, dokud tep nepřijde). Spouští ji Plánovač každou hodinu,
# plán GitHubu je záloha.
#
# Pojistky: čtení komentářů a zápis jediného komentáře kontroly do #462, secrets jen Telegram, kód z PR se nespouští,
# skript bez závislostí.
name: Tep rutiny

on:
  workflow_dispatch:
  schedule:
    # Záloha Plánovače, v 23. minutě.
    - cron: "23 * * * *"

permissions: {}

concurrency:
  group: tep-rutiny
  cancel-in-progress: false

jobs:
  kontrola:
    name: Kontrola tepu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/provoz
      - name: Kontrola
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/provoz/tep-rutiny.mjs
