# Automatické slučování (docs/navrh-rizeni-vyvoje-2027.md, oddíl 9, RA40): po každém doběhnutí brány
# sloučí PR, které brána pustila, stejným skriptem jako AI v relaci (scripts/brana/sloucit.mjs).
# Vypíná ho `slucovani_ai: false` v .github/rezimy.yml; veto je štítek `stop`.
#
# Token GitHub App prijimacky-ai (#403, RA47): komentář s žádostí o vyhodnocení musí spustit workflow brány,
# a to komentář od GITHUB_TOKEN neudělá. Token platí hodinu, jen pro tento repozitář a s právy níže; App není
# v Bypass listu rulesetu, takže povinné kontroly platí i pro ni. Kód z PR se nespouští (checkout main).
# Bez secrets App krok tokenu selže a nic se nesloučí; náhradní token se záměrně nepoužívá.
name: Sloučení

on:
  workflow_run:
    # Po bráně, a po testech: brána bývá hotová dřív než povinné testy a sloučení pak GitHub odmítne.
    workflows: ["Brána sloučení", "Testy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Jedna fronta: čekající běh nahradí novější, ten projde všechny otevřené PR znovu.
concurrency:
  group: slouceni

jobs:
  slucit:
    name: Sloučit PR, které brána pustila
    # Po neúspěšném běhu (třeba spadlé testy) není co slučovat.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Závislosti
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Token App prijimacky-ai
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PRIJIMACKY_AI_CLIENT_ID }}
          private-key: ${{ secrets.PRIJIMACKY_AI_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-checks: read

      - name: Sloučit
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/brana/slucit-pripravene.mjs
