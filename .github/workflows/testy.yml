name: Testy

# Do 17. 9. 2026 projekt žádné obecné CI neměl: jediné testy běžely uvnitř
# workflow datové linky, a to jen tests/test_datova_linka.py. Proto si nikdo
# nevšiml, že dva testy jsou rozbité — jeden porovnával syntetická data s ostrým
# public/maturita_skoly.json, druhý byl psaný v pytestu, který se neinstaluje.
on:
  push:
    branches-ignore:
      - linka/stav
  pull_request:
  workflow_dispatch:
    inputs:
      deployment:
        description: "Nasazení po kontrolách (production pouze z main)"
        type: choice
        options:
          - preview
          - production-staged
          - production
          - none
        default: preview

permissions:
  contents: read

jobs:
  python:
    name: Python testy a kontroly dat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Závislosti
        run: pip install openpyxl

      - name: Testy
        run: python3 -m unittest discover -s tests

      - name: Stav datových sad
        # Období v registru musí odpovídat datům a každý ukazatel ze slovníku
        # musí patřit nějaké sadě.
        run: python3 scripts/stav-datovych-sad.py kontrola

      - name: Letopočty napevno
        # Rok se bere z registru, ne z kódu. Hlásí jen nové výskyty proti základu.
        run: python3 scripts/kontrola-letopoctu.py

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: testy importují moduly v TypeScriptu a odstraňování typů
          # (--experimental-strip-types) přibylo až ve 22.6. Na Node 20 by JS testy
          # nešlo spustit vůbec, proto v CI dosud neběžely.
          node-version: "22"
          cache: npm

      - name: Závislosti
        run: npm ci

      - name: Typy
        run: npx tsc --noEmit

      - name: JS testy
        run: npm run test:js

      # Testy přehledu města vykreslují komponenty a volají API, takže importují
      # přes alias `@/` a bez přípony; to `node --experimental-strip-types` neumí.
      # Běží proto přes tsx, ne v kroku výše.
      - name: Testy přehledu města
        run: npm run test:mesto

  integrace:
    name: Integrace katalogu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Adresa se předává výslovně; jednotlivé integrační testy mají různé výchozí porty.
      BASE_URL: http://localhost:3228
    # Hlídá invariant, na kterém stojí adresy: každá nabídka ročníku má vlastní
    # stránku. Než tenhle test 19. 9. 2026 začal běžet v CI, prošla změna, po které
    # dvě nabídky sdílely adresu a jedna ukazovala čísla té druhé.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Závislosti
        run: npm ci

      - name: Spustit web
        # Vývojový server stačí: test sahá na pár stránek a na API, a build všech
        # 1 175 stránek by v CI trval řádově dýl než samotná kontrola.
        run: npm run dev -- --port 3228 > /tmp/dev.log 2>&1 &

      - name: Počkat, až web naběhne
        run: |
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null "$BASE_URL/api/schools/search?krajeOnly=1"; then
              echo "web běží po ${i} s"
              exit 0
            fi
            sleep 1
          done
          echo "web nenaběhl do 120 s; výpis serveru:"
          cat /tmp/dev.log
          exit 1

      - name: Test katalogu
        run: npm run test:integrace

      - name: Výpis serveru při selhání
        if: failure()
        run: cat /tmp/dev.log

  deploy:
    name: Build na GitHubu a nasazení na Vercel
    needs: [python, typescript, integrace]
    # PR testy (včetně forků) nemají přístup k deploy secrets. Automatický
    # provoz zapneme až po zkoušce přes workflow_dispatch.
    if: >-
      github.actor != 'dependabot[bot]' &&
      ((github.event_name == 'push' && vars.VERCEL_ACTIONS_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deployment != 'none'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # statuses: write jen pro zápis adresy náhledu ke commitu (krok „Adresa náhledu ke commitu“).
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: vercel-stredniskoly-${{ github.ref }}
      # Probíhající publikaci produkce nepřerušovat. Starší SHA se navíc
      # kontroluje před buildem i před přiřazením produkční domény.
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      DEPLOYMENT: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' && 'production' || 'preview') || inputs.deployment }}
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Shodné s Node.js Version 24.x v projektu stredniskoly na Vercelu.
          node-version: '24'
          cache: npm

      # Do veřejné Actions cache neukládáme .vercel (obsahuje secrets)
      # ani Next fetch-cache. Cíl je pouze cache kompilátoru.
      - uses: actions/cache@v4
        with:
          path: |
            .next/cache/webpack
            .next/cache/turbopack
          key: next-build-${{ runner.os }}-node24-${{ env.DEPLOYMENT }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-build-${{ runner.os }}-node24-${{ env.DEPLOYMENT }}-${{ hashFiles('package-lock.json') }}-

      - name: Závislosti a pevná verze Vercel CLI
        run: |
          npm ci
          npm install --global vercel@60.1.3

      - name: Sestavit a nasadit hotový výstup
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bash scripts/vercel-deploy.sh

      # Adresa náhledu jako stav commitu „Náhled (Vercel)“: Claude Code ji čte přes REST API
      # (commits/<sha>/statuses) pro ověření na preview (.claude/skills/overeni-preview).
      - name: Adresa náhledu ke commitu
        if: steps.deploy.outputs.url != '' && env.DEPLOYMENT == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context='Náhled (Vercel)' -f target_url="$URL" \
            -f description='Náhled nasazený z tohoto commitu' >/dev/null

      - name: Odstranit stažené prostředí a výstup s konfigurací
        if: always()
        run: rm -rf .vercel
