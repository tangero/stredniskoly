name: CSI Weekly Refresh

on:
  schedule:
    - cron: "15 5 * * 1" # every Monday 05:15 UTC
  workflow_dispatch:
    inputs:
      force_email:
        description: "Send success email even if no data changes (test mode)"
        type: boolean
        required: false
        default: false
      review_pr_url:
        description: "Optional existing PR URL for review-only LLM comment"
        type: string
        required: false
      review_ref:
        description: "Git ref to read diff from in review-only mode"
        type: string
        required: false
        default: "codex/csi-weekly-refresh"
      shrnuti_i_bez_zmeny:
        description: "Shrnout zprávy bez shrnutí a založit PR i bez změny seznamu inspekcí (jen ruční spuštění, #266)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
      pr_url: ${{ steps.create_pr.outputs.pull-request-url }}
      changed_summary: ${{ steps.summary.outputs.changed_summary }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run CSI refresh
        id: refresh
        run: node scripts/process-csi-data.js

      - name: Build changed summary
        id: summary
        run: |
          node <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('data/csi_diff_latest.json','utf8'));
          const s=d.summary||{};
          const out='added:'+(s.schools_added||0)+',removed:'+(s.schools_removed||0)+',changed:'+(s.schools_changed||0);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed_summary=${out}\n`);
          NODE

      - name: Decide summaries
        id: shrnout
        # Automaticky jen při změně seznamu; ručně (workflow_dispatch) lze spustit i bez ní.
        run: |
          if [ "${{ steps.refresh.outputs.changed }}" = "true" ]; then
            echo "ano=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.shrnuti_i_bez_zmeny }}" = "true" ]; then
            # Seznam se nezměnil: process-csi-data.js přesto přepíše rozdíl prázdným, do PR nepatří.
            git checkout -- public/csi_inspections.json data/csi_manifest.json data/csi_diff_latest.json
            git clean -fdq -- data/csi_snapshots
            echo "ano=true" >> "$GITHUB_OUTPUT"
          else
            echo "ano=false" >> "$GITHUB_OUTPUT"
          fi

      # Shrnutí nových inspekčních zpráv (#266). Běží při změně seznamu inspekcí, ručně i bez ní; schválený
      # způsob (servery, model, strop, souběh, prodleva) je v inspekce/config/tydenni.json a v #266.
      # Změna kteréhokoli parametru znamená nové ohlášení v issue (CLAUDE.md, pravidlo 7).
      - name: Setup Python
        if: steps.shrnout.outputs.ano == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF tools
        if: steps.shrnout.outputs.ano == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ocrmypdf tesseract-ocr-ces

      - name: Carry over summaries from open PR
        # Nesloučené PR: jeho PDF, texty a výstupy se převezmou, aby se znovu nestahovaly a neplatily
        # a tabulka v PR pokrývala všechny běhy od posledního sloučení. Předpoklad: inspekce/data
        # se na main mezi běhy jinak nemění (ruční dávka jde přes vlastní PR a sloučí se dřív).
        if: steps.shrnout.outputs.ano == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VETEV=codex/csi-weekly-refresh
          # Jen z otevřeného PR: zavřené PR (zamítnutá shrnutí) se nesmí převzetím vzkřísit.
          if [ "$(gh pr list -R "$GITHUB_REPOSITORY" --head "$VETEV" --state open --json number --jq length)" = "0" ]; then
            echo "Otevřené PR není, nic se nepřebírá."
            exit 0
          fi
          if ! git fetch --depth 1 origin "+refs/heads/$VETEV:refs/remotes/origin/$VETEV" 2>/dev/null; then
            echo "Otevřené PR není, nic se nepřebírá."
            exit 0
          fi
          { git diff --name-only --diff-filter=A HEAD "origin/$VETEV" -- inspekce/data
            git diff --name-only --diff-filter=M HEAD "origin/$VETEV" -- inspekce/data/outputs/claude_haiku_4_5
          } | grep -v '^inspekce/data/texts/index.json$' | sort -u > /tmp/prenesene.txt || true
          if [ -s /tmp/prenesene.txt ]; then
            git checkout "origin/$VETEV" --pathspec-from-file=/tmp/prenesene.txt
          fi
          python3 - <<'PY'
          import json, subprocess, sys
          sys.path.insert(0, "inspekce/scripts")
          from extract_texts import sluc_index
          cesta = "inspekce/data/texts/index.json"
          prenesene = {l.rsplit("/", 1)[-1][:-4] for l in open("/tmp/prenesene.txt", encoding="utf-8").read().split()
                       if l.startswith("inspekce/data/texts/") and l.endswith(".txt")}
          if prenesene:
              vetev = json.loads(subprocess.check_output(["git", "show", f"origin/codex/csi-weekly-refresh:{cesta}"]))["reports"]
              main = json.load(open(cesta, encoding="utf-8"))["reports"]
              rows = sluc_index(main, [r for r in vetev if r["report_id"] in prenesene])
              open(cesta, "w", encoding="utf-8").write(json.dumps({"reports": rows}, ensure_ascii=False, indent=2))
          print(f"Převzato z otevřeného PR: {sum(1 for _ in open('/tmp/prenesene.txt'))} souborů, {len(prenesene)} textů")
          PY

      - name: Select reports without summary
        id: vyber
        if: steps.shrnout.outputs.ano == 'true'
        working-directory: inspekce
        run: |
          python3 scripts/generate_manifest.py
          python3 scripts/vyber_chybejici.py --vystup "$RUNNER_TEMP/tydenni_reports.json" --souhrn "$RUNNER_TEMP/vyber.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          v = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "vyber.json")))
          k = json.load(open("config/tydenni.json"))
          print(f"vybrane={len(v['vybrane'])}")
          print(f"workers={k['workers']}")
          print(f"prodleva={k['prodleva_s']}")
          print(f"model={k['model_id']}")
          PY

      - name: Download, extract and summarize reports
        id: shrnuti
        if: steps.shrnout.outputs.ano == 'true' && steps.vyber.outputs.vybrane != '0'
        working-directory: inspekce
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "poznamka=Shrnutí se nespustilo: chybí secret OPENROUTER_API_KEY (vybráno ${{ steps.vyber.outputs.vybrane }} zpráv)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MANIFEST="$RUNNER_TEMP/tydenni_reports.json"
          # Portál ČŠI: jeden dotaz najednou s prodlevou; chyba HTTP (i 429) běh zastaví.
          python3 scripts/download_reports.py --manifest "$MANIFEST" --prodleva "${{ steps.vyber.outputs.prodleva }}"
          python3 scripts/extract_texts.py --manifest "$MANIFEST" --doplnit-index
          # Výběr obsahuje jen zprávy bez použitelného shrnutí, --force přepíše i nepoužitelný výstup téhož modelu.
          python3 scripts/run_extraction.py --manifest "$MANIFEST" --models config/production_models.json \
            --model-ids "${{ steps.vyber.outputs.model }}" --workers "${{ steps.vyber.outputs.workers }}" --force

      - name: Export summaries and update registry
        if: steps.shrnout.outputs.ano == 'true'
        run: |
          (cd inspekce && python3 scripts/export_extractions.py --pro-web --output ../data/inspection_extractions.json)
          if git diff --quiet -- data/inspection_extractions.json; then
            echo "Shrnutí beze změny, registr se nepřepíná."
          else
            OBDOBI=$(python3 -c "import json; d=json.load(open('data/inspection_extractions.json'))['schools']; print(max(z['inspection_to'] for v in d.values() for z in v))")
            DALSI=$(date -u -d '+1 month' +%Y-%m)
            NEJPOZDEJI=$(date -u -d '+35 days' +%F)
            python3 scripts/stav-datovych-sad.py prepni csi-extrakce "$OBDOBI" \
              --soubor data/inspection_extractions.json --kdy "$DALSI" --jistota odhad \
              --zduvodneni "Nové inspekce přibývají průběžně; shrnutí obnovuje týdenní workflow CSI Weekly Refresh." \
              --obnovit-nejpozdeji "$NEJPOZDEJI" \
              --doklad "workflow ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          python3 scripts/stav-datovych-sad.py kontrola

      - name: Build PR body
        if: steps.shrnout.outputs.ano == 'true'
        env:
          POZNAMKA: ${{ steps.shrnuti.outputs.poznamka }}
        run: |
          git add -A inspekce/data
          git diff --cached --name-only --diff-filter=AM HEAD -- inspekce/data/outputs/claude_haiku_4_5 > /tmp/zmenene.txt
          ARGS=()
          [ -n "$POZNAMKA" ] && ARGS+=(--poznamka "$POZNAMKA")
          (cd inspekce && python3 scripts/telo_pr.py --zmenene /tmp/zmenene.txt --souhrn "$RUNNER_TEMP/vyber.json" \
            --vystup "$RUNNER_TEMP/telo_pr.md" "${ARGS[@]}")
          printf '\nDiff summary: `%s`\n' "${{ steps.summary.outputs.changed_summary }}" >> "$RUNNER_TEMP/telo_pr.md"

      - name: Create Pull Request
        id: create_pr
        if: steps.shrnout.outputs.ano == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # CSI_PR_TOKEN (fine-grained PAT, #266): na PR pak běží povinné kontroly. Bez něj GITHUB_TOKEN a CI neběží.
          token: ${{ secrets.CSI_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "Update CSI data with history and diff snapshot"
          branch: "codex/csi-weekly-refresh"
          delete-branch: true
          title: "Weekly CSI refresh: data update detected"
          body-path: ${{ runner.temp }}/telo_pr.md

  llm-review:
    runs-on: ubuntu-latest
    needs: refresh
    if: (needs.refresh.outputs.changed == 'true' && needs.refresh.outputs.pr_url != '') || github.event.inputs.review_pr_url != ''
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.review_ref || 'codex/csi-weekly-refresh' }}

      - name: Prepare review input
        id: prep
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const diffPath = path.join('data', 'csi_diff_latest.json');
          let payload = {
            summary: {},
            changed_schools: [],
            note: 'Diff file not found'
          };
          if (fs.existsSync(diffPath)) {
            const raw = JSON.parse(fs.readFileSync(diffPath, 'utf8'));
            payload = {
              summary: raw.summary || {},
              changed_schools: (raw.changed_schools || []).slice(0, 40),
              added_schools_sample: (raw.added_schools || []).slice(0, 20),
              removed_schools_sample: (raw.removed_schools || []).slice(0, 20)
            };
          }
          fs.writeFileSync('/tmp/csi_llm_input.json', JSON.stringify(payload, null, 2));
          NODE

      - name: Generate LLM review (OpenRouter z-ai/glm-5)
        id: llm
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "LLM review skipped: OPENROUTER_API_KEY is not set."
            {
              echo "review<<EOF"
              echo "## LLM review"
              echo ""
              echo "Skipped: missing \`OPENROUTER_API_KEY\`."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node <<'NODE'
          const fs = require('fs');
          const https = require('https');

          const apiKey = process.env.OPENROUTER_API_KEY;
          const input = JSON.parse(fs.readFileSync('/tmp/csi_llm_input.json', 'utf8'));
          const summary = input.summary || {};
          const riskFlag =
            (summary.schools_removed || 0) > 50 ||
            (summary.schools_added || 0) > 100 ||
            (summary.schools_changed || 0) > 300;

          const systemPrompt =
            'You are a strict data QA reviewer for Czech school inspection ETL. ' +
            'Output concise markdown in Czech with verdict and actionable checklist.';
          const userPrompt =
            'Posuď bezpečnost merge tohoto CSI refresh PR. ' +
            'Vrať sekce: 1) Verdikt (SAFE TO MERGE / REVIEW NEEDED), ' +
            '2) Rizika, 3) Checklist před merge (max 8 bodů), 4) Krátké odůvodnění. ' +
            'Buď konkrétní podle diff dat. ' +
            'Povinně rozliš, zda jde o metadata-only změny (field_changes) nebo změny inspekcí ' +
            '(added/removed inspections, signature diff). Uveď 3 konkrétní REDIZO příklady.\n\n' +
            JSON.stringify(input, null, 2);

          function postJson(url, body) {
            return new Promise((resolve, reject) => {
              const req = https.request(url, {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${apiKey}`,
                  'Content-Type': 'application/json',
                  'HTTP-Referer': 'https://github.com',
                  'X-Title': 'stredniskoly-csi-review'
                }
              }, (res) => {
                let data = '';
                res.on('data', (chunk) => { data += chunk; });
                res.on('end', () => {
                  if (res.statusCode < 200 || res.statusCode >= 300) {
                    return reject(new Error(`OpenRouter HTTP ${res.statusCode}: ${data.slice(0, 500)}`));
                  }
                  resolve(JSON.parse(data));
                });
              });
              req.on('error', reject);
              req.write(JSON.stringify(body));
              req.end();
            });
          }

          (async () => {
            const payload = {
              model: 'z-ai/glm-5',
              temperature: 0.1,
              messages: [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userPrompt }
              ]
            };
            let content = '';
            try {
              const resp = await postJson('https://openrouter.ai/api/v1/chat/completions', payload);
              content = (((resp || {}).choices || [])[0] || {}).message?.content || '';
            } catch (err) {
              content = `## LLM review\n\nOpenRouter call failed: ${err.message}\n`;
            }

            if (!content.trim()) {
              content = '## LLM review\n\nModel nevrátil obsah. Doporučení: ruční kontrola.';
            }
            if (riskFlag && !/REVIEW NEEDED/i.test(content)) {
              content = content.replace(/SAFE TO MERGE/gi, 'REVIEW NEEDED');
            }

            const footer =
              '\n\n---\n' +
              `Model: \`z-ai/glm-5\`  \n` +
              `Workflow: https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            fs.writeFileSync('/tmp/csi_llm_review.md', content.trim() + footer + '\n', 'utf8');
          })().catch((e) => {
            fs.writeFileSync('/tmp/csi_llm_review.md', `## LLM review\n\nUnexpected error: ${e.message}\n`, 'utf8');
          });
          NODE

          {
            echo "review<<EOF"
            cat /tmp/csi_llm_review.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment review to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PR_URL: ${{ github.event.inputs.review_pr_url }}
          REFRESH_PR_URL: ${{ needs.refresh.outputs.pr_url }}
          REVIEW_BODY: ${{ steps.llm.outputs.review }}
        run: |
          if [ -n "$REVIEW_PR_URL" ]; then
            PR_URL="$REVIEW_PR_URL"
          else
            PR_URL="$REFRESH_PR_URL"
          fi
          if [ -z "$PR_URL" ]; then
            echo "No PR URL, skipping comment."
            exit 0
          fi
          printf "%s\n" "$REVIEW_BODY" > /tmp/csi_llm_review.md
          gh pr comment "$PR_URL" --body-file /tmp/csi_llm_review.md || true

  notify-success:
    runs-on: ubuntu-latest
    needs: [refresh, llm-review]
    if: needs.refresh.outputs.changed == 'true' || github.event.inputs.force_email == 'true'
    steps:
      - name: Check mail secrets
        id: mail_check
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ] && [ -n "$NOTIFICATION_EMAIL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Mail secrets are not fully configured; skipping email send."
          fi

      - name: Send email notification
        if: steps.mail_check.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[stredniskoly] CSI data changed and processed"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            CSI weekly refresh detected data changes and finished successfully.

            Summary: ${{ needs.refresh.outputs.changed_summary }}
            PR: ${{ needs.refresh.outputs.pr_url }}
            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: refresh
    if: ${{ always() && needs.refresh.result == 'failure' }}
    steps:
      - name: Check mail secrets
        id: mail_check
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          if [ -n "$MAIL_USERNAME" ] && [ -n "$MAIL_PASSWORD" ] && [ -n "$NOTIFICATION_EMAIL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Mail secrets are not fully configured; skipping email send."
          fi

      - name: Send failure email
        if: steps.mail_check.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[stredniskoly] CSI refresh failed"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            CSI weekly refresh failed.

            Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Please review logs.
