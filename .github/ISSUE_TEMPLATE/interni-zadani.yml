# Interní zadání pro Claude Code (Eduarda → Patrick → Claude Code).
#
# Formulář je v .github/ISSUE_TEMPLATE/, takže ho GitHub nabízí v „New issue“
# (od 1. 10. 2026, dřív záměrně skrytý v .github/INTERNAL_TEMPLATES/). Vidí ho i
# veřejnost; realizaci ale podmiňuje štítek schvaleno, který přidává jen Patrick.
# Veřejné hlášení chyb (tlačítko „Nahlásit chybu“ na webu → bug-report) a portál
# škol (portal-skoly) se tím nemění. Pro zakládání přes API / gh je tělo se
# stejnými poli v .github/INTERNAL_TEMPLATES/interni-zadani.md.
name: Interní zadání (jen pro tým)
description: Interní zadání pro Claude Code. Nepoužívejte pro hlášení chyb, na to slouží tlačítko „Nahlásit chybu“ na webu.
title: "[Zadání] "
labels: ["interni", "navrh"]
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > **Repozitář je veřejný, issue uvidí kdokoli.** Do zadání nepatří jména, e-maily, telefony ani jiné osobní údaje zákazníků, škol, rodičů ani uchazečů. Nepatří sem ani přístupové kódy, tokeny nebo výpisy z produkční databáze. Školu označte RED IZO, osobu rolí („ředitel školy“, „rodič“).
        >
        > Tento formulář je interní. Chcete-li nahlásit chybu na webu, použijte tlačítko **Nahlásit chybu** na prijimackynaskolu.cz.
  - type: textarea
    id: proc
    attributes:
      label: Proč / pro koho
      description: Jaký problém řešíme, koho se týká (rodiče, uchazeči, školy, redakce) a odkud požadavek přišel. Bez osobních údajů.
    validations:
      required: true
  - type: textarea
    id: co
    attributes:
      label: Co přesně změnit
      description: Konkrétní změna. Pokud víte, uveďte soubory, stránky nebo komponenty.
    validations:
      required: true
  - type: textarea
    id: hotovo
    attributes:
      label: Hotovo když
      description: "Kritéria jako checklist. Každé má označení K1, K2… a za pomlčkou, čím se ověří (adresa a šířka náhledu, test, příkaz). Jedno kritérium = jedna kontrola s výsledkem ano/ne; místo „A a B“ napište dvě kritéria. Označení se nepřečíslovávají: rozdělené K3 má K3.1 a K3.2, zrušené kritérium zůstane přeškrtnuté (~~K4: …~~). Protokol z preview musí mít řádek pro každé K a P, jinak ho brána nepustí. Kritérium ve tvaru `ověření: /adresa „očekávaný text“` se po sloučení ověřuje i v produkci (#325)."
      value: |
        - [ ] K1: … - ověření: náhled /…, 390 a 1280 px
        - [ ] K2: … - ověření: …
        - Lint, typy, testy a build hlídá CI.
    validations:
      required: true
  - type: textarea
    id: omezeni
    attributes:
      label: Nesmí se dotknout / omezení
      description: "Co se nesmí změnit (stránky, data, API, SEO adresy…). U změn webu aspoň jedno ověřitelné protikritérium s označením P1, P2… a způsobem ověření, například „P1: adresy v sitemap beze změny - ověření: npm run build“. Změna produkčních dat v Neonu je dovolená jen s migrací, která je výslovně uvedená tady."
      value: |
        - P1: … - ověření: …
        - Žádné refaktory mimo zadání.
        - Produkční data v Neonu beze změny (migrace: žádná).
        - Cizí servery: žádné (jinak uvést server, endpointy, rychlost, data a důvod; před prvním dotazem zapsat do issue, odkud se stahuje, schválení netřeba; CLAUDE.md pravidlo 7).
    validations:
      required: true
  - type: textarea
    id: otazky
    attributes:
      label: Otevřené otázky
      description: Co zatím nevíte a ovlivní řešení. Claude Code nezačne, dokud otázky nejsou zodpovězené nebo přesunuté mimo rozsah (CLAUDE.md, pravidlo 8). Nevíte-li nic, nechte prázdné.
    validations:
      required: false
  - type: textarea
    id: test
    attributes:
      label: Jak otestovat
      description: Postup ověření na Vercel preview (adresa stránky, kroky, očekávaný výsledek) a případné automatické testy.
    validations:
      required: true
  - type: dropdown
    id: velikost
    attributes:
      label: Velikost
      description: "S = do hodiny, jeden soubor; M = pár souborů, do dne; L = víc dní nebo zásah do dat (zvažte rozdělení)."
      options:
        - S
        - M
        - L
    validations:
      required: true
  - type: textarea
    id: odkazy
    attributes:
      label: Související odkazy
      description: Související issues (#N), dokumenty v docs/, stránky webu. Žádné odkazy na soukromou poštu ani sdílené dokumenty s osobními údaji.
    validations:
      required: false
