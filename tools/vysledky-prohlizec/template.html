<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prohlížeč výsledků rešerše návazností 2025–2026</title>
<style>
:root{--blue:#174ba6;--ink:#17263e;--muted:#56667b;--line:#d8e0e9;--paper:#f4f7fa;--green:#245b3e;--green-bg:#e5f3ea;--orange:#8a5a09;--orange-bg:#fff1d9;--gray:#5a6675;--gray-bg:#eceff3}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer;background:white;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:9px 13px;min-height:42px}button:hover{border-color:var(--blue)}button:disabled{opacity:.45;cursor:default}a{color:var(--blue)}header{background:#142b4a;color:white;padding:23px 28px}h1{font-size:25px;margin:2px 0 4px;letter-spacing:-.5px}header p{color:#c7d7eb;margin:0;font-size:13px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;font-weight:700}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.summary .chip{background:#ffffff22;border:1px solid #ffffff3a;border-radius:6px;padding:6px 12px;font-size:13px}.summary .chip strong{font-size:16px;margin-right:5px}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);max-width:1800px;margin:auto}aside{background:white;border-right:1px solid var(--line);height:calc(100vh - 150px);position:sticky;top:0;display:flex;flex-direction:column}.filters{padding:18px;border-bottom:1px solid var(--line)}label{display:block;font-size:12px;color:var(--muted);font-weight:650}input,select{display:block;width:100%;border:1px solid #b9c6d7;border-radius:6px;background:white;color:var(--ink);padding:9px 10px;margin:5px 0 12px}.filters .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}#list{overflow:auto;flex:1}#list button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e5eaf0;border-radius:0;padding:12px 18px;min-height:0}#list button[aria-current=true]{background:#edf3ff;box-shadow:inset 4px 0 var(--blue)}#list strong{font-size:13px;display:block}#list small{display:block;font-size:12px;color:var(--muted);margin-top:3px}.list-footer{padding:12px;display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line)}main{padding:25px 30px 60px;min-width:0}.case-nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h2{font-size:24px;line-height:1.25;letter-spacing:-.4px;margin:9px 0}h3{font-size:17px;margin:0 0 14px}h4{font-size:14px;margin:18px 0 8px}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.id{font-family:ui-monospace,monospace;font-size:11px;overflow-wrap:anywhere;color:var(--muted)}.badge{font-size:11px;display:inline-block;border-radius:4px;padding:3px 7px;background:#e9eff7;color:#294b77;font-weight:650}.badge.done{background:var(--green-bg);color:var(--green)}.badge.todo{background:var(--gray-bg);color:var(--gray)}.st{font-size:12px;display:inline-block;border-radius:4px;padding:3px 9px;font-weight:700}.st-potvrzeno{background:var(--green-bg);color:var(--green)}.st-pravdepodobne{background:#e3edfb;color:#174ba6}.st-rozpor{background:var(--orange-bg);color:var(--orange)}.st-nedohledano{background:var(--gray-bg);color:var(--gray)}.panel{border:1px solid var(--line);border-radius:9px;padding:20px;background:white;margin-top:18px}.panel.registry{border-top:3px solid var(--blue)}.years{display:grid;grid-template-columns:1fr 1fr;gap:14px}.year-col h4{margin-top:0}.offer{border:1px solid var(--line);border-radius:7px;padding:12px 14px;margin-bottom:10px;font-size:13px}.offer strong{display:block;font-size:14px;margin-bottom:6px}dl.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 0}dt{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}dd{margin:4px 0 0;font-weight:600}.offer dd{font-weight:500}table.issues{width:100%;border-collapse:collapse;font-size:13px}table.issues th,table.issues td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}table.issues th{background:#f0f4f9;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}.finding{border:1px solid var(--line);border-radius:9px;padding:18px;margin-top:14px}.finding .head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chipid{font-family:ui-monospace,monospace;font-size:11px;background:#eef2f8;border:1px solid var(--line);border-radius:4px;padding:2px 7px}.conclusion{background:#f2f7ff;border-left:3px solid var(--blue);padding:11px 14px;border-radius:0 6px 6px 0;margin:12px 0;font-size:14px}.warn{background:#fff9e6;border:1px solid #e8cf8f;border-radius:7px;padding:12px 14px;margin-top:12px}.warn strong{color:var(--orange)}details{margin-top:12px}summary{cursor:pointer;font-size:13px;color:var(--blue)}ul.obs{margin:8px 0;padding-left:20px}ul.obs li{margin-bottom:6px;font-size:14px}.rel{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}.rel>div{border:1px dashed var(--line);border-radius:6px;padding:10px 12px;font-size:13px}.addr,.ev{border:1px solid var(--line);border-radius:7px;padding:11px 13px;margin-top:9px;font-size:13px}.addr p,.ev p{margin:3px 0}.ev a{overflow-wrap:anywhere}.empty{padding:40px;text-align:center;color:var(--muted)}.notice{border-left:3px solid #c79332;padding:10px 14px;background:#fff9ee;font-size:14px;margin:13px 0}.result-count{font-size:12px;color:var(--muted)}@media(max-width:1000px){.layout{grid-template-columns:290px minmax(0,1fr)}main{padding:20px}dl.facts{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.layout{display:block}aside{position:relative;height:400px;border-right:0}main{padding:16px}.years,.rel{grid-template-columns:1fr}}
</style>
<header><div class="eyebrow">Přijímačky na školu · interní kontrolní nástroj (read-only)</div><h1>Prohlížeč výsledků rešerše návazností 2025–2026</h1><p id="subtitle"></p><div class="summary" id="summary"></div></header>
<div class="layout"><aside><div class="filters"><label>Hledat název školy, REDIZO, ID úkolu nebo obec<input id="search" type="search" placeholder="Např. gymnázium, 600…, Praha"></label><div class="row"><label>Stav zpracování<select id="fProc"><option value="">Vše</option><option value="done">Zpracováno</option><option value="todo">Nezahájeno</option></select></label><label>Priorita<select id="fPrio"><option value="">Vše</option><option value="1">1</option><option value="2">2</option></select></label></div><div class="row"><label>Status nálezu<select id="fStatus"><option value="">Vše</option><option value="potvrzeno">Potvrzeno</option><option value="pravděpodobné">Pravděpodobné</option><option value="rozpor_zdrojů">Rozpor zdrojů</option><option value="nedohledáno">Nedohledáno</option></select></label><label>Doporučená akce<select id="fAction"><option value="">Vše</option><option value="approve_mapping">Schválit mapování</option><option value="manual_review">Ruční kontrola</option><option value="record_only">Pouze zaznamenat</option><option value="no_action">Bez akce</option></select></label></div><span id="count" class="result-count"></span></div><div id="list"></div><div class="list-footer"><button id="prevPage">← Strana</button><span id="page" class="small"></span><button id="nextPage">Strana →</button></div></aside>
<main><div class="case-nav"><span id="position" class="muted"></span><div><button id="prev">← Předchozí</button> <button id="next">Další →</button></div></div><div id="detail"></div></main></div>
<script id="data" type="application/json">__DATA__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),isUrl=x=>/^https?:\/\//i.test(String(x??''));
const STATUS={potvrzeno:['Potvrzeno','st-potvrzeno'],'pravděpodobné':['Pravděpodobné','st-pravdepodobne'],rozpor_zdrojů:['Rozpor zdrojů','st-rozpor'],nedohledáno:['Nedohledáno','st-nedohledano']};
const ACTIONS={approve_mapping:'Schválit mapování',manual_review:'Ruční kontrola',record_only:'Pouze zaznamenat',no_action:'Bez akce'};
const REL={continuation:'Pokračování nabídky',rename_only:'Pouze přejmenování',new_offer:'Nová nabídka',closed:'Ukončená nabídka',merge:'Sloučení',split:'Rozdělení',moved:'Přesun místa výuky',unclear:'Nejasná návaznost'};
const HIST={comparable:'Srovnatelná',partially_comparable:'Částečně srovnatelná',not_comparable:'Nesrovnatelná',unknown:'Neurčeno'};
const tasks=D.tasks,results=D.results,byId=new Map(tasks.map(t=>[t.id,t]));
let active=tasks[0].id,page=0;
function offers(t,year){return t.context_offers?.[year]||[];}
function schoolName(t){return offers(t,'2026')[0]?.['NÁZEV ŠKOLY']||offers(t,'2025')[0]?.['NÁZEV ŠKOLY']||('REDIZO '+t.redizo.join(', '));}
function searchText(t){const os=[...offers(t,'2025'),...offers(t,'2026')];return norm([t.id,t.redizo.join(' '),...os.map(o=>[o['NÁZEV ŠKOLY'],o.OBEC,o['OBOR - NÁZEV'],o['ZAMĚŘENÍ OBORU'],o.KKOV].join(' '))].join(' '));}
function res(t){return results[t.id];}
function statusSet(t){return new Set((res(t)?.findings||[]).map(f=>f.status));}
function actionSet(t){return new Set((res(t)?.findings||[]).map(f=>f.recommended_action));}
function filtered(){const q=norm($('search').value),p=$('fProc').value,pr=$('fPrio').value,st=$('fStatus').value,ac=$('fAction').value;return tasks.filter(t=>{const done=!!res(t);if(p==='done'&&!done)return false;if(p==='todo'&&done)return false;if(pr&&String(t.priority)!==pr)return false;if(st&&!statusSet(t).has(st))return false;if(ac&&!actionSet(t).has(ac))return false;if(q&&!searchText(t).includes(q))return false;return true;});}
function renderList(){const rows=filtered();page=Math.max(0,Math.min(page,Math.max(0,Math.ceil(rows.length/40)-1)));$('count').textContent=`${rows.length} úkolů ve filtru`;$('list').innerHTML=rows.slice(page*40,page*40+40).map(t=>{const done=!!res(t),ni=t.issues.length;return `<button data-id="${esc(t.id)}" aria-current="${t.id===active}"><strong>${esc(schoolName(t))}</strong><small><span class="id">${esc(t.id)}</span> · ${ni} ${ni===1?'otázka':ni<5?'otázky':'otázek'} · priorita ${esc(t.priority)}</small><small><span class="badge ${done?'done':'todo'}">${done?'Zpracováno':'Nezahájeno'}</span>${done?' '+[...statusSet(t)].map(s=>`<span class="st ${STATUS[s]?.[1]||'st-nedohledano'}">${esc(STATUS[s]?.[0]||s)}</span>`).join(' '):''}</small></button>`;}).join('')||'<p class="empty">Žádný úkol neodpovídá filtru.</p>';$('page').textContent=`${rows.length?page+1:0} / ${Math.ceil(rows.length/40)}`;$('prevPage').disabled=page===0;$('nextPage').disabled=(page+1)*40>=rows.length;const i=rows.findIndex(t=>t.id===active);$('position').textContent=i<0?'Aktuální úkol je mimo zvolený filtr':`Úkol ${i+1} z ${rows.length} ve filtru`;$('prev').disabled=i<=0;$('next').disabled=i<0||i===rows.length-1;}
function fact(label,value){return `<div><dt>${esc(label)}</dt><dd>${esc(value??'—')}</dd></div>`;}
function addr(o){return [o.ULICE,o.OBEC,o['PSČ']].filter(Boolean).join(', ')||null;}
function offerCard(o){return `<div class="offer"><strong>${esc(o['OBOR - NÁZEV']||o.KKOV||'Nabídka')}${o['ZAMĚŘENÍ OBORU']?' · '+esc(o['ZAMĚŘENÍ OBORU']):''}</strong><p class="small" style="margin:0 0 4px">${esc(o['NÁZEV ŠKOLY'])}</p><dl class="facts">${fact('KKOV',o.KKOV)}${fact('Délka',o['DÉLKA STUDIA']!=null?o['DÉLKA STUDIA']+' let':null)}${fact('Forma',o['FORMA VZDĚLÁVÁNÍ'])}${fact('Jazyk',o['JAZYK STUDIA'])}${fact('Adresa',addr(o))}${fact('IZO',o.IZO)}${fact('REDIZO',o.REDIZO)}${fact('ID_SOF',o.ID_SOF)}</dl></div>`;}
function yearCol(year,list){return `<div class="year-col"><h4>Rok ${year} · ${list.length} ${list.length===1?'nabídka':list.length<5?'nabídky':'nabídek'}</h4>${list.map(offerCard).join('')||'<p class="muted">Žádná nabídka.</p>'}</div>`;}
function issuesTable(t){return `<table class="issues"><thead><tr><th>ID</th><th>Druh</th><th>Priorita</th><th>REDIZO</th><th>Záznamy</th></tr></thead><tbody>${t.issues.map(i=>`<tr><td class="id">${esc(i.id)}</td><td>${esc(i.kind)}</td><td>${esc(i.priority)}</td><td class="id">${esc(Array.isArray(i.redizo)?i.redizo.join(', '):i.redizo)}</td><td>${(i.records||[]).map(r=>`${esc(r.type)} ${esc(r.year)} #${esc(r.index)}`).join('<br>')}</td></tr>`).join('')}</tbody></table>`;}
function renderAddresses(list){if(!list?.length)return '';return `<h4>Adresy</h4>${list.map(a=>`<div class="addr"><p><strong>${esc(a.text)}</strong>${a.role?` <span class="badge">${esc(a.role)}</span>`:''}</p>${a.izo?`<p class="small">IZO: ${esc(a.izo)}</p>`:''}${a.valid_period?`<p class="small">Platnost: ${esc(a.valid_period)}</p>`:''}${a.registry_role?`<p class="small">Role v rejstříku: ${esc(a.registry_role)}</p>`:''}${a.source_url?`<p class="small">Zdroj: ${isUrl(a.source_url)?`<a target="_blank" rel="noopener noreferrer" href="${esc(a.source_url)}">${esc(a.source_url)}</a>`:esc(a.source_url)}</p>`:''}${a.registry_source_url?`<p class="small">Rejstřík: ${isUrl(a.registry_source_url)?`<a target="_blank" rel="noopener noreferrer" href="${esc(a.registry_source_url)}">${esc(a.registry_source_url)}</a>`:esc(a.registry_source_url)}</p>`:''}</div>`).join('')}`;}
function renderEvidence(list){if(!list?.length)return '<p class="muted">Bez přiložené evidence.</p>';return list.map(e=>`<div class="ev"><p><strong>${esc(e.title||e.url)}</strong></p><p>${isUrl(e.url)?`<a target="_blank" rel="noopener noreferrer" href="${esc(e.url)}">${esc(e.url)}</a>`:`<span class="muted">${esc(e.url)}</span>`}</p>${e.supports?`<p>${esc(e.supports)}</p>`:''}<p class="small muted">${[e.published_at?'Publikováno: '+e.published_at:null,e.checked_at?'Ověřeno: '+e.checked_at:null,e.applicable_period?'Období: '+e.applicable_period:null].filter(Boolean).map(esc).join(' · ')}</p></div>`).join('');}
function renderRelationship(rel){if(!rel)return '';const cell=(label,arr)=>`<div><dt>${label}</dt>${(arr&&arr.length?arr:['—']).map(x=>`<dd style="font-weight:500;margin-top:6px">${esc(x)}</dd>`).join('')}</div>`;return `<h4>Návaznost</h4><p><span class="badge">${esc(REL[rel.type]||rel.type)}</span></p><div class="rel">${cell('Z (from)',rel.from)}${cell('Do (to)',rel.to)}</div>`;}
function renderFinding(f){const [label,cls]=STATUS[f.status]||[f.status,'st-nedohledano'];return `<article class="finding"><div class="head"><span class="st ${cls}">${esc(label)}</span><span class="chips">${(f.issue_ids||[]).map(id=>`<span class="chipid">${esc(id)}</span>`).join('')}</span></div>${f.observations?.length?`<ul class="obs">${f.observations.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}${f.conclusion?`<div class="conclusion"><strong>Závěr:</strong> ${esc(f.conclusion)}</div>`:''}${f.alternative_explanations?.length?`<details><summary>Alternativní vysvětlení (${f.alternative_explanations.length})</summary><ul class="obs">${f.alternative_explanations.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></details>`:''}${renderRelationship(f.relationship)}${renderAddresses(f.addresses)}<h4>Evidence</h4>${renderEvidence(f.evidence)}<dl class="facts">${fact('Srovnatelnost historie',HIST[f.history_comparability]||f.history_comparability)}${fact('Doporučená akce',ACTIONS[f.recommended_action]||f.recommended_action)}</dl>${f.related_task_ids?.length?`<p class="small">Související úkoly: ${f.related_task_ids.map(id=>byId.has(id)?`<a href="#" data-task="${esc(id)}">${esc(id)}</a>`:esc(id)).join(', ')}</p>`:''}${f.unanswered_questions?.length?`<div class="warn"><strong>Nezodpovězené otázky:</strong><ul class="obs">${f.unanswered_questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`:''}${f.decisions_deferred?.polozky?.length?`<div class="warn"><strong>Odloženo k rozhodnutí:</strong><ul class="obs">${f.decisions_deferred.polozky.map(q=>`<li>${esc(q)}</li>`).join('')}</ul><p class="small">${esc(f.decisions_deferred.duvod||'')}</p></div>`:''}${f.resolved_questions?.length?`<details><summary>Uzavřené otázky (${f.resolved_questions.length})</summary><ul class="obs">${f.resolved_questions.map(r=>`<li>${esc(r.otazka)}<br><em>${esc(r.uzavreno)}</em></li>`).join('')}</ul></details>`:''}</article>`;}
function renderDetail(){const t=byId.get(active),r=res(t);let html=`<span class="badge ${r?'done':'todo'}">${r?'Zpracováno':'Nezahájeno'}</span> <span class="badge">Priorita ${esc(t.priority)}</span><h2>${esc(schoolName(t))}</h2><p class="muted"><span class="id">${esc(t.id)}</span> · REDIZO ${esc(t.redizo.join(', '))}</p><section class="panel"><h3>Nabídky CERMAT k porovnání</h3><div class="years">${yearCol('2025',offers(t,'2025'))}${yearCol('2026',offers(t,'2026'))}</div></section><section class="panel"><h3>Otázky k dohledání (${t.issues.length})</h3>${issuesTable(t)}</section>`;if(r){html+=`<section class="panel registry"><h3>Kontrola rejstříku MŠMT</h3><p class="small muted">Ověřeno: ${esc(r.registry_check?.checked_at)} · snímky: ${(r.registry_check?.snapshots||[]).map(esc).join(', ')||'—'}</p><p>${esc(r.registry_check?.summary||'')}</p><p class="small muted">Zpracováno: ${esc(r.processed_at)} · verze fronty ${esc(r.queue_version)}</p></section><section class="panel"><h3>Nálezy (${(r.findings||[]).length})</h3>${(r.findings||[]).map(renderFinding).join('')||'<p class="muted">Žádné nálezy.</p>'}</section>`;}else{html+='<p class="notice">Úkol zatím nebyl zpracován – stav: nezahájeno. Nálezy se zde objeví po přidání souboru výsledků a opětovném sestavení prohlížeče.</p>';}$('detail').innerHTML=html;}
function choose(id){active=id;renderList();renderDetail();document.querySelector('main').scrollIntoView({block:'start',behavior:'instant'});}
function move(delta){const rows=filtered(),i=rows.findIndex(t=>t.id===active);if(rows[i+delta]){page=Math.floor((i+delta)/40);choose(rows[i+delta].id);window.scrollTo({top:0,behavior:'instant'});}}
$('list').onclick=e=>{const b=e.target.closest('button[data-id]');if(b)choose(b.dataset.id);};
$('detail').onclick=e=>{const a=e.target.closest('a[data-task]');if(a){e.preventDefault();choose(a.dataset.task);}};
['search','fProc','fPrio','fStatus','fAction'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;renderList();}));
$('prevPage').onclick=()=>{page--;renderList();};$('nextPage').onclick=()=>{page++;renderList();};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
(function summary(){const done=tasks.filter(t=>res(t)).length,counts={};tasks.forEach(t=>statusSet(t).forEach(s=>counts[s]=(counts[s]||0)+1));$('subtitle').textContent=`Verze fronty ${D.queue_version} · nástroj slouží pouze ke kontrole dat, nic nemění`;$('summary').innerHTML=[`<span class="chip"><strong>${tasks.length}</strong>úkolů celkem</span>`,`<span class="chip"><strong>${done}</strong>zpracováno</span>`,`<span class="chip"><strong>${tasks.length-done}</strong>nezahájeno</span>`,...Object.entries(STATUS).map(([k,[label]])=>counts[k]?`<span class="chip"><strong>${counts[k]}</strong>${esc(label.toLowerCase())}</span>`:'')].join('');})();
renderList();renderDetail();
</script></html>
