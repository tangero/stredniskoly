ZEV ŠKOLY":"Střední škola Baltimore z. ú.","ULICE":"Švýcarská 2124","OBEC":"Beroun","PSČ":26601}}}]}],"context_offers":{"2025":[],"2026":[{"REDIZO":691020094,"IZO":"izo_250013754","NÁZEV ŠKOLY":"Střední škola Baltimore z. ú.","ULICE":"Švýcarská 2124","OBEC":"Beroun","PSČ":26601,"KKOV":"78-42-M/06","OBOR - NÁZEV":"Kombinované lyceum","ZAMĚŘENÍ OBORU":"","DÉLKA STUDIA":4,"FORMA VZDĚLÁVÁNÍ":"den","JAZYK STUDIA":"Český","ID_SOF":"f07825fe-dcde-43af-b7d1-b817c7180508"}]},"status":"not_started","findings":[]}],"results":{"R-600001661":{"task_id":"R-600001661","queue_version":2,"processed_at":"2026-09-12","findings":[{"issue_ids":["Q0392"],"status":"potvrzeno","observations":["Přiložená data CERMAT ukazují, že škola s REDIZO 600001661 (Academic School, Uherské Hradiště) a IZO střední školy izo_181134799 pokračuje v roce 2026 beze změny identifikátorů. Obor Informační technologie (18-20-M/01, zaměření Vývoj cloudových aplikací a správa firemních systémů) je nabízen v obou letech a je mezi nimi spárován.","Nepřiřazená nabídka roku 2026 je čtyřleté Gymnázium (KKOV 79-41-K/41), které v nabídce roku 2025 neexistuje. Název školy se mezi roky změnil z „Academic School, MŠ, ZŠ a SŠ, s.r.o.“ na „Academic School, Gymnázium, SOŠ, ZŠ a MŠ, s.r.o.“ – přibylo „Gymnázium“, což odpovídá nově otevřenému oboru.","Web školy (academicschool.cz/gymnazium, stránka evidovaná od prosince 2025) uvádí „Gymnázium Academic School: Otevíráme v září 2026“ a popisuje čtyřleté studium s dvoujazyčnou výukou.","Slovácký deník 13. 2. 2026 píše, že uherskohradišťská Academic School otevře od září 2026 čtyřleté gymnázium s jednou třídou o kapacitě 20 míst; dosud škola na středním stupni nabízela pouze obor informačních technologií (střední škola vznikla v roce 2022).","Adresa se mezi ročníky dat změnila: záznam 2025 uvádí Studentské náměstí 1531, záznamy 2026 uvádějí Města Mayen 1536. Studentské náměstí 1531 je sídlo právnické osoby a adresa základní školy (dle webu školy a obchodního rejstříku, IČO 25349520), zatímco Města Mayen 1536 škola uvádí jako adresu střední školy a gymnázia. Škola má pod jedním REDIZO více IZO (střední škola 181134799, základní škola 110009312, mateřská škola 110009321 aj.).","Rejstřík MŠMT vede subjekt REDIZO 600001661 (IČ 25349520) ve všech čtyřech snímcích (31. 3. 2025, 31. 12. 2025, 31. 3. 2026, 30. 6. 2026) beze změny sídla Studentské náměstí 1531, Mařatice, a IZO 181134799 (Střední škola) s místem výuky Města Mayen 1536, Mařatice – role obou adres z dat CERMAT je tak rejstříkem potvrzena.","Úplný název subjektu je v rejstříku ve všech snímcích totožný: „Academic School, Mateřská škola, základní škola a střední škola, s.r.o.“ – tj. bez „Gymnázium“ i ve snímku k 30. 6. 2026. Názvy v datech CERMAT („Academic School, MŠ, ZŠ a SŠ, s.r.o.“ v 2025 a „Academic School, Gymnázium, SOŠ, ZŠ a MŠ, s.r.o.“ v 2026) jsou tedy zkrácené varianty, které úplnému názvu v rejstříku nemusí odpovídat; změna názvu v datech 2026 nemá ve snímcích rejstříku obdobu.","Rejstřík nevede pod REDIZO 600001661 žádné samostatné IZO gymnázia (ani ve snímku k 30. 6. 2026); nabídka Gymnázium v datech 2026 tak vychází ze stávajícího IZO střední školy 181134799, což je konzistentní s tím, že obě nabídky CERMAT 2026 (IT i Gymnázium) uvádějí stejné IZO."],"conclusion":"Nepřiřazená nabídka Gymnázium (79-41-K/41) z roku 2026 je nově otevřený obor, který soukromá škola Academic School, s.r.o. (REDIZO 600001661, IZO střední školy 181134799) zahajuje od školního roku 2026/2027. Jde o novou nabídku bez předchůdce v roce 2025; obor Informační technologie přitom pokračuje beze změny. Změna názvu školy i rozdílná adresa v datech souvisejí s tímto rozšířením (název nově obsahuje „Gymnázium“, adresa Města Mayen 1536 je místo výuky střední školy, zatímco Studentské náměstí 1531 je sídlo právnické osoby) a neznamenají vznik nové školy ani zánik původní.","alternative_explanations":["Zdroje nevylučují, že zápis gymnázia do rejstříku škol proběhl formálně již dříve (např. během roku 2025) a k přijímání prvních žáků došlo až pro školní rok 2026/2027; pro datovou návaznost nabídek přijímacího řízení je to však bez vlivu – v nabídce 2025 gymnázium nefiguruje. Snímky rejstříku tuto variantu spíše zeslabují: úplný název subjektu neobsahuje „Gymnázium“ ani ve snímku k 30. 6. 2026 a pod REDIZO není vedeno samostatné IZO gymnázia, takže gymnázium zřejmě formálně působí v rámci stávajícího IZO střední školy 181134799.","Rozdíl adres mezi ročníky vysvětluje rejstřík: ve všech snímcích (31. 3. 2025 až 30. 6. 2026) je Studentské náměstí 1531 vedeno jako sídlo subjektu a Města Mayen 1536 jako místo výuky střední školy (IZO 181134799) současně; jde tedy jen o to, kterou adresu škola do dat CERMAT nahlásila, nikoli o fyzické stěhování."],"relationship":{"type":"new_offer","from":[],"to":["2026: KKOV 79-41-K/41 Gymnázium (ID_SOF 11e80752-2eeb-4256-a1fa-a4b70a0463d5), REDIZO 600001661, IZO izo_181134799"]},"addresses":[{"text":"Studentské náměstí 1531, Mařatice, 686 01 Uherské Hradiště","role":"sídlo","izo":"izo_181134799 (střední škola); sídlo právnické osoby IČO 25349520; místo výuky ZŠ (IZO 110009312)","valid_period":"soukromá škola sídlí na této adrese dlouhodobě; v datech CERMAT 2025 uvedena u nabídky SŠ; rejstřík MŠMT ji vede jako sídlo ve všech snímcích 31. 3. 2025 až 30. 6. 2026","source_url":"https://academicschool.cz/ochrana-osobnich-udaju/","registry_role":"sídlo subjektu REDIZO 600001661","registry_source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld"},{"text":"Města Mayen 1536, Mařatice, 686 01 Uherské Hradiště","role":"místo výuky","izo":"izo_181134799 (střední škola)","valid_period":"dle webu školy adresa střední školy a gymnázia; v datech CERMAT 2026 u všech nabídek SŠ; rejstřík MŠMT ji vede jako místo výuky IZO 181134799 ve všech snímcích 31. 3. 2025 až 30. 6. 2026","source_url":"https://academicschool.cz/gymnazium/","registry_role":"místo výuky (C10) IZO 181134799 – Střední škola","registry d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 30. 6. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Ani po oznámeném otevření gymnázia není vedeno samostatné IZO gymnázia ani název s „Gymnázium“; gymnázium formálně působí v rámci IZO střední školy 181134799 – potvrzuje, že nová nabídka neznamená vznik nové školy","applicable_period":"stav rejstříku k 30. 6. 2026"}],"history_comparability":"not_comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":[]}],"registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT potvrdil všechny klíčové závěry nálezu: subjekt REDIZO 600001661 (IČ 25349520) je veden ve všech čtyřech snímcích beze změny sídla (Studentské náměstí 1531, Mařatice) a IZO střední školy 181134799 má trvale místo výuky Města Mayen 1536, takže rozdíl adres v datech CERMAT je pouze sídlo vs. místo výuky. Rejstřík zároveň ukázal, že úplný název subjektu zůstává „Academic School, Mateřská škola, základní škola a střední škola, s.r.o.“ i k 30. 6. 2026 a žádné samostatné IZO gymnázia neexistuje – název s „Gymnázium“ v datech CERMAT 2026 je zkrácená varianta a gymnázium působí pod IZO střední školy. Absence rejstříku v původním nálezu nezpůsobila chybu, jen nepotvrdila roli adres a ponechala otevřenou otázku formálního založení gymnázia; status findingu zůstává „potvrzeno“."}},"R-600004554":{"task_id":"R-600004554","queue_version":2,"processed_at":"2026-09-12","registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT potvrdil, že subjekt REDIZO 600004554 (Střední průmyslová škola sdělovací techniky, Praha 1, Panská 3) je veden ve všech čtyřech snímcích (31. 3. 2025 až 30. 6. 2026) beze změny úplného názvu, sídla (Panská 856/3, Nové Město) i IZO 061388866; místa výuky jsou Panská 856/3 a Malá Štupartská 977/8. Absence rejstříku v původním nálezu nezpůsobila chybu – tvrzení o stabilitě identity školy se potvrdilo. Rejstřík neobsahuje údaje o vyučovaných oborech, takže samotné ukončení nabídky zaměření Globální síťové technologie ověřit nelze a závěr o něm zůstává podložen ostatními zdroji."},"findings":[{"issue_ids":["Q0001"],"status":"potvrzeno","observations":["Z dat fronty: v 1. kole jednotné přijímací zkoušky 2025 nabízela Střední průmyslová škola sdělovací techniky (REDIZO 600004554, IZO 061388866, Panská 856, Praha) čtyřletý denní obor 26-45-M/01 Telekomunikace ve dvou školních vzdělávacích programech – Audiovizuální technika a Globální síťové technologie – a vedle toho Technické lyceum (78-42-M/01). V přijímacím řízení 2026 (pro školní rok 2026/27) zůstaly jen Audiovizuální technika a Technické lyceum; nabídka se zaměřením Globální síťové technologie chybí. Identita školy se mezi roky nezměnila: shodné REDIZO, IZO, název i adresa.","Výroční zpráva školy za školní rok 2024/2025 (zveřejněna v říjnu 2025) uvádí oba programy 26-45-M/01 (Audiovizuální technika i Globální síťové technologie) jako vyučované a v přehledu přijímacího řízení pro školní rok 2025/26 počítá s Globálními síťovými technologiemi (121 přihlášek). Zaměření bylo tedy v přijímacím řízení 2025 reálně nabízeno a obsazováno; podle historického importu na prijimackynaskolu.cz bylo v roce 2025 přijato 11 uchazečů z kapacity 30.","Web školy (panska.cz, načteno 12. 9. 2026) označuje Globální síťové technologie v přehledu učebních plánů a ŠVP jako „dobíhající obor“ a v nabídce přijímacího řízení pro školní rok 2027/2028 už je neuvádí – nabízeny jsou pouze Audiovizuální technika, Filmová a televizní tvorba a Technické lyceum. Škola tedy do zaměření Globální síťové technologie nové žáky nepřijímá a dříve přijaté ročníky dobíhají.","Wikipedie (článek o škole, poslední editace 6. 9. 2026) uvádí, že „před školním rokem 2025/26 byly obory AVT a GST spojeny do jednoho“. Historie editací článku ukazuje poznámku „Obor GST na panské už není dostupný“ z 22. 9. 2025 a doplnění informace o spojení z 25. 3. 2026 s uvedením zdroje „web školy a vlastní vědomost“. Uvedené období 2025/26 je v rozporu s tím, že zaměření Globální síťové technologie bylo v přijímacím řízení 2025 samostatně nabízeno; spojení se nejspíš týká nabídky pro školní rok 2026/27. Příznivé okolnosti (společný program CISCO Academy ve výuce datových sítí, společná exteriérová cvičení prvních ročníků AVT a GST dle výroční zprávy 2024/25) sloučení obsahu výuky do Audiovizuální techniky podporují, ale přímé datované oznámení školy se nenalezlo.","V datech fronty nenabízí v roce 2026 zaměření „Globální síťové technologie“ žádná jiná škola; nabídka se tedy nepřesunula jinam.","Rejstřík MŠMT vede subjekt REDIZO 600004554 (Střední průmyslová škola sdělovací techniky, Praha 1, Panská 3, IČ 61388866) ve všech čtyřech ověřených snímcích (31. 3. 2025, 31. 12. 2025, 31. 3. 2026, 30. 6. 2026) beze změny úplného názvu i sídla (Panská 856/3, Nové Město, PSČ 110 00); škola tedy v sledovaném období nezanikla a identita se nezměnila.","Rejstřík k IZO 061388866 (Střední škola) eviduje ve všech snímcích dvě místa výuky: sídlo Panská 856/3, Nové Město, a dále Malá Štupartská 977/8, Staré Město. Rejstřík neobsahuje údaj o vyučovaných oborech, takže ukončení nabídky zaměření Globální síťové technologie ani nepotvrzuje, ani nevyvrací."],"conclusion":"Zaměření (školní vzdělávací program) Globální síťové technologie oboru 26-45-M/01 Telekomunikace SPŠ sdělovací techniky, Praha 1, Panská 856/3, škola od přijímacího řízení 2026 (školní rok 2026/27) přestala nabízet; program u dříve přijatých ročníků dobíhá. Škola samotná pokračuje beze změny identity (stejné REDIZO 600004554 a IZO 061388866, název i adresa v obou letech) a programy Audiovizuální technika a Technické lyceum nabízí v roce 2025 i 2026. Nepřiřazená nabídka 2025 tedy nemá v roce 2026 žádné pokračování, ani u jiné školy.","alternative_explanations":["Podle Wikipedie (s odkazem na web školy) bylo zaměření Globální síťové technologie sloučeno s Audiovizuální technikou; nelze vyloučit, že část obsahu výuky přešla do programu Audiovizuální technika (jehož popis nově zmiňuje správu sítí a serverů). Přímé datované oznámení školy o sloučení se však dohledat nepodařilo, takže formálně jde o ukončení samostatné nabídky, nikoli o doložené převedení.","Data fronty pokrývají 1. kolo JPZ; teoreticky nelze vyloučit, že škola nabídku Globálních síťových technologií vyhlásila pouze ve 2. kole přijímacího řízení 2026. Web školy ji však mezi přijímanými obory neuvádí ani pro rok 2027/28 a označuje ji za dobíhající, což toto vysvětlení nepodporuje."],"relationship":{"type":"closed","from":["600004554 | 26-45-M/01 Telekomunikace – Globální síťové technologie (ID_SOF 15de1fe5-b5ca-4a45-987c-e775b2c46f29, rok 2025)"],"to":[]},"addresses":[{"text":"Panská 856/3, 110 00 Praha 1 (v datech CERMAT zapsáno jako Panská 856, Praha, 110 00)","role":"sídlo","izo":"izo_061388866","valid_period":"2025–2026","source_url":"fronta-dohledavani-2025-2026.json, úkol R-600004554"},{"text":"Panská 856/3, Nové Město, PSČ 110 00 (RÚIAN 21706581)","role":"sídlo","izo":"izo_061388866","valid_period":"stavy rejstříku k 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 a 30. 6. 2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld"},{"text":"Panská 856/3, Nové Město (RÚIAN 21706581) – místo výuky C31","role":"místo výuky","izo":"izo_061388866","valid_period":"stavy rejstříku k 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 a 30. 6. 2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld"},{"text":"Malá Štupartská 977/8, Staré Město (RÚIAN 21726230) – místo výuky C10","role":"místo výuky","izo":"izo_061388866","valid_period":"stavy rejstříku k 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 a 30. 6. 2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600004554","title":"Fronta dohledávání 2025–2026 – context_offers","published_at":null,"checked_at":"2026-09-12","supports":"V roce 2025 nabídka 26-45-M/01 Telekomunikace – Globální síťové technologie existuje, v roce 2026 chybí; REDIZO, IZO, název školy i adresa jsou v obou letech shodné; žádná jiná škola ve frontě zaměření v roce 2026 nenabízí.","applicable_period":"přijímací řízení 2025 a 2026 (1. kolo JPZ, denní studium)"},{"url":"https://www.panska.cz/wp-content/uploads/2025/10/Vyrocni-zprava-2024-25.pdf","title":"Výroční zpráva o činnosti školy za školní rok 2024/2025 – SPŠ sdělovací techniky","published_at":"2025-10","checked_at":"2026-09-12","supports":"Škola sama uvádí oba programy 26-45-M/01 (Audiovizuální technika i Globální síťové technologie) jako vyučované a v přijímacím řízení pro školní rok 2025/26 počítá s Globálními síťovými technologiemi (121 přihlášek); dokládá, že zaměření v roce 2025 reálně fungovalo.","applicable_period":"školní rok 2024/2025, přijímací řízení pro 2025/26"},{"url":"https://www.panska.cz/ucebni-plany/","title":"Učební plány | Panská – SPŠ sdělovací techniky","published_at":null,"checked_at":"2026-09-12","supports":"Škola označuje Globální síťové technologie výslovně jako „dobíhající obor“ – nové žáky do něj nepřijímá, stávající ročníky dostudují.","applicable_period":"stav k září 2026"},{"url":"https://www.panska.cz/","title":"Panská – Střední průmyslová škola sdělovací techniky (úvodní stránka)","published_at":null,"checked_at":"2026-09-12","supports":"Škola prezentuje pouze tři studijní obory – Audiovizuální technika, Filmová a televizní tvorba, Technické lyceum; Globální síťové technologie v nabídce chybí.","applicable_period":"stav k září 2026"},{"url":"https://www.panska.cz/prijimaci-rizeni/","title":"Přijímací řízení pro školní rok 2027/2028 | Panská","published_at":null,"checked_at":"2026-09-12","supports":"Pro přijímací řízení 2027/28 škola uvádí tři bloky oborů (kapacity 60, 30 a 90 žáků); mezi přijímanými obory není Globální síťové technologie – ukončení nabídky není jednorázové.","applicable_period":"přijímací řízení pro školní rok 2027/2028"},{"url":"https://cs.wikipedia.org/wiki/St%C5%99edn%C3%AD_pr%C5%AFmyslov%C3%A1_%C5%A1kola_sd%C4%9Blovac%C3%AD_techniky","title":"Střední průmyslová škola sdělovací techniky – Wikipedie","published_at":"2026-09-06","checked_at":"2026-09-12","supports":"Tvrzení o spojení oborů Audiovizuální technika a Globální síťové technologie do jednoho; historie editací datuje odstranění GST z nabídky k září 2025. Formulace o školním roce 2025/26 je v rozporu s daty CERMAT (GST samostatně nabízeno v přijímačkách 2025), proto je sloučení evidováno jen jako alternativní vysvětlení.","applicable_period":"2025–2026"},{"url":"https://www.prijimackynaskolu.cz/skola/600004554-sps-sdelovaci-techniky-panska-telekomunikace-globalni-sitove-technologie","title":"SPŠ sdělovací techniky, Panská – Telekomunikace, Globální síťové technologie (Přijímačky na školu)","published_at":null,"checked_at":"2026-09-12","supports":"Historický import z přijímacího řízení 2025: 121 přihlášek, 11 přijatých, kapacita 30 míst – dokládá, že zaměření bylo v roce 2025 skutečně obsazováno. (Vyhledávací úryvek k této stránce uváděl, že obor nebude otevřen pro školní rok 2026/27; v načteném textu stránky tato věta viditelná není, proto slouží jen jako vodítko.)","applicable_period":"přijímací řízení 2025"},{"url":"https://web.archive.org/web/2026/https://www.panska.cz/globalni-sitove-technologie/","title":"Globální síťové technologie | SPŠ sdělovací techniky (archivovaná stránka oboru)","published_at":null,"checked_at":"2026-09-12","supports":"Archivovaná stránka oboru popisuje program 26-45-M/01 Telekomunikace, ŠVP Globální síťové technologie; aktuální stránka /gst/ na webu školy již neexistuje (HTTP 404).","applicable_period":"do ukončení nabídky"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2025)","published_at":"2025-03-31","checked_at":"2026-09-12","supports":"Subjekt REDIZO 600004554 (Střední průmyslová škola sdělovací techniky, Praha 1, Panská 3, IČ 61388866) je v rejstříku veden se sídlem Panská 856/3, Nové Město; IZO 061388866 (Střední škola) má místa výuky Panská 856/3 a Malá Štupartská 977/8. Potvrzuje identitu školy v období 1. kola JPZ 2025.","applicable_period":"stav rejstříku k 31. 3. 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 30. 6. 2026)","published_at":"2026-06-30","checked_at":"2026-09-12","supports":"Subjekt REDIZO 600004554 je veden beze změny úplného názvu, sídla i IZO 061388866 včetně obou míst výuky; totožný stav vykazují i mezilehlé snímky k 31. 12. 2025 a 31. 3. 2026. Potvrzuje, že škola v roce 2026 pokračuje se stejnou identitou a ukončení nabídky GST není spojeno se změnou subjektu.","applicable_period":"stav rejstříku k 30. 6. 2026"}],"history_comparability":"not_comparable","recommended_action":"record_only","related_task_ids":[],"unanswered_questions":["Přímé datované oznámení školy o ukončení přijímání do zaměření Globální síťové technologie (případně o formálním sloučení s Audiovizuální technikou) se dohledat nepodařilo; závěr vychází z označení „dobíhající obor“ na webu školy, výroční zprávy 2024/25 a absence nabídky v přijímacích řízeních 2026 i 2027.","Statistiky zaměření Globální síťové technologie z roku 2025 (121 přihlášek, 11 přijatých) nelze přenášet na Audiovizuální techniku 2026 – i kdyby k sloučení obsahu došlo, jde o jinou uchazečskou skupinu; výsledky Audiovizuální techniky 2026 mohou být ovlivněny přílivem bývalých uchazečů o GST, což je třeba při prezentaci historických dat zohlednit."]}]},"R-600004929":{"task_id":"R-600004929","queue_version":2,"processed_at":"2026-09-12","registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT potvrdil závěry nálezu: subjekt 600004929 'Obchodní akademie, Praha 3, Kubelíkova 37' (IČ 70107050) i jeho IZO 110002008 jsou vedeny ve všech čtyřech snímcích (31. 3. 2025 až 30. 6. 2026) beze změny názvu, sídla i místa výuky (Kubelíkova 1221/37, Žižkov, RÚIAN 21779571). Nový obor 78-42-M/08 tedy skutečně otevírá nezměněná právnická osoba na stejné adrese a nejde o důsledek sloučení, přejmenování ani přesunu školy. Absence rejstříku v původním nálezu nezpůsobila chybu ani nejistotu – pouze chyběl formální důkaz identity subjektu, který je nyní doplněn."},"findings":[{"issue_ids":["Q0339"],"status":"potvrzeno","observations":["V přiložených datech fronty (CERMAT, 1. kolo jednotné přijímací zkoušky, denní studium) nabízela Obchodní akademie, Praha 3, Kubelíkova 1221 (REDIZO 600004929, IZO izo_110002008) v roce 2025 tři nabídky: Obchodní akademie 63-41-M/02 (zaměření Sportovní management a Obchodní akademie) a Ekonomické lyceum 78-42-M/02 (Sportovněmanažerské lyceum). V roce 2026 všechny tři nabídky pokračují beze změny kódu i zaměření a nově přibyla čtvrtá nabídka: Lyceum (režim pokusného ověřování) 78-42-M/08 se zaměřením 'Lyceum OA Kubelíkova'.","Katalog Stredniskoly.cz (čerpá z rejstříku škol MŠMT) uvádí u školy pro školní rok 2026–27 obor Lyceum 78-42-M/08 s kapacitou 30 žáků a ve sloupci 'Přihlášeno/přijato min. rok' hodnotu 0/0, tedy že obor v předchozím roce (2025/26) nebyl v přijímacím řízení nabízen. Ostatní tři obory mají minuloroční statistiky vyplněné (111/30, 144/30, 366/60).","Server prijimacky-onlinekurzy.cz (KOMPLET, zpracování dat CERMAT) uvádí pro obor 'Lyceum (režim pokusného ověřování) (Lyceum OA Kubelíkova)', kód 78-42-M/08, statistiky pouze pro rok 2026 (kapacita 30, přihlášeno 114, přijato 30); pro roky 2025 a 2024 jsou hodnoty prázdné ('—').","Školský profil školy na iDNES.cz uvádí doslovné sdělení školy 'Plánujeme: budeme otevírat obor 78-42-M/08 Lyceum (režim pokusného ověřování)' – tedy že jde o nově otevíraný obor. Obsah stránky se nepodařilo načíst kvůli souhlasové stěně, údaj pochází z vyhledávacího úryvku a je proto brán jako vodítko, nikoli hlavní důkaz.","Obor 78-42-M/08 Lyceum v režimu pokusného ověřování se v datech přijímacího řízení 2026 objevil nově u více pražských škol současně (např. Smíchovská SPŠ, OA Heroldovy sady – ta na webu píše 'Ve školním roce 2026/2027 otevíráme ... Lyceum (režim pokusného ověřování) – kód oboru 78-42-M/08'). Jde tedy o celostátní novinku MŠMT, kterou si řada škol otevřela právě od školního roku 2026/2027.","Adresa Kubelíkova 1221/37, Praha 3 – Žižkov je sídlem i místem výuky školy a je v obou letech shodná; žádná změna adresy ani entity (REDIZO/IZO) se nekonala.","Rejstřík MŠMT (otevřená data, snímky k 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 i 30. 6. 2026) vede subjekt 600004929 'Obchodní akademie, Praha 3, Kubelíkova 37' (IČ 70107050) a jeho IZO 110002008 (Střední škola) ve všech čtyřech snímcích beze změny – shodný název, shodné sídlo Kubelíkova 1221/37, Žižkov (RÚIAN 21779571) a jediné místo výuky na téže adrese. Rejstřík tak potvrzuje, že mezi přijímacími řízeními 2025 a 2026 nedošlo k žádné změně entity, názvu ani adresy školy."],"conclusion":"Nabídka 'Lyceum (režim pokusného ověřování) 78-42-M/08, zaměření Lyceum OA Kubelíkova' je nový obor, který Obchodní akademie Kubelíkova otevřela poprvé pro přijímací řízení na školní rok 2026/2027. Nejde o přejmenování ani přepis žádného z existujících oborů – Obchodní akademie 63-41-M/02 (obě zaměření) i Ekonomické lyceum 78-42-M/02 pokračují v roce 2026 vedle něj beze změny. Nepřiřazenost nabídky 2026 je tedy správný stav: k oboru neexistuje historie z roku 2025 a nemá být mapován na žádný obor z roku 2025.","alternative_explanations":["Teoreticky by obor mohl navazovat na některý dří ble_period":"školní rok 2026/2027"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2025)","published_at":null,"checked_at":"2026-09-12","supports":"Subjekt 600004929 'Obchodní akademie, Praha 3, Kubelíkova 37' (IČ 70107050) je veden v období 1. kola JPZ 2025; sídlo Kubelíkova 1221/37, Žižkov (RÚIAN 21779571), IZO 110002008 (Střední škola) s jediným místem výuky na téže adrese.","applicable_period":"stav rejstříku k 31. 3. 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"V období 1. kola JPZ 2026 je subjekt veden pod stejným REDIZO 600004929, názvem i sídlem jako v roce 2025; IZO 110002008 má i nadále jediné místo výuky Kubelíkova 1221/37, Žižkov. Totožný stav dokládají i snímky k 31. 12. 2025 a 30. 6. 2026 – mezi roky 2025 a 2026 tedy nedošlo ke změně entity, názvu ani adresy.","applicable_period":"stav rejstříku k 31. 3. 2026"}],"history_comparability":"not_comparable","recommended_action":"record_only","related_task_ids":[],"unanswered_questions":["Zda nový obor 78-42-M/08 obsahově navazuje na některý dřívější školní vzdělávací program školy (případné datumované vyjádření na oa-kubelikova.cz se nepodařilo dohledat; aktuální web školy stránku k přijímacímu řízení zpřístupňuje jen částečně)."]}]},"R-600004961":{"task_id":"R-600004961","queue_version":2,"processed_at":"2026-09-12","findings":[{"issue_ids":["Q0002","Q0218"],"status":"potvrzeno","observations":["V přiložených datech CERMAT (1. kolo přijímacího řízení, denní studium) mělo Gymnázium Na Pražačce (REDIZO 600004961, IZO 000335398, Nad Ohradou 2825, Praha) v roce 2025 nabídku oboru 79-41-K/61 Gymnázium (šestileté) se zaměřením zapsaným jako „estetickovýchovné předměty - zaměření na VV“; v roce 2026 má stejná škola nabídku téhož oboru se zaměřením „Výtvarná výchova“. Kód oboru (KKOV), délka studia (6 let), forma (denní) i jazyk studia jsou v obou letech shodné.","Podle Wikipedie nabízí Gymnázium Na Pražačce studium právě ve třech zaměřeních šestiletého gymnázia: všeobecné (třídy A), výtvarné (třídy C) a německé (třídy D). Výtvarné zaměření je tedy dlouhodobou součástí nabídky školy.","Samostatný agregátor prijimackynaskolu.cz uvádí u školy tři obory/zaměření s celkovou kapacitou 90 míst (tj. tři třídy po 30 žácích) v roce 2026 a zároveň vypisuje názvy zaměření z roku 2025 („estetickovýchovné předměty…“), což potvrzuje, že jde o tři paralelní třídní zaměření téže školy v obou letech.","Rejstřík MŠMT vede subjekt REDIZO 600004961 (Gymnázium Na Pražačce, Praha 3, Nad Ohradou 23, IČ 60461675) i IZO 000335398 ve všech čtyřech sledovaných snímcích (31. 3. 2025, 31. 12. 2025, 31. 3. 2026, 30. 6. 2026) pod stejným úplným názvem, se sídlem Nad Ohradou 2825/23, Žižkov, a shodným místem výuky na téže adrese; nepřetržitá existence školy mezi přijímacími řízeními 2025 a 2026 je tak potvrzena."],"conclusion":"Jde o tentýž obor a totéž výtvarné zaměření šestiletého gymnázia; mezi rokem 2025 a 2026 se změnilo pouze pojmenování zaměření v datech přijímacího řízení („estetickovýchovné předměty - zaměření na VV“ → „Výtvarná výchova“). Návaznost je přímá, 1:1.","alternative_explanations":["Teoreticky by mohlo jít o uzavření starého a otevření nového zaměření se shodným obsahem; žádný zdroj to ale nenaznačuje a struktura nabídky (3 třídy, 90 míst, shodné KKOV) zůstala nezměněná."],"relationship":{"type":"rename_only","from":["2025: 79-41-K/61 Gymnázium, zaměření „estetickovýchovné předměty - zaměření na VV“ (ID_SOF 0e303eb9-6241-44f8-9261-028be39545df)"],"to":["2026: 79-41-K/61 Gymnázium, zaměření „Výtvarná výchova“ (ID_SOF b368243d-680e-4208-b57c-714e3e1797c7)"]},"addresses":[{"text":"Nad Ohradou 2825/23, 130 00 Praha 3","role":"sídlo","izo":"izo_000335398","valid_period":"2025–2026","source_url":"https://cs.wikipedia.org/wiki/Gymn%C3%A1zium_Na_Pra%C5%BEa%C4%8Dce"},{"text":"Nad Ohradou 2825, Praha, 13000","role":"místo výuky","izo":"izo_000335398","valid_period":"2025–2026","source_url":"fronta-dohledavani-2025-2026.json, úkol R-600004961"},{"text":"Nad Ohradou 2825/23, Žižkov, 130 00 Praha 3","role":"sídlo","izo":"izo_000335398","valid_period":"2025–2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"},{"text":"Nad Ohradou 2825/23, Žižkov, 130 00 Praha 3","role":"místo výuky (mistaVyuky, rejstřík MŠMT)","izo":"izo_000335398","valid_period":"2025–2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600004961","title":"Fronta dohledávání 2025–2026, přiložená data CERMAT","published_at":null,"checked_at":"2026-09-12","supports":"Shodné REDIZO/IZO, název, adresa, KKOV, délka i forma studia; změnil se jen text zaměření mezi roky 2025 a 2026.","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://cs.wikipedia.org/wiki/Gymn%C3%A1zium_Na_Pra%C5%BEa%C4%8Dce","title":"Gymnázium Na Pražačce – Wikipedie","published_at":"2025-11-27","checked_at":"2026-09-12","supports":"Škola (REDIZO 600004961) nabízí šestileté gymnázium ve třech zaměřeních: všeobecné, výtvarné a německé.","applicable_period":"aktuální stav, editováno 27. 11. 2025"},{"url":"https://www.prijimackynaskolu.cz/skola/600004961-gymnazium-na-prazacce-nad-ohradou","title":"Gymnázium Na Pražačce, Nad Ohradou – přehled oborů (Přijímačky na střední školy)","published_at":null,"checked_at":"2026-09-12","supports":"Tři obory/zaměření, kapacita 90 míst v roce 2026; vypisuje názvy zaměření z roku 2025 a upozorňuje na chybějící shodu s importem 2026 – jde o změnu pojmenování, nikoli zánik.","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Subjekt REDIZO 600004961 i IZO 000335398 jsou ve snímku vedeny pod úplným názvem Gymnázium Na Pražačce, Praha 3, Nad Ohradou 23, se sídlem Nad Ohradou 2825/23, Žižkov, a shodným místem výuky; stav je totožný se snímky k 31. 3. 2025, 31. 12. 2025 a 30. 6. 2026, takže škola mezi přijímacími řízeními 2025 a 2026 existovala nepřetržitě a nešlo o zánik ani vznik nového subjektu.","applicable_period":"stav rejstříku k 31. 3. 2026 (shodný se snímky 31. 3. 2025, 31. 12. 2025 a 30. 6. 2026)"}],"history_comparability":"comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":[]},{"issue_ids":["Q0003","Q0217"],"status":"potvrzeno","observations":["V přiložených datech CERMAT mělo Gymnázium Na Pražačce v roce 2025 nabídku oboru 79-41-K/61 Gymnázium (šestileté) se zaměřením „vybrané předměty v cizím jazyce - zaměření na NJ“; v roce 2026 má stejná škola nabídku téhož oboru se zaměřením „Německý jazyk“. KKOV, délka studia, forma i jazyk studia („Český s výukou vybraných předmětů v cizím jazyce“) jsou v obou letech shodné.","Podle Wikipedie nabízí škola tři zaměření šestiletého gymnázia – všeobecné, výtvarné a německé (třídy D). Článek dále popisuje rozšířenou spolupráci s německými institucemi (DAAD, ZfA, Goethe-Institut), zkoušky DSD1/DSD2 a působení německých pedagogů, což odpovídá tomu, že se vybrané předměty vyučují v němčině.","Web školy dokumentuje v roce 2026 aktivitu tříd s německým zaměřením (výměnný pobyt se Schwäbisch Gmünd, účast v soutěži Jugend debattiert Europa v němčině), tedy pokračující provoz německého zaměření.","Rejstřík MŠMT vede subjekt REDIZO 600004961 (Gymnázium Na Pražačce, Praha 3, Nad Ohradou 23, IČ 60461675) i IZO 000335398 ve všech čtyřech sledovaných snímcích (31. 3. 2025, 31. 12. 2025, 31. 3. 2026, 30. 6. 2026) pod stejným úplným názvem, se sídlem Nad Ohradou 2825/23, Žižkov, a shodným místem výuky na téže adrese; nepřetržitá existence školy mezi přijímacími řízeními 2025 a 2026 je tak potvrzena."],"conclusion":"Jde o tentýž obor a totéž jazykové zaměření šestiletého gymnázia; mezi rokem 2025 a 2026 se změnilo pouze pojmenování zaměření („vybrané předměty v cizím jazyce - zaměření na NJ“ → „Německý jazyk“). Návaznost je přímá, 1:1.","alternative_explanations":["Název zaměření v roce 2025 („vybrané předměty v cizím jazyce“) může působit jako jiný typ programu než „Německý jazyk“; obsahově se ale oba popisy kryjí (CLIL výuka v němčině) a žádný zdroj nedokládá otevření jiného jazykového zaměření."],"relationship":{"type":"rename_only","from":["2025: 79-41-K/61 Gymnázium, zaměření „vybrané předměty v cizím jazyce - zaměření na NJ“ (ID_SOF fe287807-94df-4aaf-921f-6764b57d1dc6)"],"to":["2026: 79-41-K/61 Gymnázium, zaměření „Německý jazyk“ (ID_SOF 69393dde-405e-4263-9a8f-33830e5fa850)"]},"addresses":[{"text":"Nad Ohradou 2825/23, 130 00 Praha 3","role":"sídlo","izo":"izo_000335398","valid_period":"2025–2026","source_url":"https://cs.wikipedia.org/wiki/Gymn%C3%A1zium_Na_Pra%C5%BEa%C4%8Dce"},{"text":"Nad Ohradou 2825, Praha, 13000","role":"místo výuky","izo":"izo_000335398","valid_period":"2025–2026","source_url":"fronta-dohledavani-2025-2026.json, úkol R-600004961"},{"text":"Nad Ohradou 2825/23, Žižkov, 130 00 Praha 3","role":"sídlo","izo":"izo_000335398","valid_period":"2025–2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"},{"text":"Nad Ohradou 2825/23, Žižkov, 130 00 Praha 3","role":"místo výuky (mistaVyuky, rejstřík MŠMT)","izo":"izo_000335398","valid_period":"2025–2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, ium Na Pražačce v roce 2025 nabídku oboru 79-41-K/61 Gymnázium (šestileté) se zaměřením zapsaným jako „všeobecné studim“ (zjevný překlep v podkladu); v roce 2026 má stejná škola nabídku téhož oboru se zaměřením „Všeobecné“. KKOV, délka studia, forma i jazyk studia jsou v obou letech shodné.","Podle Wikipedie je všeobecné zaměření (třídy A) jedním ze tří dlouhodobých zaměření šestiletého gymnázia Na Pražačce.","Agregátor prijimackynaskolu.cz uvádí u školy v roce 2026 tři obory s celkovou kapacitou 90 míst a zároveň vypisuje zaměření roku 2025 včetně zápisu „všeobecné studim“, což potvrzuje, že jde o tatáž tři zaměření v obou letech.","Rejstřík MŠMT vede subjekt REDIZO 600004961 (Gymnázium Na Pražačce, Praha 3, Nad Ohradou 23, IČ 60461675) i IZO 000335398 ve všech čtyřech sledovaných snímcích (31. 3. 2025, 31. 12. 2025, 31. 3. 2026, 30. 6. 2026) pod stejným úplným názvem, se sídlem Nad Ohradou 2825/23, Žižkov, a shodným místem výuky na téže adrese; nepřetržitá existence školy mezi přijímacími řízeními 2025 a 2026 je tak potvrzena."],"conclusion":"Jde o tentýž obor a totéž všeobecné zaměření šestiletého gymnázia; mezi rokem 2025 a 2026 se změnil pouze zápis názvu zaměření („všeobecné studim“ → „Všeobecné“). Návaznost je přímá, 1:1.","alternative_explanations":[],"relationship":{"type":"rename_only","from":["2025: 79-41-K/61 Gymnázium, zaměření „všeobecné studim“ (ID_SOF 9e9f7470-5f24-4111-9946-7a0d2446f41a)"],"to":["2026: 79-41-K/61 Gymnázium, zaměření „Všeobecné“ (ID_SOF 4065b01a-ba63-40dd-a209-2ada87cee853)"]},"addresses":[{"text":"Nad Ohradou 2825/23, 130 00 Praha 3","role":"sídlo","izo":"izo_000335398","valid_period":"2025–2026","source_url":"https://cs.wikipedia.org/wiki/Gymn%C3%A1zium_Na_Pra%C5%BEa%C4%8Dce"},{"text":"Nad Ohradou 2825, Praha, 13000","role":"místo výuky","izo":"izo_000335398","valid_period":"2025–2026","source_url":"fronta-dohledavani-2025-2026.json, úkol R-600004961"},{"text":"Nad Ohradou 2825/23, Žižkov, 130 00 Praha 3","role":"sídlo","izo":"izo_  stav je totožný se snímky k 31. 3. 2025, 31. 12. 2025 a 30. 6. 2026, takže škola mezi přijímacími řízeními 2025 a 2026 existovala nepřetržitě a nešlo o zánik ani vznik nového subjektu.","applicable_period":"stav rejstříku k 31. 3. 2026 (shodný se snímky 31. 3. 2025, 31. 12. 2025 a 30. 6. 2026)"}],"history_comparability":"comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":[]}],"registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT plně potvrdil původní závěry: subjekt REDIZO 600004961 (Gymnázium Na Pražačce, Praha 3, Nad Ohradou 23, IČ 60461675) i IZO 000335398 jsou vedeny ve všech čtyřech snímcích (31. 3. 2025 až 30. 6. 2026) beze změny názvu, sídla (Nad Ohradou 2825/23, Žižkov) i místa výuky, takže škola mezi přijímacími řízeními 2025 a 2026 existovala nepřetržitě. Absence rejstříku v původním nálezu nezpůsobila chybu ani sníženou jistotu – závěry typu rename_only zůstávají v platnosti a jsou nyní doloženy i úředním zdrojem."}},"R-600005143":{"task_id":"R-600005143","queue_version":2,"processed_at":"2026-09-12","registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT plně potvrdil závěry nálezu: subjekt 600005143 (Gymnázium, Praha 4, Na Vítězné pláni 1160, IČ 00335487) i IZO 000335487 jsou vedeny beze změny názvu, sídla i místa výuky ve všech čtyřech snímcích od 31. 3. 2025 do 30. 6. 2026. Tím je potvrzena totožnost školy u přejmenovaných nabídek (francouzština, němčina) i to, že absence španělské nabídky v roce 2026 není způsobena zánikem či přeměnou školy. Absence rejstříku v původním nálezu nezpůsobila chybu ani nejistotu – rejstřík obory a zaměření neeviduje, takže klíčovým důkazem na úrovni nabídek zůstává vlastní dokumentace školy."},"findings":[{"issue_ids":["Q0005","Q0219"],"status":"potvrzeno","observations":["V datech CERMAT za rok 2025 je u Gymnázia, Praha 4, Na Vítězné pláni 1160 (REDIZO 600005143, IZO 000335487) vedena šestiletá nabídka „Gymnázium – s výukou francouzského jazyka“ (KKOV 79-41-K/61, denní studium). V roce 2026 figuruje nabídka „Gymnázium – s výukou francouzštiny“ se stejným kódem oboru 79-41-K/61, stejnou délkou studia (6 let), stejnou školou, IZO i adresou.","Web školy (stránka s výsledky přijímacího řízení v minulých letech) uvádí, že škola v roce 2025 i v roce 2026 přijímala do šestiletého studia třídu 1.B „šestileté studium s výukou francouzského jazyka“ po 30 studentech – škola tedy pro oba ročníky používá dlouhé znění názvu zaměření.","Odlišný zápis v datech 2026 („s výukou francouzštiny“ místo „s výukou francouzského jazyka“) je tedy pouze jiná formulace téhož zaměření, nikoli nový obor. Kód KKOV, délka studia, kapacita (30 míst) i označení třídy (1.B) zůstávají shodné.","Rejstřík MŠMT vede subjekt 600005143 i IZO 000335487 ve snímcích k 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 i 30. 6. 2026 pod stejným názvem (Gymnázium, Praha 4, Na Vítězné pláni 1160) a se stejným sídlem i místem výuky; identita školy se mezi roky 2025 a 2026 tedy vůbec nezměnila a změna se týká výhradně zápisu názvu zaměření v datech CERMAT."],"conclusion":"Šestiletá nabídka s výukou francouzštiny z roku 2026 je pokračováním šestileté nabídky s výukou francouzského jazyka z roku 2025 na téže škole; jde o změnu pouze v zápisu názvu zaměření (vlastní nabídka školy se nezměnila).","alternative_explanations":[],"relationship":{"type":"rename_only","from":["2025/offers/75 (ID_SOF 07620cbb-812e-4eb8-8d28-c7f6fa1c7f5f)"],"to":["2026/offers/333 (ID_SOF 686e3929-3a87-4c9d-a81e-d0a40d69e361)"]},"addresses":[{"text":"Na Vítězné pláni 1160, 140 00 Praha 4","role":"sídlo","izo":"000335487","valid_period":"2025–2026 (obě roky dle dat fronty; dle ŠVP školy dlouhodobě)","source_url":"https://www.gvp.cz/studium/svp/sestilete2020dsd_.pdf"},{"text":"Na Vítězné pláni 1160/1, Nusle, 140 00 Praha 4 (RÚIAN 27536076)","role":"sídlo","izo":"600005143","valid_period":"2025–2026 (shodné ve snímcích rejstříku MŠMT k 2025-03-31, 2025-12-31, 2026-03-31 i 2026-06-30)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"},{"text":"Na Vítězné pláni 1160/1, Nusle, Praha 4 (RÚIAN 27536076)","role":"místo výuky","izo":"000335487","valid_period":"2025–2026 (shodné se sídlem; dle rejstříku MŠMT ve všech čtyřech snímcích)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005143","title":"Přiložená data úkolu (nabídky CERMAT 1. kola JPZ 2025 a 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Shoda školy, IZO, adresy, kódu KKOV 79-41-K/61 a délky studia; odlišný pouze text zaměření (francouzského jazyka → francouzštiny).","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://www.gvp.cz/uchazeci/drivejsi_vysledky","title":"GVP – Přijímací řízení v minulých letech (konečné výsledky 2025 a 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Škola sama dokumentuje, že v roce 2025 i v roce 2026 přijímala třídu 1.B šestiletého studia „s výukou francouzského jazyka“ (30 studentů); potvrzuje kontinuitu nabídky a fakt, že rozdíl je jen v zápisu v datech CERMAT.","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Subjekt 600005143 i IZO 000335487 jsou vedeny shodně (název, sídlo Na Vítězné pláni 1160/1, místo výuky) ve snímcích k 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 i 30. 6. 2026; rejstřík potvrzuje kontinuitu identity školy, na níž proběhlo pouze přejmenování zaměření v datech CERMAT.","applicable_period":"stav rejstříku k 31. 3. 2026 (shodný se snímky 2025-03-31, 2025-12-31 a 2026-06-30)"}],"history_comparability":"comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":[]},{"issue_ids":["Q0006","Q0220"],"status":"potvrzeno","observations":["V datech CERMAT za rok 2025 je u téže školy vedena šestiletá nabídka „Gymnázium – s posílenou výukou německého jazyka“ (KKOV 79-41-K/61). V roce 2026 figuruje „Gymnázium – s posílenou výukou němčiny“, opět s kódem 79-41-K/61, šestiletou délkou, stejným IZO i adresou.","Web školy uvádí, že v roce 2025 i v roce 2026 přijímala třídu 1.A „šestileté studium s posílenou výukou německého jazyka“ po 30 studentech; škola tedy pro oba roky používá dlouhé znění.","Školní vzdělávací program školy dokumentuje, že program „Všeobecné gymnázium č.j. 230/09 s posílenou výukou německého jazyka“ na škole existuje dlouhodobě (registrován od roku 2009) pod IZO 000335487 a REDIZO 600005143.","Odlišný zápis v datech 2026 („s posílenou výukou němčiny“) je pouze jiná formulace téhož zaměření, nikoli nový obor.","Rejstřík MŠMT potvrzuje údaje ze ŠVP: subjekt 600005143 (IČ 00335487) a IZO 000335487 jsou vedeny ve všech snímcích od 31. 3. 2025 do 30. 6. 2026 beze změny názvu, sídla i místa výuky; totožnost právnické osoby i školy mezi roky 2025 a 2026 je tedy prokázána i z úřední evidence."],"conclusion":"Šestiletá nabídka s posílenou výukou němčiny z roku 2026 je pokračováním šestileté nabídky s posílenou výukou německého jazyka z roku 2025 na téže škole; jde o změnu pouze v zápisu názvu zaměření.","alternative_explanations":[],"relationship":{"type":"rename_only","from":["2025/offers/76 (ID_SOF 755d6a06-4278-4e6c-a146-4be953ed0445)"],"to":["2026/offers/334 (ID_SOF 8e9e6915-2d9f-4425-8e2c-00182d492fc1)"]},"addresses":[{"text":"Na Vítězné pláni 1160, 140 00 Praha 4","role":"sídlo","izo":"000335487","valid_period":"2025–2026 (obě roky dle dat fronty; dle ŠVP školy dlouhodobě)","source_url":"https://www.gvp.cz/studium/svp/sestilete2020dsd_.pdf"},{"text":"Na Vítězné pláni 1160/1, Nusle, 140 00 Praha 4 (RÚIAN 27536076)","role":"sídlo","izo":"600005143","valid_period":"2025–2026 (shodné ve snímcích rejstříku MŠMT k 2025-03-31, 2025-12-31, 2026-03-31 i 2026-06-30)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"},{"text":"Na Vítězné pláni 1160/1, Nusle, Praha 4 (RÚIAN 27536076)","role":"místo výuky","izo":"000335487","valid_period":"2025–2026 (shodné se sídlem; dle rejstříku MŠMT ve všech čtyřech snímcích)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005143","title":"Přiložená data úkolu (nabídky CERMAT 1. kola JPZ 2025 a 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Shoda školy, IZO, adresy, kódu KKOV 79-41-K/61 a délky studia; odlišný pouze text zaměření (německého jazyka → němčiny).","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://www.gvp.cz/uchazeci/drivejsi_vysledky","title":"GVP – Přijímací řízení v minulých letech (konečné výsledky 2025 a 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Škola dokumentuje přijímání třídy 1.A šestiletého studia „s posílenou výukou německého jazyka“ (30 studentů) v roce 2025 i 2026.","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://www.gvp.cz/studium/svp/sestilete2020dsd_.pdf","title":"ŠVP Gymnázia Na Vítězné pláni – šestiletý program s posílenou výukou německého jazyka","published_at":null,"checked_at":"2026-09-12","supports":"Dokládá totožnost právnické osoby (IČO 00335487, IZO 000335487, IZO ředitelství 600005143) a dlouhodobou existenci programu s posílenou výukou německého jazyka (č.j. 230/09).","applicable_period":"dokument z roku cca 2020; program registrován od 2009"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Subjekt 600005143 (IČ 00335487) a IZO 000335487 jsou vedeny shodně (název, sídlo, místo výuky) ve snímcích k 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 i 30. 6. 2026; rejstřík nezávisle potvrzuje totožnost školy doloženou ŠVP.","applicable_period":"stav rejstříku k 31. 3. 2026 (shodný se snímky 2025-03-31, 2025-12-31 a 2026-06-30)"}],"history_comparability":"comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":[]},{"issue_ids":["Q0007"],"status":"potvrzeno","observations":["V datech CERMAT za rok 2025 škola nabízela třetí šestiletou nabídku „Gymnázium – s výukou španělského jazyka“ (KKOV 79-41-K/61). V datech za rok 2026 žádná nabídka se španělštinou u tohoto REDIZO není – šestileté studium je zastoupeno jen zaměřeními na němčinu a francouzštinu.","Web školy tuto absenci přímo potvrzuje: ve výsledcích přijímacího řízení 2026 uvádí pro šestileté studium pouze třídu 1.A (posílená němčina) a 1.B (francouzština), zatímco v roce 2025 ještě uvádí třetí třídu 1.C „šestileté studium s výukou španělského jazyka“ (30 studentů, 622 přihlášek).","Na aktuální stránce pro uchazeče (přijímací řízení 2027) škola opět otevírá tři třídy šestiletého studia včetně třídy 1.C se španělštinou. Španělské zaměření tedy bylo pro ročník 2026 pouze přerušeno a pro rok 2027 je obnoveno – nejde o trvalý zánik oboru.","Sama absence v datech CERMAT by zánik nedokazovala; rozhodující je vlastní dokumentace školy o přijímacích řízeních 2025 a 2026.","Rejstřík MŠMT vede subjekt 600005143 i IZO 000335487 nepřetržitě ve všech snímcích od 31. 3. 2025 do 30. 6. 2026 beze změny názvu, sídla i místa výuky – vypadnutí španělské nabídky v roce 2026 tedy není způsobeno zánikem, sloučením ani přeměnou školy. Rejstřík obory a zaměření neeviduje, takže samotné přerušení nabídky nepotvrzuje ani nevyvrací; dokládá je dokumentace školy."],"conclusion":"Šestiletá nabídka s výukou španělského jazyka byla v přijímacím řízení 2026 na této škole neotevřena (přerušení na jeden ročník); pro rok 2027 ji škola znovu otevírá. Nemá tedy v roce 2026 žádnou návaznost a nelze ji mapovat na žádnou jinou nabídku.","alternative_explanations":["Data fronty pokrývají pouze 1. kolo jednotné přijímací zkoušky; teoreticky by škola mohla španělskou nabídku vypisovat v 2. kole 2026 – to zdroje nevylučují, ale vlastní výsledková dokumentace školy za rok 2026 španělskou třídu šestiletého studia neuvádí."],"relationship":{"type":"closed","from":["2025/offers/77 (ID_SOF 20336212-a8d0-4914-b542-7cc0ce10894b)"],"to":[]},"addresses":[{"text":"Na Vítězné pláni 1160, 140 00 Praha 4","role":"sídlo","izo":"000335487","valid_period":"2025–2026 (obě roky dle dat fronty; dle ŠVP školy dlouhodobě)","source_url":"https://www.gvp.cz/studium/svp/sestilete2020dsd_.pdf"},{"text":"Na Vítězné pláni 1160/1, Nusle, 140 00 Praha 4 (RÚIAN 27536076)","role":"sídlo","izo":"600005143","valid_period":"2025–2026 (shodné ve snímcích rejstříku MŠMT k 2025-03-31, 2025-12-31, 2026-03-31 i 2026-06-30)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"},{"text":"Na Vítězné pláni 1160/1, Nusle, Praha 4 (RÚIAN 27536076)","role":"místo výuky","izo":"000335487","valid_period":"2025–2026 (shodné se sídlem; dle rejstříku MŠMT ve všech čtyřech snímcích)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005143","title":"Přiložená data úkolu (nabídky CERMAT 1. kola JPZ 2025 a 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Nabídka s výukou španělského jazyka existuje v roce 2025 a chybí v roce 2026 (1. kolo JPZ).","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://www.gvp.cz/uchazeci/drivejsi_vysledky","title":"GVP – Přijímací řízení v minulých letech (konečné výsledky 2025 a 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Dokládá, že v roce 2025 škola přijímala třídu 1.C šestiletého studia s výukou španělského jazyka a v roce 2026 přijímala pouze třídy 1.A (němčina) a 1.B (francouzština) – španělské zaměření tedy v 2026 neotevřela.","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://www.gvp.cz/uchazeci/prijimane_tridy","title":"GVP – Přijímané třídy (přijímací řízení 2027)","published_at":null,"checked_at":"2026-09-12","supports":"Pro rok 2027 škola opět otevírá tři třídy šestiletého studia včetně třídy 1.C angličtina–španělština; španělské zaměření tedy bylo v roce 2026 pouze přerušeno.","applicable_period":"přijímací řízení 2027"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Subjekt 600005143 i IZO 000335487 existují nepřetržitě ve všech snímcích od 31. 3. 2025 do 30. 6. 2026 beze změny; absence španělské nabídky v roce 2026 tedy není způsobena zánikem či přeměnou školy. Rejstřík obory neeviduje, takže samotné přerušení nabídky dokládá dokumentace školy.","applicable_period":"stav rejstříku k 31. 3. 2026 (shodný se snímky 2025-03-31, 2025-12-31 a 2026-06-30)"}],"history_comparability":"not_comparable","recommended_action":"record_only","related_task_ids":[],"unanswered_questions":[]}]},"R-600005381":{"task_id":"R-600005381","queue_version":2,"processed_at":"2026-09-12","findings":[{"issue_ids":["Q0008","Q0256"],"status":"potvrzeno","observations":["V datech CERMAT za rok 2025 je u školy Akademie řemesel Praha - SŠ technická (REDIZO 600005381, Zelený pruh 1294, Praha) nepřiřazená nabídka oboru Autotronik (kód KKOV 39-41-L/01, čtyřleté denní studium) se zaměřením zapsaným jako „23-68-H/01 Mechanik opravář motorových vozidel“.","V datech za rok 2026 je u stejné školy nepřiřazená nabídka téhož oboru Autotronik (39-41-L/01) se zaměřením zapsaným obráceně: „Mechanik opravář motorových vozidel 23-68-H/01“.","Oba záznamy se shodují ve všech podstatných údajích – REDIZO, IZO (izo_007810041), název školy, adresa, kód a název oboru, kód a název zaměření, délka studia (4 roky), denní forma, český jazyk. Jediný rozdíl je pořadí kódu a názvu zaměření v textovém poli „ZAMĚŘENÍ OBORU“ (rok 2025: kód před názvem; rok 2026: kód za názvem). Stejná změna formátu zápisu je vidět i u ostatních oborů této školy, které byly přiřazeny (např. Mechanik seřizovač, Mechanik instalatérských a elektrotechnických zařízení), takže jde o celoplošnou změnu formátu exportu, nikoli o změnu nabídky školy.","Autotronik je čtyřletý maturitní obor, ve kterém žáci mohou získat i výuční list; „zaměření“ v datech odpovídá příslušnému učebnímu oboru (zde Mechanik opravář motorových vozidel 23-68-H/01). Nezávislé katalogy (Atlas Školství, Stredniskoly.cz) uvádějí obor Autotronik 39-41-L/01 u této školy i pro školní rok 2026/27, a to právě se zaměřeními Mechanik opravář motorových vozidel a Autoelektrikář; stránka školy na zelenypruh.cz má pro obor Autotronik samostatnou stránku a potvrzuje totožnost školy (IČ 148 915 22, IZO 600005381, Zelený pruh 1294/52, Praha 4).","Rejstřík MŠMT vede subjekt REDIZO 600005381 (IČ 14891522, „Akademie řemesel Praha - Střední škola technická“) ve všech čtyřech snímcích 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 a 30. 6. 2026 pod stejným REDIZO, názvem a sídlem Zelený pruh 1294/52, Krč, PSČ 147 00 – kontinuita školy mezi přijímacími řízeními 2025 a 2026 je tedy úředním registrem potvrzena (rejstřík používá plný název „Střední škola technická“, CERMAT zkrácený „SŠ technická“).","Rejstřík vede k IZO 007810041 (Střední škola) kromě místa výuky C11 Zelený pruh 1294/52, Krč (shodného se sídlem) také místo výuky C10 Vrbova 1233/34, Braník, a to ve všech čtyřech snímcích; adresa v datech CERMAT (Zelený pruh 1294) odpovídá sídlu, které je zároveň řádným místem výuky."],"conclusion":"Nepřiřazená nabídka 2025 (Autotronik, zaměření Mechanik opravář motorových vozidel 23-68-H/01) a nepřiřazená nabídka 2026 jsou jedna a táž nabídka téhož oboru na téže škole. Rozpor vznikl pouze změnou formátu textového zápisu zaměření mezi ročníky dat CERMAT (prohození pořadí kódu a názvu), nikoli skutečnou změnou nabídky. Návaznost 2025→2026 lze schválit.","alternative_explanations":["Teoreticky by škola mohla mezi roky obor zrušit a znovu otevřít se stejnými kódy; tomu ale odporuje souvislá evidence oboru v nezávislých katalogech pro rok 2026/27 i shoda všech ostatních údajů."],"relationship":{"type":"continuation","from":["2025/ID_SOF fb75a4df-3490-4788-bb44-820d0c3c1920 (Autotronik 39-41-L/01, zaměření Mechanik opravář motorových vozidel 23-68-H/01)"],"to":["2026/ID_SOF d7613ae5-c160-4daf-bf21-bb7259ef138b (Autotronik 39-41-L/01, zaměření Mechanik opravář motorových vozidel 23-68-H/01)"]},"addresses":[{"text":"Zelený pruh 1294/52, 147 00 Praha 4","role":"sídlo","izo":"izo_007810041","valid_period":"2025–2026 (i aktuálně dle webu školy)","source_url":"https://www.zelenypruh.cz/obory/autotronik/"},{"text":"Zelený pruh 1294/52, Krč, 147 00 Praha 4","role":"sídlo (rejstřík MŠMT)","izo":"izo_007810041","valid_period":"všechny snímky rejstříku 31. 3. 2025 – 30. 6. 2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld"},{"text":"Vrbova 1233/34, Braník, Praha 4","role":"místo výuky (C10) IZO 007810041","izo":"izo_007810041","valid_period":"všechny snímky rejstříku 31. 3. 2025 – 30. 6. 2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005381","title":"Přiložená data fronty – nabídky CERMAT 2025 a 2026 pro REDIZO 600005381","published_at":null,"checked_at":"2026-09-12","supports":"Záznamy Q0008 (2025) a Q0256  915 22, IZO 600005381.","applicable_period":"aktuální nabídka školy (2026)"},{"url":"https://www.stredniskoly.cz/skola/600005381.html","title":"Akademie řemesel Praha - Střední škola technická – Stredniskoly.cz","published_at":null,"checked_at":"2026-09-12","supports":"Katalog pro REDIZO 600005381 uvádí pro školní rok 2026/27 mimo jiné obor Autotronik 39-41-L/01 (denní, 4 roky, kapacita 30) a samostatné učební obory Autoelektrikář 26-57-H/01 a Mechanik opravář motorových vozidel 23-68-H/01 – tedy kontinuitu autooborů školy.","applicable_period":"školní rok 2026/27"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2025)","published_at":"2025-03-31","checked_at":"2026-09-12","supports":"Snímek vede subjekt REDIZO 600005381 pod názvem „Akademie řemesel Praha - Střední škola technická“ (IČ 14891522) se sídlem Zelený pruh 1294/52, Krč, PSČ 147 00; IZO 007810041 (Střední škola) má místa výuky C11 Zelený pruh 1294/52 a C10 Vrbova 1233/34, Braník. Dokládá existenci a identitu školy v období přijímacího řízení 2025.","applicable_period":"stav rejstříku k 31. 3. 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":"2026-03-31","checked_at":"2026-09-12","supports":"Subjekt REDIZO 600005381 je ve snímku veden beze změny názvu, sídla i míst výuky oproti 31. 3. 2025. Dokládá kontinuitu školy mezi přijímacími řízeními 2025 a 2026.","applicable_period":"stav rejstříku k 31. 3. 2026"}],"history_comparability":"comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":[]}],"registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT potvrdil závěry obou nálezů: subjekt REDIZO 600005381 (Akademie řemesel Praha - Střední škola technická, IČ 14891522) je veden ve všech čtyřech snímcích 31. 3. 2025 – 30. 6. 2026 beze změny názvu a sídla Zelený pruh 1294/52, Krč, takže identita a kontinuita školy mezi přijímacími řízeními 2025 a 2026 je úředně doložena. Absence rejstříku v původním nálezu nezpůsobila chybu ani podstatnou nejistotu – závěry o formátové, nikoli věcné příčině rozporu v datech CERMAT zůstávají v platnosti. Jedinou novou skutečností je, že IZO 007810041 má vedle sídla (místo výuky C11) i druhé místo výuky C10 Vrbova 1233/34, Braník, které původní nález neuváděl."}},"R-600005500":{"task_id":"R-600005500","queue_version":2,"processed_at":"2026-09-12","registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT ve všech čtyřech snímcích (31. 3. 2025 až 30. 6. 2026) potvrzuje identitu školy: REDIZO 600005500, IZO 061384992, beze změny úplného názvu „Gymnázium Oty Pavla, Praha 5, Loučanská 520“ i sídla Loučanská 520/1, Radotín – kontinuita subjektu mezi roky 2025 a 2026 je tak potvrzena. Absence rejstříku v původním nálezu nezpůsobila chybu v hlavních závěrech, pouze jednu dílčí nepřesnost: škola má dle rejstříku dvě místa výuky (Loučanská 520/1 a náměstí Osvoboditelů 1740/17, Radotín), nikoli jedinou budovu. Otázku trvalosti ukončení programu PROUD rejstřík nevyřešil, protože zaměření v rámci oboru neeviduje."},"findings":[{"issue_ids":["Q0010","Q0300"],"status":"potvrzeno","observations":["V datech CERMAT za 1. kolo přijímacího řízení 2025 mělo Gymnázium Oty Pavla (REDIZO 600005500, IZO 061384992, Loučanská 520, Praha 5 – Radotín) dvě čtyřleté nabídky oboru 79-41-K/41 Gymnázium: „ŠVP GOP“ a „ŠVP PROUD“. V roce 2026 je v datech jen jedna čtyřletá nabídka, „ŠVP GOP všeobecné“.","Kritéria přijímacího řízení zveřejněná školou 30. 1. 2025 pro školní rok 2025/2026 potvrzují dvě oddělené čtyřleté přijímací proudy: obor 79-41-K/41 „ŠVP GOP“ s kapacitou 30 žáků (hodnocení prospěchu, soutěží a jednotné přijímací zkoušky, celkem max. 141 bodů) a obor 79-41-K/41 „ŠVP GOP PROUD“ s kapacitou 17 žáků (navíc školní zkouška – ústní pohovor a portfolio).","Kritéria zveřejněná školou 30. 1. 2026 pro školní rok 2026/2027 obsahují pro čtyřleté studium jediný proud: obor 79-41-K/41 „Gymnázium čtyřleté, ŠVP GOP“ s kapacitou 30 žáků a se stejnou strukturou hodnocení jako „ŠVP GOP“ v roce 2025 (prospěch max. 30 bodů, soutěže, jednotné zkoušky, celkem max. 141 bodů, bez portfolia a pohovoru). Samostatná kritéria pro PROUD pro rok 2026/2027 na webu školy neexistují.","Škola v kritériích pro rok 2026/2027 nadále označuje program jako „ŠVP GOP“; označení „ŠVP GOP všeobecné“ pochází z dat CERMAT. Školní vzdělávací program školy (dokument z roku 2018 dostupný na webu školy) uvádí čtyřleté studium jako všeobecné.","Název školy, IZO 061384992, REDIZO 600005500, adresa Loučanská 520, Praha 5 – Radotín a ředitelka RNDr. Jana Hrkalová jsou v obou letech shodné (dle dat fronty, kritérií z let 2025 i 2026 a ŠVP školy). Šestiletý obor 79-41-K/61 s rozšířenou výukou angličtiny pokračuje v obou letech a není předmětem otázek.","Rejstřík MŠMT vede subjekt pod REDIZO 600005500 (IČ 61384992) ve všech čtyřech dostupných snímcích – k 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 i 30. 6. 2026 – pod stejným úplným názvem „Gymnázium Oty Pavla, Praha 5, Loučanská 520“ a sídlem Loučanská 520/1, Radotín; identita školy se mezi přijímacími řízeními 2025 a 2026 nezměnila a škola nezanikla ani se nesloučila.","Rejstřík MŠMT uvádí pro IZO 061384992 ve všech čtyřech snímcích dvě místa výuky: Loučanská 520/1, Radotín (RÚIAN 22049967, shodné se sídlem) a náměstí Osvoboditelů 1740/17, Radotín (RÚIAN 82217343). Dřívější poznámka v tomto nálezu, že škola má jedinou budovu, tak rejstřík nepotvrzuje; které místo výuky hostilo který přijímací proud, rejstřík nerozlišuje."],"conclusion":"Čtyřletá nabídka „ŠVP GOP všeobecné“ z roku 2026 je přímým pokračováním čtyřleté nabídky „ŠVP GOP“ z roku 2025: jde o tentýž obor 79-41-K/41 téže školy, se stejnou kapacitou 30 žáků a totožným typem kritérií. Změna „GOP“ → „GOP všeobecné“ je pouze změna zápisu zaměření v datech CERMAT, nikoli nový obor – škola program v kritériích pro oba roky označuje „ŠVP GOP“.","alternative_explanations":["Formálně nelze vyloučit, že do jediné čtyřleté nabídky 2026 byly sloučeny oba proudy z roku 2025 (GOP i PROUD); tomu ale odporuje shodná kapacita 30 žáků a totožná kritéria jako u proudu GOP v roce 2025, zatímco proud PROUD měl odlišná kritéria i kapacitu 17 žáků. Sloučení nabídek proto data nepodporují.","Druhé místo výuky evidované rejstříkem (náměstí Osvoboditelů 1740/17, Radotín) může sloužit jiné části výuky (např. tělesné výchově či šestiletému oboru); rejstřík konkrétní využití neuvádí. Na závěr o kontinuitě oboru 79-41-K/41 to nemá vliv, protože nabídky CERMAT v obou letech uvádějí adresu Loučanská 520."],"relationship":{"type":"continuation","from":["2025: 79-41-K/41 Gymnázium, ŠVP GOP (4leté, denní), ID_SOF 74e2a736-c18f-4cfc-b7d8-1bfe712f1dd9"],"to":["2026: 79-41-K/41 Gymnázium, ŠVP GOP všeobecné (4leté, denní), ID_SOF 362a8d64-fe23-4466-bf74-64484a934aa0"]},"addresses":[{"text":"Loučanská 520/1, Praha 5 – Radotín, 153 00 (RÚIAN 22049967)","role":"sídlo","izo":"izo_061384992","valid_period":"2025 i 2026 (beze změny; dle rejstříku MŠMT i snímků k 31. 3. 2025 a 31. 3. 2026)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"},{"text":"Loučanská 520/1, Praha 5 – Radotín, 153 00 (RÚIAN 22049967)","role":"místo výuky","izo":"izo_061384992","valid_period":"2025 i 2026 (dle rejstříku MŠMT ve všech čtyřech snímcích)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"},{"text":"náměstí Osvoboditelů 1740/17, Praha 5 – Radotín, 153 00 (RÚIAN 82217343)","role":"místo výuky","izo":"izo_061384992","valid_period":"2025 i 2026 (dle rejstříku MŠMT ve všech čtyřech snímcích)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005500","title":"Data CERMAT 1. kola JPZ 2025 a 2026 (přiložené context_offers)","published_at":null,"checked_at":"2026-09-12","supports":"Seznam nabídek školy v obou letech: 2025 dvě čtyřleté nabídky (ŠVP GOP, ŠVP PROUD), 2026 jedna čtyřletá nabídka (ŠVP GOP všeobecné); shodné IZO, REDIZO, adresa a kód KKOV.","applicable_period":"přijímací řízení 2025 a 2026 (školní roky 2025/2026 a 2026/2027)"},{"url":"https://gop.cz/wp-content/uploads/2025/01/Kriteria-ctyrlete-25.docx.pdf","title":"Kritéria přijímacího řízení pro školní rok 2025/2026, obor 79-41-K/41 Gymnázium čtyřleté, ŠVP GOP","published_at":"2025-01-30","checked_at":"2026-09-12","supports":"Existence samostatného čtyřletého proudu „ŠVP GOP“ v roce 2025, kapacita 30 žáků, kritéria bez školní zkoušky.","applicable_period":"přijímací řízení pro školní rok 2025/2026"},{"url":"https://gop.cz/wp-content/uploads/2026/01/Kriteria-ctyrlete-26.pdf","title":"Kritéria přijímacího řízení pro školní rok 2026/2027, obor 79-41-K/41 Gymnázium čtyřleté, ŠVP GOP","published_at":"2026-01-30","checked_at":"2026-09-12","supports":"Pro rok 2026/2027 škola vyhlásila jediný čtyřletý proud „ŠVP GOP“ s kapacitou 30 žáků a kritérii shodného typu jako GOP 2025; škola program nadále nazývá „ŠVP GOP“.","applicable_period":"přijímací řízení pro školní rok 2026/2027"},{"url":"https://gop.cz/wp-content/uploads/2020/08/svp_4g_2018.pdf","title":"Školní vzdělávací program Gymnázia Oty Pavla – čtyřletý (2018)","published_at":"2018-09-03","checked_at":"2026-09-12","supports":"Identita školy (IČ 61384992, resortní identifikátor 600005500, IZO 061384992, zřizovatel Hlavní město Praha) a charakter čtyřletého studia jako všeobecného.","applicable_period":"od 3. 9. 2018"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2025)","published_at":"2025-03-31","checked_at":"2026-09-12","supports":"Subjekt REDIZO 600005500 (Gymnázium Oty Pavla, Praha 5, Loučanská 520, IČ 61384992) a IZO 061384992 (střední škola) jsou vedeny v rejstříku v době 1. kola JPZ 2025; sídlo Loučanská 520/1, Radotín, místa výuky Loučanská 520/1 a náměstí Osvoboditelů 1740/17, Radotín.","applicable_period":"stav rejstříku k 31. 3. 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":"2026-03-31","checked_at":"2026-09-12","supports":"Tentýž subjekt i IZO 061384992 jsou v době 1. kola JPZ 2026 vedeny beze změny úplného názvu, sídla i míst výuky oproti snímku k 31. 3. 2025; dokládá kontinuitu školy mezi roky 2025 a 2026.","applicable_period":"stav rejstříku k 31. 3. 2026"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 30. 6. 2026)","published_at":"2026-06-30","checked_at":"2026-09-12","supports":"Subjekt REDIZO 600005500 i IZO 061384992 jsou vedeny beze změny i na konci školního roku 2025/2026; škola nezanikla ani se nesloučila.","applicable_period":"stav rejstříku k 30. 6. 2026"}],"history_comparability":"comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":[]},{"issue_ids":["Q0011"],"status":"potvrzeno","observations":["Nabídka „ŠVP PROUD“ (79-41-K/41 Gymnázium, 4leté denní studium) se v datech CERMAT objevuje pouze v roce 2025; v roce 2026 žádná nabídka se zaměřením PROUD u této školy není.","Kritéria školy pro rok 2025/2026 ukazují, že PROUD byl skutečně oddělený přijímací proud: kapacita 17 žáků, kromě jednotných zkoušek CERMAT školní zkouška v podobě ústního pohovoru a hodnocení portfolia (úspěchy, zájmy, dobrovolnictví).","V kritériích pro rok 2026/2027 (zveřejněna 30. 1. 2026) žádný proud PROUD ani jiná druhá čtyřletá nabídka nefiguruje; čtyřleté studium je vypsáno pouze jako „ŠVP GOP“ s kapacitou 30 žáků.","Kapacita jediné čtyřleté nabídky zůstala v roce 2026 na 30 žácích, tj. shodná s proudem GOP 2025; původní součet kapacit obou proudů (30 + 17 = 47) se do jedné nabídky nesloučil. To podporuje výklad, že samostatné přijímání do PROUD bylo pro rok 2026/2027 ukončeno, nikoli sloučeno s proudem GOP.","Žáci přijatí do PROUD v roce 2025 ve škole zjevně pokračují ve vyšších ročnících; absence nového přijímání sama neříká nic o dobudování jejich studia.","Rejstřík MŠMT dokládá, že škola jako právní subjekt mezi roky 2025 a 2026 nezanikla ani se nesloučila – REDIZO 600005500 a IZO 061384992 jsou vedeny beze změny názvu a sídla ve snímcích k 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 i 30. 6. 2026. Zmizení nabídky PROUD tedy není důsledkem zániku školy, ale změnou na úrovni programu. Zaměření v rámci oboru 79-41-K/41 rejstřík neeviduje, takže trvalost ukončení PROUD nepotvrzuje ani nevyvrací."],"conclusion":"Samostatný čtyřletý přijímací proud „ŠVP GOP PROUD“ (79-41-K/41) škola pro školní rok 2026/2027 nevyhlásila – v 1. kole přijímacího řízení 2026 nemá nástupce. Nepodařilo se však doložit, zda jde o trvalé ukončení programu, nebo jen o přerušení přijímání nových žáků na jeden rok.","alternative_explanations":["Program PROUD může být pouze přerušen (např. pro nízký zájem nebo organizační důvody) a škola ho může v pozdějších letech obnovit.","Teoreticky může být obsah programu PROUD začleněn do jediné čtyřleté třídy po nástupu (vnitřní diferenciace uvnitř oboru), aniž by šlo o samostatnou přijímací nabídku; to z dostupných zdrojů nelze potvrdit ani vyvrátit."],"relationship":{"type":"closed","from":["2025: 79-41-K/41 Gymnázium, ŠVP PROUD (4leté, denní), ID_SOF bbe80461-f962-408d-9d97-1594441d5714"],"to":[]},"addresses":[{"text":"Loučanská 520, Praha 5 – Radotín, 153 00","role":"místo výuky","izo":"izo_061384992","valid_period":"2025","source_url":"https://gop.cz/wp-content/uploads/2025/01/Kriteria-ctyrlete-PROUD-25.docx.pdf"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005500","title":"Data CERMAT 1. kola JPZ 2025 a 2026 (přiložené context_offers)","published_at":null,"checked_at":"2026-09-12","supports":"Nabídka ŠVP PROUD existuje jen v roce 2025; v nabídkách 2026 chybí.","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://gop.cz/wp-content/uploads/2025/01/Kriteria-ctyrlete-PROUD-25.docx.pdf","title":"Kritéria přijímacího řízení pro školní rok 2025/2026, obor 79-41-K/41 Gymnázium – čtyřleté, ŠVP GOP PROUD","published_at":"2025-01-30","checked_at":"2026-09-12","supports":"PROUD byl v roce 2025 samostatný přijímací proud s kapacitou 17 žáků a vlastní školní zkouškou (pohovor + portfolio).","applicable_period":"přijímací řízení pro školní rok 2025/2026"},{"url":"https://gop.cz/wp-content/uploads/2026/01/Kriteria-ctyrlete-26.pdf","title":"Kritéria přijímacího řízení pro školní rok 2026/2027, obor 79-41-K/41 Gymnázium čtyřleté, ŠVP GOP","published_at":"2026-01-30","checked_at":"2026-09-12","supports":"Pro rok 2026/2027 je vypsán pouze jediný čtyřletý proud (ŠVP GOP, 30 žáků); kritéria pro PROUD neexistují.","applicable_period":"přijímací řízení pro školní rok 2026/2027"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":"2026-03-31","checked_at":"2026-09-12","supports":"Škola (REDIZO 600005500, IZO 061384992) je v době 1. kola JPZ 2026 vedena beze změny oproti roku 2025; zánik nabídky PROUD je změnou na úrovni programu, nikoli zánikem subjektu. Zaměření oborů rejstřík neeviduje.","applicable_period":"stav rejstříku k 31. 3. 2026"}],"history_comparability":"not_comparable","recommended_action":"record_only","related_task_ids":[],"unanswered_questions":["Je ukončení přijímání do programu PROUD trvalé, nebo jde o jednoroční přerušení? K tomu by pomohla výroční zpráva školy za 2025/2026 nebo vyjádření školy."]}]},"R-600005518":{"task_id":"R-600005518","queue_version":2,"processed_at":"2026-09-12","registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT plně potvrdil původní závěry: subjekt REDIZO 600005518 (Gymnázium Christiana Dopplera, IČ 61385701) i jeho IZO 061385701 (Střední škola) jsou vedeny ve všech čtyřech snímcích (31. 3. 2025, 31. 12. 2025, 31. 3. 2026, 30. 6. 2026) beze změny názvu, sídla Zborovská 621/45, Malá Strana, Praha 5, i místa výuky C51 na téže adrese. Absence rejstříku v původním nálezu nezpůsobila chybu ani nejistotu – závěr rename_only byl podložen daty CERMAT a webem školy a rejstřík jej nyní nezávisle stvrzuje."},"findings":[{"issue_ids":["Q0012","Q0302"],"status":"potvrzeno","observations":["V datech CERMAT za rok 2025 se nabídka osmiletého gymnázia Gymnázia Christiana Dopplera (REDIZO 600005518, IZO izo_061385701, Zborovská 621, Praha) jmenovala „Myslím, tedy jsem (zaměření na matematiku s rozšířenou výukou informatiky a fyziky)“ s kódem oboru 79-41-K/81. V roce 2026 je u stejné školy, na stejné adrese a pod stejným kódem oboru 79-41-K/81 nabídka „Myslím, tedy jsem“ – bez vysvětlující závorky.","Web školy pro přijímací řízení na školní rok 2026/2027 (kritéria datována 28. 1. 2026) uvádí obor jako 79-41-K/81 „Myslím, tedy jsem“, osmileté studium se zaměřením na matematiku s rozšířenou výukou informatiky a fyziky. Popisné zaměření z roku 2025 tedy přesně odpovídá obsahu oboru v roce 2026; změnil se jen způsob zápisu názvu v datech CERMAT (popis zaměření se přesunul z názvu do samostatného textu).","KamDoSkoly.cz (agregátor z rejstříku škol MŠMT a otevřených dat CERMAT) potvrzuje kontinuitu školy pod REDIZO 600005518 na adrese Zborovská 621/45 a uvádí tutéž nabídku pod delším názvem i pro rok 2024 („osmileté studium se zaměřením na matematiku s rozšířenou výukou informatiky a fyziky“), s konstantní kapacitou 30 míst napříč lety 2024–2026.","Rejstřík MŠMT vede subjekt REDIZO 600005518 (Gymnázium Christiana Dopplera, IČ 61385701) ve všech čtyřech snímcích (31. 3. 2025, 31. 12. 2025, 31. 3. 2026 i 30. 6. 2026) pod stejným názvem a se stejným sídlem Zborovská 621/45, Malá Strana, 150 00 Praha 5; IZO 061385701 (Střední škola) má ve všech snímcích místo výuky C51 na téže adrese. Rejstřík tedy potvrzuje kontinuitu školy i stability adresy mezi přijímacími řízeními 2025 a 2026."],"conclusion":"Jde o tentýž obor: osmileté gymnázium 79-41-K/81 se zaměřením na matematiku s rozšířenou výukou informatiky a fyziky na Gymnáziu Christiana Dopplera. Mezi roky 2025 a 2026 došlo pouze ke změně zápisu názvu nabídky (zkrácení o popis zaměření v závorce), nikoli ke změně oboru, kódu KKOV, délky studia ani kapacity. Nabídku Q0012 z roku 2025 lze spárovat s nabídkou Q0302 z roku 2026.","alternative_explanations":[],"relationship":{"type":"rename_only","from":["offers_2025 index 128 (Q0012): 79-41-K/81 „Myslím, tedy jsem (zaměření na matematiku s rozšířenou výukou informatiky a fyziky)“"],"to":["offers_2026 index 1508 (Q0302): 79-41-K/81 „Myslím, tedy jsem“"]},"addresses":[{"text":"Zborovská 621/45, Malá Strana, 150 00 Praha 5","role":"sídlo","izo":"izo_061385701","valid_period":"2024–2026 (beze změny dle rejstříku a dat CERMAT)","source_url":"https://www.kamdoskoly.cz/skola/gymnazium-gymnazium-christiana-dopplera-600005518.html"},{"text":"Zborovská 621/45, Malá Strana, 150 00 Praha 5","role":"sídlo (dle rejstříku MŠMT)","izo":"izo_061385701","valid_period":"konstantní ve snímcích 2025-03-31, 2025-12-31, 2026-03-31 i 2026-06-30","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld"},{"text":"Zborovská 621/45, Malá Strana, 150 00 Praha 5","role":"místo výuky C51 (dle
