cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005518","title":"Data fronty – nabídky CERMAT 2025 a 2026 pro REDIZO 600005518","published_at":null,"checked_at":"2026-09-12","supports":"Stejné REDIZO, IZO, adresa, kód KKOV 79-41-K/81, délka studia 8 let a forma v obou letech; liší se pouze text zaměření (2025 s popisnou závorkou, 2026 bez ní).","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://www.gchd.cz/pro-uchazece/prijimaci-rizeni/","title":"Přijímací řízení – Gymnázium Christiana Dopplera (kritéria pro 2026/2027, datováno 28. 1. 2026)","published_at":"2026-01-28","checked_at":"2026-09-12","supports":"Škola sama označuje obor jako 79-41-K/81 „Cizí jazyky – brána do světa“, osmileté studium se zaměřením na živé jazyky – krátký název z dat 2026 a popis zaměření z dat 2025 se týkají jednoho oboru.","applicable_period":"přijímací řízení pro školní rok 2026/2027"},{"url":"https://www.kamdoskoly.cz/skola/gymnazium-gymnazium-christiana-dopplera-600005518.html","title":"Gymnázium Christiana Dopplera | kamdoskoly.cz","published_at":null,"checked_at":"2026-09-12","supports":"Kontinuita školy pod REDIZO 600005518 na adrese Zborovská 621/45; jazykový osmiletý obor (zaměření na živé jazyky, 30 míst) doložen průběžně pro roky 2024 i 2025 z otevřených dat CERMAT.","applicable_period":"2024–2026"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2025)","published_at":"2025-03-31","checked_at":"2026-09-12","supports":"Subjekt REDIZO 600005518 (Gymnázium Christiana Dopplera, IČ 61385701) je veden v rejstříku k 31. 3. 2025 se sídlem Zborovská 621/45, Malá Strana, Praha 5; IZO 061385701 (Střední škola) má místo výuky C51 na téže adrese – shoda s údaji v datech CERMAT 2025.","applicable_period":"stav rejstříku k 31. 3. 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":"2026-03-31","checked_at":"2026-09-12","supports":"Subjekt REDIZO 600005518 je veden v rejstříku k 31. 3. 2026 beze změny názvu i sídla; IZO 061385701 (Střední škola) má nadále místo výuky C51 Zborovská 621/45 – potvrzuje kontinuitu školy mezi přijímacími řízeními 2025 a 2026 (shodně i snímky k 31. 12. 2025 a 30. 6. 2026).","applicable_period":"stav rejstříku k 31. 3. 2026"}],"history_comparability":"comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":[]}]},"R-600005542":{"task_id":"R-600005542","queue_version":2,"processed_at":"2026-09-12","findings":[{"issue_ids":["Q0303","Q0304","Q0305"],"status":"potvrzeno","observations":["V datech CERMAT za rok 2025 (1. kolo JPZ, denní studium) vystupovala organizace REDIZO 600005542 pod názvem „Smíchovská SPŠ a gymnázium“ (IZO 061386855, Preslova 72, Praha 5) a nabízela pouze obory Informační technologie (dvě zaměření) a Gymnázium 79-41-K/41. V roce 2026 nese stejné REDIZO název „Smíchovská SPŠ, gymnázium a hotelová škola“ a vedle pokračujících oborů IT a Gymnázium nově nabízí Hotelnictví 65-42-M/01 (Q0303), Cestovní ruch 65-42-M/02 (Q0304) a Lyceum v režimu pokusného ověřování 78-42-M/08 (Q0305).","Ve frontě existuje zrcadlový úkol R-600005631: škola „Hotelová škola a Gymnázium Radlická“ (REDIZO 600005631, IZO 110011295, Radlická 591, Praha 5) v roce 2025 nabízela právě Hotelnictví 65-42-M/01, Cestovní ruch 65-42-M/02, Lyceum 78-42-M/08 se zaměřením „sportovní management“ a Gymnázium 79-41-K/41, a v roce 2026 pod tímto REDIZO žádnou nabídku nemá. Tři „nepřiřazené“ nabídky roku 2026 u Smíchovské tak přesně odpovídají oborům zanikající Radlické školy.","Podle Wikipedie (odkazující na usnesení Zastupitelstva hl. m. Prahy č. 28/39 ze dne 20. 11. 2025) došlo 1. 1. 2026 ke sloučení: původní právní subjekt Hotelové školy a Gymnázia Radlická zanikl a majetek i činnost přešly na Smíchovskou SPŠ a gymnázium, která se přejmenovala na „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, příspěvková organizace“. Text usnesení se nepodařilo přímo načíst, ale sloučení nezávisle potvrzují další zdroje níže.","Ústřední věstník ČR, částka 8/2026, str. 26, obsahuje oznámení Hlavního města Prahy, že ke dni 1. 9. 2026 se organizace IČ 61386855 se sídlem Preslova 72/25 přejmenovává z „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, příspěvková organizace“ na „Smíchovská střední škola, příspěvková organizace“. Tím je doloženo, že v době přijímacího řízení pro rok 2026/2027 (které probíhalo na jaře 2026) již sloučená organizace pod jedním IČ/REDIZO existovala a nesla v názvu „hotelová škola Radlická“.","Oficiální kritéria přijímacího řízení školy pro rok 2026/2027 (stránka ssps.cz, načtená z archivu, protože živý web byl 12. 9. 2026 nedostupný) nabízejí všech šest oborů: Gymnázium (4 třídy), IT–Informační technologie (3 třídy), IT–Kybernetická bezpečnost (1 třída), Hotelnictví (2 třídy), Cestovní ruch (1 třída) a Všeobecné lyceum se zaměřením na sportovní management (1 třída, kód 78-42-M/08). Škola výslovně uvádí, že výuka oborů Hotelnictví a Cestovní ruch bude probíhat převážně v areálu Radlice (adresa Radlická 591, tj. bývalá budova zaniklé školy), obory IT v areálu Smíchov (Preslova 72/25) a Gymnázium a Lyceum se mezi areály střídají.","Pozorovaná drobná odchylka v zápisu: u Lycea má nabídka 2025 (Radlická) vyplněné zaměření „sportovní management“, zatímco nabídka 2026 (Smíchovská) má pole zaměření prázdné; škola ale obor v kritériích 2026/2027 prezentuje jako „Všeobecné lyceum se zaměřením na sportovní management“, jde tedy o tentýž obor 78-42-M/08 s pokračujícím profilem.","Sídlo organizace (Preslova 72/25) se sloučením nezměnilo; adresa Radlická 591 se stala dalším místem výuky, nikoli sídlem. Rozdíl v adrese nabídek tedy není adresní změnou školy, ale důsledkem sloučení dvou subjektů na dvou areálech.","Rejstřík MŠMT (otevřená data, snímky k 31. 3. 2025, 31. 12. 2025, 31. 3. 2026 a 30. 6. 2026) vede REDIZO 600005542 (IČ 61386855) ve všech čtyřech snímcích se sídlem Preslova 72/25, Smíchov beze změny. Mezi snímkem k 31. 12. 2025 a 31. 3. 2026 se úplný název změnil z „Smíchovská střední průmyslová škola a gymnázium“ na „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, příspěvková organizace“, což přesně odpovídá sloučení k 1. 1. 2026; k 30. 6. 2026 nese subjekt stále tento název, v souladu s tím, že přejmenování na „Smíchovská střední škola, p.o.“ je účinné až od 1. 9. 2026.","Rejstřík dále dokládá přesun pracovišť: IZO 061386855 má ve snímcích k 31. 3. 2026 a 30. 6. 2026 nově místa výuky Radlická 591/115 a Na Vidouli 496/9 (obě Jinonice), která byla v roce 2025 místy výuky IZO 110011295 Hotelové školy a Gymnázia Radlická; současně se u subjektu objevila školní jídelna IZO 250013223 na adrese Radlická 591/115. Zanikající REDIZO 600005631 je v rejstříku vedeno i ve snímku k 30. 6. 2026 (zánik se v rejstříku projevuje s odstupem), avšak jeho střední škola IZO 110011295 již v tomto snímku uvedena není – zůstává pouze školní jídelna IZO 181076683.","Místo výuky Na Vidouli 496/9 se v původních podkladech (nabídky CERMAT ani kritéria školy) nevyskytovalo; rejstřík je vede u Radlické školy již v roce 2025 a po sloučení je převzala sloučená škola. Na závěry o návaznosti oborů to nemá vliv, jde o doplňující poznatek k areálům."],"conclusion":"Tři nepřiřazené nabídky roku 2026 (Hotelnictví 65-42-M/01, Cestovní ruch 65-42-M/02, Lyceum 78-42-M/08) nejsou nově otevřené obory Smíchovské SPŠ, ale pokračování oborů Hotelové školy a Gymnázia Radlická (REDIZO 600005631) po jejím sloučení do Smíchovské školy k 1. 1. 2026. Správná návaznost je proto na úrovni oborů: 2026/600005542 ← 2025/600005631 pro tytéž kódy KKOV; gymnaziální nabídka 2026 pod REDIZO 600005542 zároveň slučuje gymnázia obou původních škol. Změna názvu školy v datech (z „Smíchovská SPŠ a gymnázium“ na „Smíchovská SPŠ, gymnázium a hotelová škola“) je pouhým konstatováním sloučení a souvisejících přejmenování, nikoli vznik nové školy – REDIZO 600005542, IZO 061386855 a IČ 61386855 pokračují beze změny.","alternative_explanations":["Teoreticky by škola mohla Hotelnictví, Cestovní ruch a Lyceum otevřít jako zcela nové obory a obory Radlické školy zrušit; tomu odporuje umístění výuky do areálu Radlice (Radlická 591) v oficiálních kritériích 2026/2027, shoda kódů KKOV i zaměření Lycea a doložené právní sloučení subjektů.","U Lycea 78-42-M/08 nelze z dat CERMAT samých poznat, zda prázdné pole zaměření v roce 2026 znamená záměrné zrušení zaměření, nebo jen jiný způsob zápisu; škola však zaměření „sportovní management“ pro rok 2026/2027 nadále uvádí, takže jde spíše o změnu zápisu."],"relationship":{"type":"merge","from":["REDIZO 600005631 (Hotelová škola a Gymnázium Radlická, Radlická 591, Praha 5) – obory 2025: 65-42-M/01 Hotelnictví, 65-42-M/02 Cestovní ruch, 78-42-M/08 Lyceum (sportovní management), 79-41-K/41 Gymnázium","REDIZO 600005542 (Smíchovská SPŠ a gymnázium, Preslova 72, Praha 5) – obory 2025: 18-20-M/01 IT (2 zaměření), 79-41-K/41 Gymnázium"],"to":["REDIZO 600005542 (Smíchovská SPŠ, gymnázium a hotelová škola, Preslova 72, Praha 5) – obory 2026: 18-20-M/01 IT (2 zaměření), 79-41-K/41 Gymnázium, 65-42-M/01 Hotelnictví, 65-42-M/02 Cestovní ruch, 78-42-M/08 Lyceum"]},"addresses":[{"text":"Preslova 72/25, Smíchov, 150 00 Praha 5","role":"sídlo","izo":"izo_061386855","valid_period":"2025 i 2026 (beze změny); po 1. 9. 2026 pod názvem Smíchovská střední škola, p.o.","source_url":"https://msp.gov.cz/documents/d/msp/uv-cr_8-2026-pdf"},{"text":"Preslova 72/25, Praha 5 – areál Smíchov","role":"místo výuky","izo":"izo_061386855","valid_period":"2025 i 2026; v 2026/2027 převážně obory IT, střídavě Gymnázium a Lyceum","source_url":"https://web.archive.org/web/2026/https://ssps.cz/skola/pro-uchazece/prijimaci-rizeni/"},{"text":"Radlická 591, 158 00 Praha 5 – areál Radlice","role":"místo výuky","izo":"izo_110011295 (2025, zanikající subjekt); od 1. 1. 2026 pracoviště REDIZO 600005542","valid_period":"do 31. 12. 2025 sídlo Hotelové školy a Gymnázia Radlická; od 2026/2027 místo výuky oborů Hotelnictví a Cestovní ruch sloučené školy","source_url":"https://web.archive.org/web/2026/https://ssps.cz/skola/pro-uchazece/prijimaci-rizeni/"},{"text":"Preslova 72/25, Smíchov, 150 00 Praha 5 (RÚIAN 22075062)","role":"sídlo (dle rejstříku MŠMT)","izo":"izo_061386855","valid_period":"ve všech snímcích rejstříku 31. 3. 2025 – 30. 6. 2026 beze změny","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld"},{"text":"Radlická 591/115, Jinonice, 158 00 Praha 5 (RÚIAN 22706941)","role":"místo výuky (dle rejstříku MŠMT); do sloučení sídlo REDIZO 600005631","izo":"izo_061386855","valid_period":"do snímku k 31. 12. 2025 sídlo a místo výuky Hotelové školy a Gymnázia Radlická (IZO 110011295); od snímku k 31. 3. 2026 místo výuky IZO 061386855 sloučené školy","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"},{"text":"Na Vidouli 496/9, Jinonice, 158 00 Praha 5 (RÚIAN 22016708)","role":"místo výuky (dle rejstříku MŠMT)","izo":"izo_061386855","valid_period":"do snímku k 31. 12. 2025 místo výuky IZO 110011295 (Radlická); od snímku k 31. 3. 2026 místo výuky IZO 061386855 sloučené školy","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005542","title":"Rešeršní fronta – kontextové nabídky REDIZO 600005542 a 600005631, roky 2025/2026","published_at":null,"checked_at":"2026-09-12","supports":"V roce 2025 nabízela REDIZO 600005542 jen IT a Gymnázium; tři nové nabídky 2026 (Hotelnictví, Cestovní ruch, Lyceum) přesně odpovídají nabídkám REDIZO 600005631 z roku 2025, které v roce 2026 žádné nabídky nemá.","applicable_period":"přijímací řízení 2025 a 2026 (1. kolo JPZ, denní studium)"},{"url":"https://web.archive.org/web/2026/https://ssps.cz/skola/pro-uchazece/prijimaci-rizeni/","title":"Přijímací řízení – Smíchovská střední (ssps.cz, archivovaná kopie; živý web ssps.cz byl 12. 9. 2026 nedostupný – connection refused)","published_at":null,"checked_at":"2026-09-12","supports":"Kritéria přijímacího řízení 2026/2027 sloučené školy: všech šest oborů včetně Hotelnictví (2 třídy), Cestovního ruchu (1 třída) a Všeobecného lycea se zaměřením na sportovní management (78-42-M/08); výuka Hotelnictví a Cestovního ruchu převážně v areálu Radlice (Radlická 591), IT v areálu Smíchov (Preslova 72/25).","applicable_period":"přijímací řízení pro školní rok 2026/2027"},{"url":"https://msp.gov.cz/documents/d/msp/uv-cr_8-2026-pdf","title":"Ústřední věstník ČR, částka 8/2026, str. 26 – Oznámení Hlavního města Prahy o změně u příspěvkové organizace","published_at":"2026-07-01","checked_at":"2026-09-12","supports":"Ke dni 1. 9. 2026 se organizace IČ 61386855, sídlo Preslova 72/25, přejmenovává z „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, p.o.“ na „Smíchovská střední škola, p.o.“ – dokládá, že sloučená organizace existovala pod jedním IČ již v průběhu roku 2026.","applicable_period":"stav k 1. 9. 2026 (název platný v přijímacím řízení 2026/2027)"},{"url":"https://cs.wikipedia.org/wiki/Sm%C3%ADchovsk%C3%A1_st%C5%99edn%C3%AD_%C5%A1kola","title":"Smíchovská střední škola – Wikipedie (sekce Spojení s Hotelovou školou Radlická)","published_at":null,"checked_at":"2026-09-12","supports":"Sekundární zdroj: 1. 1. 2026 sloučení s Hotelovou školou a gymnáziem Radlická (původní subjekt zanikl, majetek a činnost přešly na SSPŠ) na základě usnesení Zastupitelstva HMP č. 28/39 ze dne 20. 11. 2025; přejmenování na „…hotelová škola Radlická“ a od 1. 9. 2026 na „Smíchovská střední škola, p.o.“ Text usnesení se nepodařilo přímo načíst (praha.eu vrací 404), datum sloučení proto stojí na tomto sekundárním zdroji.","applicable_period":"2025–2026"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-12-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 12. 2025)","published_at":"2025-12-31","checked_at":"2026-09-12","supports":"Stav před sloučením: REDIZO 600005542 vedeno jako „Smíchovská střední průmyslová škola a gymnázium“ (IČ 61386855, sídlo Preslova 72/25, IZO 061386855 s jediným místem výuky Preslova 72/25); samostatně vedeno REDIZO 600005631 „Hotelová škola a Gymnázium Radlická“ (IČ 60446242, sídlo Radlická 591/115, IZO 110011295 s místy výuky Radlická 591/115 a Na Vidouli 496/9).","applicable_period":"stav rejstříku k 31. 12. 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":"2026-03-31","checked_at":"2026-09-12","supports":"Stav po sloučení v době 1. kola JPZ 2026: tentýž subjekt (REDIZO 600005542, IČ 61386855, sídlo Preslova 72/25) nese název „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, příspěvková organizace“; IZO 061386855 převzala místa výuky Radlická 591/115 a Na Vidouli 496/9 (dříve IZO 110011295 Radlické školy) a u subjektu nově figuruje školní jídelna IZO 250013223 (Radlická 591/115).","applicable_period":"stav rejstříku k 31. 3. 2026 (období 1. kola JPZ 2026)"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 30. 6. 2026)","published_at":"2026-06-30","checked_at":"2026-09-12","supports":"Zanikající REDIZO 600005631 je v rejstříku vedeno i po sloučení (zánik se projevuje s odstupem), ale jeho střední škola IZO 110011295 ve snímku již není – zůstává pouze školní jídelna IZO 181076683. Sloučená škola nese dosud název „…gymnázium a hotelová škola Radlická, p.o.“, v souladu s účinností přejmenování na „Smíchovská střední škola, p.o.“ až od 1. 9. 2026.","applicable_period":"stav rejstříku k 30. 6. 2026"}],"history_comparability":"partially","recommended_action":"approve_mapping","related_task_ids":["R-600005631"],"unanswered_questions":["Přesné datum právního sloučení (1. 1. 2026) je doloženo jen sekundárním zdrojem (Wikipedie citující usnesení Zastupitelstva HMP č. 28/39 ze 20. 11. 2025); text usnesení se nepodařilo přímo načíst. Rejstřík MŠMT sloučení nezávisle potvrzuje (mezi snímky k 31. 12. 2025 a 31. 3. 2026 došlo k přejmenování subjektu a převzetí pracovišť Radlice), ale přesné datum účinnosti z něj neplyne.","Historické statistiky přijímacího řízení 2025 pro Hotelnictví, Cestovní ruch a Lyceum se vztahují k samostatné Radlické škole s vlastními kritérii; po sloučení platí pro rok 2026/2027 nová kritéria sloučené školy (u Lycea školní testy a pohovor s cut-off 40 bodů, u Hotelnictví a Cestovního ruchu pouze JPZ s minimem 15 bodů), takže srovnatelnost výsledků je jen částečná a měla by být prezentována s poznámkou o změně organizace i kritérií."]}],"registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Snímky rejstříku MŠMT plně potvrzují závěr o sloučení: REDIZO 600005542 (IČ 61386855, sídlo Preslova 72/25) je vedeno ve všech čtyřech snímcích a mezi 31. 12. 2025 a 31. 3. 2026 se přejmenovalo na „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, p.o.“ a jeho IZO 061386855 převzala pracoviště Radlická 591/115 i Na Vidouli 496/9, dříve místa výuky Radlické školy. Zanikající REDIZO 600005631 je vedeno i k 30. 6. 2026 (odstup zániku v rejstříku), ale jeho střední škola IZO 110011295 v tomto snímku již není, což odpovídá zpracovávanému zániku. Absence rejstříku v původním nálezu nezpůsobila chybu ani rozpor, pouze sníženou jistotu u právního data sloučení a historie IZO pracovišť; obojí je nyní potvrzeno, přesné datum 1. 1. 2026 nadále stojí na sekundárním zdroji."}},"R-600005631":{"task_id":"R-600005631","queue_version":2,"processed_at":"2026-09-12","findings":[{"issue_ids":["Q0187"],"status":"potvrzeno","observations":["V datech 1. kola jednotné přijímací zkoušky (CERMAT) pro školní rok 2025/2026 škola Hotelová škola a Gymnázium Radlická (REDIZO 600005631, IZO 110011295, Radlická 591, Praha 5) nabízela čtyři čtyřleté denní obory. V datech pro rok 2026 (přijímací řízení na školní rok 2026/2027) pod tímto REDIZO není žádná nabídka.","Článek PrahaIN.cz z 18. 11. 2025 popisuje, že zaměstnanci, žáci a rodiče se 20. 10. 2025 dozvěděli o záměru sloučit školu se Smíchovskou střední průmyslovou školou a gymnáziem; mluvčí Magistrátu hl. m. Prahy Vít Hofman potvrdil, že město činí kroky ke schválení sloučení k 1. 1. 2026, přičemž výuka má pokračovat za stávajících podmínek, v oborech, do kterých byli žáci přijati, a v prostředí, na které jsou žáci zvyklí (tedy i v budově Radlická 591).","Podle Wikipedie (s odkazem na usnesení Zastupitelstva hl. m. Prahy č. 28/39 ze dne 20. 11. 2025 a na Ústřední věstník ČR) k 1. 1. 2026 došlo ke sloučení: právnická osoba Hotelová škola a Gymnázium Radlická zanikla a veškerý majetek a činnost přešly na Smíchovskou střední průmyslovou školu a gymnázium (REDIZO 600005542, IZO 061386855, sídlo Preslova 72/25, Praha 5), která se přejmenovala na „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, příspěvková organizace“. K 1. 9. 2026 se škola přejmenovala na „Smíchovská střední škola, příspěvková organizace“.","Projektová data CERMAT za rok 2026 (public/cermat_results_2026.json) to potvrzují datově: pod REDIZO 600005631 není žádná nabídka, zatímco nástupnická škola REDIZO 600005542 v roce 2026 nabízí mimo své původní obory (Informační technologie, Gymnázium) nově také Hotelnictví (65-42-M/01), Cestovní ruch (65-42-M/02) a Lyceum (78-42-M/08) – tedy obory dříve nabízené Radlickou školou.","Agregátor infoabsolvent.cz dosud (k datu kontroly) uvádí pod starým REDIZO 600005631 vzdělávací nabídku pro školní rok 2026/2027 (gymnázium, hotelnictví, cestovní ruch, sportovní management; přihlášky do 20. 2. 2026). Jde o neaktuální agregovaný údaj – právnická osoba k 31. 12. 2025 zanikla a přijímací řízení 2026 reálně vyhlašovala nástupnická škola.","Rejstřík škol a školských zařízení MŠMT (otevřená data, datované snímky) vede subjekt REDIZO 600005631 (IČ 60446242) ve snímcích k 31. 3. 2025, 31. 12. 2025 i 31. 3. 2026 stále pod názvem „Hotelová škola a Gymnázium Radlická“ se sídlem Radlická 591/115, Praha 5 – Jinonice; zánik právnické osoby k 1. 1. 2026 se tak v rejstříku projevil až s odstupem.","Ve snímku rejstříku k 30. 6. 2026 je subjekt 600005631 veden již bez IZO 110011295 (střední škola) – zbývá pouze školní jídelna (IZO 181076683). Zánik vzdělávací činnosti pod tímto IZO tedy rejstřík eviduje mezi 31. 3. a 30. 6. 2026, tedy s odstupem po právním sloučení k 1. 1. 2026.","Nástupnická škola REDIZO 600005542 je ve snímku rejstříku k 31. 3. 2026 vedena pod názvem „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, příspěvková organizace“ – přesně shodně s údajem z Wikipedie; ve snímku k 30. 6. 2026 nese tento název dosud (ohlášené přejmenování na „Smíchovská střední škola“ k 1. 9. 2026 leží po datu snímku). IZO 061386855 nástupce má v obou snímcích 2026 vedle sídla Preslova 72/25 nově místa výuky Radlická 591/115 a Na Vidouli 496/9, čímž rejstřík potvrzuje pokračování výuky v budově Radlické školy pod nástupcem.","Rejstřík navíc ukazuje, že IZO 110011295 mělo již před sloučením (snímky 2025 i 31. 3. 2026) dvě místa výuky: Radlická 591/115 a Na Vidouli 496/9, obě v Jinonicích; obě po sloučení přešla pod IZO 061386855 nástupnické školy."],"conclusion":"Hotelová škola a Gymnázium Radlická (REDIZO 600005631) zanikla k 31. 12. 2025 sloučením do Smíchovské střední průmyslové školy a gymnázia (REDIZO 600005542), která od 1. 1. 2026 nesla název „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická“ a od 1. 9. 2026 název „Smíchovská střední škola“. Prázdná nabídka REDIZO 600005631 v roce 2026 tedy není zánik vzdělávací činnosti, ale přechod pod nástupnické REDIZO 600005542; výuka pokračuje i v budově Radlická 591.","alternative_explanations":["Teoreticky by absence nabídky 2026 mohla znamenat pouze neúčast v 1. kole JPZ; to však vylučuje doložené sloučení právnických osob k 1. 1. 2026 a fakt, že nástupce v roce 2026 nabízí shodné obory.","Přesný rozsah, v němž budova Radlická 591 slouží po sloučení jako místo výuky jednotlivých oborů (vs. přesun části výuky do Preslovy), z dohledaných zdrojů zcela nevyplývá; mluvčí magistrátu v listopadu 2025 avizoval zachování stávajícího prostředí výuky."],"relationship":{"type":"merge","from":["REDIZO 600005631 (IZO 110011295), Hotelová škola a Gymnázium Radlická"],"to":["REDIZO 600005542 (IZO 061386855), Smíchovská střední průmyslová škola a gymnázium → od 1. 1. 2026 Smíchovská SPŠ, gymnázium a hotelová škola Radlická → od 1. 9. 2026 Smíchovská střední škola"]},"addresses":[{"text":"Radlická 591/115, Praha 5 - Jinonice, 158 00","role":"sídlo","izo":"izo_110011295","valid_period":"do 31. 12. 2025 (zánik právnické osoby)","source_url":"https://www.prahain.cz/zivot-v-praze/zamestnanci-hotelove-skoly-v-praze-5-volaji-o-pomoc-25335.html"},{"text":"Radlická 591/115, Praha 5","role":"místo výuky","izo":"izo_110011295","valid_period":"do 31. 12. 2025; dle vyjádření magistrátu má výuka v budově pokračovat i po sloučení pod nástupnickou školou","source_url":"https://www.prahain.cz/zivot-v-praze/zamestnanci-hotelove-skoly-v-praze-5-volaji-o-pomoc-25335.html"},{"text":"Preslova 72/25, Praha 5 - Smíchov, 150 00","role":"sídlo","izo":"061386855","valid_period":"nástupnická škola, od 1. 1. 2026","source_url":"https://cs.wikipedia.org/wiki/Sm%C3%ADchovsk%C3%A1_st%C5%99edn%C3%AD_%C ol. rok 2026/2027 (neaktuální vůči právnímu stavu)"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2025)","published_at":null,"checked_at":"2026-09-12","supports":"Subjekt REDIZO 600005631 (IČ 60446242) veden jako „Hotelová škola a Gymnázium Radlická“, sídlo Radlická 591/115, Jinonice; IZO 110011295 s místy výuky Radlická 591/115 a Na Vidouli 496/9","applicable_period":"stav rejstříku k 31. 3. 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-12-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 12. 2025)","published_at":null,"checked_at":"2026-09-12","supports":"Stav bez změny: subjekt i IZO 110011295 vedeny pod původním názvem; nástupce 600005542 dosud jako „Smíchovská střední průmyslová škola a gymnázium“ s jediným místem výuky Preslova 72/25","applicable_period":"stav rejstříku k 31. 12. 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Nástupce 600005542 přejmenován na „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, příspěvková organizace“; jeho IZO 061386855 nově vede místa výuky Radlická 591/115 a Na Vidouli 496/9; zanikající subjekt 600005631 ještě veden (zánik s odstupem)","applicable_period":"stav rejstříku k 31. 3. 2026"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 30. 6. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Subjekt 600005631 veden již bez IZO 110011295 (zbývá jen školní jídelna); nástupce 600005542 nadále vede Radlickou 591/115 i Na Vidouli 496/9 jako místa výuky","applicable_period":"stav rejstříku k 30. 6. 2026"}],"history_comparability":"partially","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":["Rejstřík potvrzuje Radlickou 591/115 (a Na Vidouli 496/9) jako oficiální místa výuky nástupnické školy; rozdělení jednotlivých převzatých oborů mezi místa výuky (Radlická / Na Vidouli / Preslova) však rejstřík neeviduje."]},{"issue_ids":["Q0014","Q0015"],"status":"potvrzeno","observations":["V roce 2025 škola pod REDIZO 600005631 nabízela obory Hotelnictví (65-42-M/01) a Cestovní ruch (65-42-M/02), oba čtyřleté, denní forma.","V roce 2026 tyto dva obory se shodnými kódy KKOV nabízí nástupnická škola REDIZO 600005542 (v datech projektu pod názvem „Smíchovská SPŠ, gymnázium a hotelová škola“); Smíchovská škola tyto obory v roce 2025 ještě neměla, takže se nejedná o překryv s původní nabídkou nástupce.","Wikipedie uvádí Hotelnictví a Cestovní ruch mezi obory sloučené školy; web nástupnické školy ssps.cz inzeruje přijímací řízení pro školní rok 2026/2027. Agregátor infoabsolvent.cz uvádí pro 2026/2027 u hotelnictví a cestovního ruchu denní čtyřleté studium s poznámkou o praxi v reálném prostředí, což odpovídá profilu Radlické školy.","Mluvčí magistrátu v listopadu 2025 uvedl, že sloučením nedojde ke změně počtu žáků ani tříd a výuka bude pokračovat za stávajících podmínek; na besedě 21. 10. 2025 přitom zazněl záměr nového vedení počet tříd hotelnictví a cestovního ruchu zmenšit.","Rejstřík MŠMT kontext potvrzuje: ve snímku k 31. 3. 2026 nese nástupnická škola REDIZO 600005542 název „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, příspěvková organizace“ a její IZO 061386855 vede místo výuky Radlická 591/115 (i Na Vidouli 496/9), tedy provozovny původní Radlické školy."],"conclusion":"Obory Hotelnictví (65-42-M/01) a Cestovní ruch (65-42-M/02) nejsou nové nabídky ani zaniklé obory – po sloučení k 1. 1. 2026 pokračují pod nástupnickým REDIZO 600005542 se shodnými kódy KKOV. Nepřiřazení v roce 2026 způsobila změna právnického subjektu, nikoli změna oborové nabídky.","alternative_explanations":["Kód KKOV je shodný, ale školní vzdělávací program (ŠVP) mohl nástupce po sloučení upravit; případná změna ŠVP by snížila přímou srovnatelnost výsledků. Z dohledaných zdrojů však žádná změna obsahu oborů nevyplývá."],"relationship":{"type":"continuation","from":["600005631: 65-42-M/01 Hotelnictví","600005631: 65-42-M/02 Cestovní ruch"],"to":["600005542: 65-42-M/01 Hotelnictví","600005542: 65-42-M/02 Cestovní ruch"]},"addresses":[],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005631","title":"Přiložená data fronty – nabídky 2025 pod REDIZO 600005631","published_at":null,"checked_at":"2026-09-12","supports":"Zápis oborů 65-42-M/01 a 65-42-M/02 v roce 2025 pod REDIZO 600005631","applicable_period":"přijímací řízení 2025"},{"url":"public/cermat_results_2026.json (datový soubor projektu)","title":"Výsledky CERMAT 2026 – REDIZO 600005542","published_at":null,"checked_at":"2026-09-12","supports":"V roce 2026 nástupnická škola 600005542 nabízí 65-42-M/01 a 65-42-M/02; v roce 2025 je neměla (dle projektového souboru public/school_analysis.json)","applicable_period":"přijímací řízení 2025 a 2026"},{"url":"https://cs.wikipedia.org/wiki/Sm%C3%ADchovsk%C3%A1_st%C5%99edn%C3%AD_%C5%A1kola","title":"Smíchovská střední škola – Wikipedie","published_at":null,"checked_at":"2026-09-12","supports":"Hotelnictví a Cestovní ruch mezi obory sloučené školy; sloučení k 1. 1. 2026","applicable_period":"od 1. 1. 2026"},{"url":"https://www.prahain.cz/zivot-v-praze/zamestnanci-hotelove-skoly-v-praze-5-volaji-o-pomoc-25335.html","title":"Zaměstnanci hotelové školy v Praze 5 volají o pomoc (PrahaIN.cz)","published_at":"2025-11-18","checked_at":"2026-09-12","supports":"Kontinuita výuky v oborech, do nichž byli žáci přijati; avizovaný záměr zmenšit počet tříd hotelnictví a cestovního ruchu","applicable_period":"říjen–listopad 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Sloučení doložené v rejstříku: přejmenování nástupce 600005542 a převod míst výuky Radlická 591/115 a Na Vidouli 496/9 pod jeho IZO 061386855","applicable_period":"stav rejstříku k 31. 3. 2026"}],"history_comparability":"comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":[]},{"issue_ids":["Q0016"],"status":"potvrzeno","observations":["V roce 2025 škola pod REDIZO 600005631 nabízela obor Lyceum (režim pokusného ověřování), kód 78-42-M/08, se zaměřením „sportovní management“.","V roce 2026 nástupnická škola REDIZO 600005542 nabízí obor 78-42-M/08 Lyceum (režim pokusného ověřování). Smíchovská škola tento kód v roce 2025 neměla (její dřívější obor Technické lyceum 78-42-M/01 byl zrušen již v roce 2021 a nahrazen Gymnáziem), jde tedy o převzatý obor z Radlické školy.","Wikipedie uvádí mezi obory sloučené školy výslovně „Všeobecné lyceum se zaměřením na sportovní management“, což odpovídá zaměření z nabídky 2025.","Web nástupnické školy ssps.cz podle vyhledávacího úryvku vyhlásil 2. kolo přijímacího řízení pro školní rok 2026/2027 právě pro obor Lyceum (78-42-M/08) se 16 volnými místy; stránku se z této sítě nepodařilo přímo načíst, údaj proto beru jako doplňkový.","Rejstřík MŠMT ve snímku k 31. 3. 2026 dokládá přejmenování nástupce 600005542 na „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická“ a převod míst výuky Radlické školy pod jeho IZO 061386855, což je v soulasu s převzetím oboru Lyceum; rejstřík ale neeviduje jednotlivé obory, takže režim pokusného ověřování 78-42-M/08 z něj vyčíst nelze."],"conclusion":"Obor 78-42-M/08 Lyceum se zaměřením sportovní management pokračuje po sloučení k 1. 1. 2026 pod nástupnickým REDIZO 600005542. Není to nový obor nástupce ani zánik oboru – jde o přesun nabídky spolu s právnickou osobou. V datech 2026 není zaměření u kódu explicitně vyplněno, ale nezávislé zdroje zaměření na sportovní management potvrzují.","alternative_explanations":["Pokusné ověřování oboru Lyceum má časově omezenou platnost stanovenou MŠMT; z dohledaných zdrojů nevyplývá, zda bylo ověřování na této škole prodlouženo, případně zda obor přešel do řádného režimu. Nabídka 2026 pod nástupcem ale osud oboru v roce 2026 vysvětluje."],"relationship":{"type":"continuation","from":["600005631: 78-42-M/08 Lyceum (sportovní management)"],"to":["600005542: 78-42-M/08 Lyceum (Všeobecné lyceum se zaměřením na sportovní management)"]},"addresses":[],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005631","title":"Přiložená data fronty – nabídka 2025","published_at":null,"checked_at":"2026-09-12","supports":"Zápis oboru 78-42-M/08 se zaměřením sportovní management v roce 2025 pod REDIZO 600005631","applicable_period":"přijímací řízení 2025"},{"url":"public/cermat_results_2026.json (datový soubor projektu)","title":"Výsledky CERMAT 2026 – REDIZO 600005542","published_at":null,"checked_at":"2026-09-12","supports":"Obor 78-42-M/08 v nabídce nástupnické školy v roce 2026","applicable_period":"přijímací řízení 2026"},{"url":"https://cs.wikipedia.org/wiki/Sm%C3%ADchovsk%C3%A1_st%C5%99edn%C3%AD_%C5%A1kola","title":"Smíchovská střední škola – Wikipedie","published_at":null,"checked_at":"2026-09-12","supports":"Obor „Všeobecné lyceum se zaměřením na sportovní management“ v nabídce sloučené školy; historie oborů Smíchovské školy (Technické lyceum zrušeno 2021)","applicable_period":"od 1. 1. 2026"},{"url":"https://ssps.cz/skola/pro-uchazece/prijimaci-rizeni/","title":"Přijímací řízení – Smíchovská střední (ssps.cz)","published_at":null,"checked_at":"2026-09-12","supports":"2. kolo přijímacího řízení 2026/2027 pro obor Lyceum 78-42-M/08 (16 volných míst) – pouze z vyhledávacího úryvku, stránku se nepodařilo načíst (síťová chyba), údaj proto není plně ověřen","applicable_period":"přijímací řízení 2026"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Přejmenování nástupce 600005542 a převod míst výuky Radlická 591/115 a Na Vidouli 496/9 v rejstříku – právní rámec převzetí oboru 78-42-M/08","applicable_period":"stav rejstříku k 31. 3. 2026"}],"history_comparability":"comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":["Zda MŠMT po sloučení prodloužilo režim pokusného ověřování oboru 78-42-M/08 u nástupnické školy."]},{"issue_ids":["Q0017"],"status":"potvrzeno","observations":["V roce 2025 škola pod REDIZO 600005631 nabízela čtyřleté Gymnázium (79-41-K/41).","Nástupnická škola REDIZO 600005542 nabízí 79-41-K/41 Gymnázium i v roce 2026 – na rozdíl od hotelových oborů však měla vlastní gymnázium již v roce 2025 (Smíchovská SPŠ a gymnázium, Preslova; gymnázium zavedla v roce 2021 místo technického lycea).","Po sloučení k 1. 1. 2026 tedy v nabídce nástupce 2026 působí gymnázium vzniklé spojením dvou dosud samostatných gymnaziálních nabídek – původní smíchovské (Preslova) a radlické (Radlická 591). Wikipedie uvádí u sloučené školy čtyři třídy gymnázia v každém ročníku.","Mluvčí magistrátu před sloučením avizoval, že výuka bude pokračovat v oborech, do nichž byli žáci přijati, a v prostředí, na které jsou zvyklí – radličtí gymnazisté tedy měli pokračovat na Radlické.","Rejstřík MŠMT ve snímku k 31. 3. 2026 (i 30. 6. 2026) vede u nástupce 600005542 současně místa výuky Preslova 72/25 a Radlická 591/115 (a Na Vidouli 496/9); radlické gymnázium tedy mohlo po sloučení pokračovat jako samostatné pracoviště, což podporuje alternativní vysvětlení o odděleném vedení – data CERMAT 2026 jsou však vedena souhrnně za celé REDIZO."],"conclusion":"Gymnázium Radlické školy (79-41-K/41) zaniklo jako nabídka samostatné právnické osoby a od 1. 1. 2026 pokračuje v rámci gymnázia nástupnické školy REDIZO 600005542. Protože nástupce měl vlastní gymnázium již před sloučením, nelze statistiky radlického gymnázia z roku 2025 mechanicky přenášet na celou gymnaziální nabídku nástupce v roce 2026 – ta kombinuje obě kohorty.","alternative_explanations":["Není vyloučeno, že radlické gymnázium bylo po sloučení vedeno jako oddělené třídy/pracoviště s vlastní statistikou; z dostupných dat CERMAT 2026 však vystupuje jako jedna společná nabídka 79-41-K/41 pod REDIZO 600005542."],"relationship":{"type":"merge","from":["600005631: 79-41-K/41 Gymnázium (Radlická)","600005542: 79-41-K/41 Gymnázium (Preslova, před sloučením)"],"to":["600005542: 79-41-K/41 Gymnázium (společná nabídka od 1. 1. 2026)"]},"addresses":[],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005631","title":"Přiložená data fronty – nabídka 2025","published_at":null,"checked_at":"2026-09-12","supports":"Zápis oboru 79-41-K/41 Gymnázium v roce 2025 pod REDIZO 600005631","applicable_period":"přijímací řízení 2025"},{"url":"public/school_analysis.json (datový soubor projektu)","title":"Nabídka REDIZO 600005542 v roce 2025","published_at":null,"checked_at":"2026-09-12","supports":"Smíchovská SPŠ a gymnázium (600005542) měla v roce 2025 vlastní obory 18-20-M/01 a 79-41-K/41 na adrese Preslova 72, zatímco hotelové obory a lyceum nabízela až po sloučení","applicable_period":"přijímací řízení 2025"},{"url":"public/cermat_results_2026.json (datový soubor projektu)","title":"Výsledky CERMAT 2026 – REDIZO 600005542","published_at":null,"checked_at":"2026-09-12","supports":"Jedna společná nabídka gymnázia 79-41-K/41 pod REDIZO 600005542 v roce 2026","applicable_period":"přijímací řízení 2026"},{"url":"https://cs.wikipedia.org/wiki/Sm%C3%ADchovsk%C3%A1_st%C5%99edn%C3%AD_%C5%A1kola","title":"Smíchovská střední škola – Wikipedie","published_at":null,"checked_at":"2026-09-12","supports":"Gymnázium zavedeno na Smíchovské škole v roce 2021; po sloučení čtyři třídy gymnázia v ročníku; sloučení s Radlickou školou k 1. 1. 2026","applicable_period":"2021 – současnost"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Nástupce 600005542 vede po sloučení dvě (resp. tři) místa výuky – Preslova 72/25, Radlická 591/115 a Na Vidouli 496/9","applicable_period":"stav rejstříku k 31. 3. 2026"}],"history_comparability":"partially","recommended_action":"manual_review","related_task_ids":[],"unanswered_questions":["Zda jsou po sloučení výsledky přijímacího řízení gymnázia vedeny odděleně za pracoviště Radlická a Preslova, nebo pouze souhrnně za REDIZO 600005542."]}],"registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT původní závěry potvrdil: nástupnická škola 600005542 je ve snímku k 31. 3. 2026 vedena pod názvem „Smíchovská střední průmyslová škola, gymnázium a hotelová škola Radlická, příspěvková organizace“ a převzala místa výuky Radlická 591/115 a Na Vidouli 496/9, zatímco zanikající subjekt 600005631 zůstal v rejstříku s odstupem až do snímku 30. 6. 2026 (tehdy již bez IZO střední školy). Absence rejstříku v původním nálezu nezpůsobila chybu – sloučení k 1. 1. 2026 bylo správně doloženo z jiných zdrojů – pouze snížila jistotu u data výmazu a u statusu budovy Radlická 591, které rejstřík nyní vyřešil. Novým poznatkem je druhé místo výuky Radlické školy Na Vidouli 496/9, o němž původní nález nevěděl."}},"R-600005658":{"task_id":"R-600005658","queue_version":2,"processed_at":"2026-09-12","registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT potvrdil hlavní závěr o pokračování školy: subjekt REDIZO 600005658 i zařízení IZO 110001885 jsou vedeny ve všech čtyřech snímcích (31. 3. 2025 až 30. 6. 2026) pod stejným názvem, sídlem Plzeňská 298/217, Motol a shodnými místy výuky, a obor Aranžér je v nich označen jako dobíhající. Rejstřík zároveň ukázal, že obory Provozní technika a Propagace zůstávají k 30. 6. 2026 formálně registrované (nikoli dobíhající) a obor Technické lyceum dosud registrován není – rejstřík zachycuje registraci oborů, nikoli jejich nabídku v přijímacím řízení, a změny se v něm projevují s odstupem, takže závěry o nabídce nevyvrací. Absence rejstříku v původním nálezu nezpůsobila chybu, pouze sníženou jistotu u pokračování subjektu a dobíhání oboru Aranžér, které rejstřík nyní potvrdil."},"findings":[{"issue_ids":["Q0018","Q0019"],"status":"potvrzeno","observations":["V datech CERMAT z 1. kola přijímacího řízení 2025 (denní studium) škola Střední průmyslová škola dopravní, a.s. (REDIZO 600005658, IZO 110001885, Plzeňská 298, Praha) nabízela mimo jiné dvouleté nástavbové obory 23-43-L/51 Provozní technika a 66-42-L/51 Propagace (určený pouze pro absolventy oboru Aranžér). V datech 1. kola 2026 tyto dvě nabídky chybí; nástavbový obor Podnikání (64-41-L/51) pokračuje v obou letech.","Archivovaný přehled oborů na webu školy z 15. 11. 2025 ještě uvádí mezi nástavbovými obory Podnikání, Provozní techniku i Propagaci (stav pro přijímací řízení na školní rok 2026/2027 ještě nebyl zveřejněn).","Archivovaný přehled oborů z 23. 1. 2026 – tedy v době přijímacího řízení pro školní rok 2026/2027 – už mezi nástavbovými obory uvádí pouze Podnikání (denní a dálková forma); Provozní technika a Propagace z nabídky pro nové uchazeče zmizely. Totéž potvrzuje snímek webu z 7. 3. 2026.","Zánik nabídky neznamená zánik výuky: PDF školy z října 2025 s okruhy k praktické maturitní zkoušce pro školní rok 2025/2026 dokládá, že žáci oboru Provozní technika ve škole dále studují (obor dobíhá s ročníky přijatými dříve).","Výroční zpráva školy za školní rok 2024/2025 označuje učební obor 66-52-H/01 Aranžér jako „dobíhající obor“. Protože nástavba Propagace je určena výhradně absolventům Aranžéra, ztráta nabídky Propagace v roce 2026 s dobíháním Aranžéra logicky souvisí (zdroje však tuto souvislost přímo neuvádějí).","Samotná škola (REDIZO 600005658, IZO 110001885) mezi roky pokračuje beze změny názvu, adresy sídla i zřizovatele; ve výroční zprávě 2024/2025 jsou jako místa výuky zapsány Plzeňská 298/217a (Praha 5 – Motol, teoretická výuka), Plzeňská 1315/137 (Praha 5 – Košíře, odborný výcvik) a Moravská 965/3 (Praha 2 – Vinohrady, kde se vyučuje i nástavba Propagace).","Rejstřík MŠMT vede subjekt Střední průmyslová škola dopravní, a.s. (REDIZO 600005658, IČ 25632141) i zařízení IZO 110001885 ve všech čtyřech snímcích (31. 3. 2025, 31. 12. 2025, 31. 3. 2026 a 30. 6. 2026) pod stejným názvem a sídlem Plzeňská 298/217, Motol (výroční zpráva uvádí č. 298/217a – drobný rozdíl v zápisu čísla, nikoli jiná adresa); místa výuky jsou ve všech snímcích shodná a kromě sídla, Košíř a Vinohrad zahrnují i Sazečskou 3206/3 (Strašnice) a náměstí Hrdinů 725/13 (Nusle).","Obor Aranžér (66-52-H/01) je v rejstříku označen jako dobíhající již ve snímku k 31. 3. 2025, což potvrzuje údaj výroční zprávy o dobíhajícím oboru a podporuje souvislost se zánikem nabídky nástavby Propagace. Naproti tomu obory Provozní technika (23-43-L/51) a Propagace (66-42-L/51) jsou v rejstříku evidovány jako plně registrované (nikoli dobíhající) i ve snímku k 30. 6. 2026 – rejstřík zachycuje registraci oborů, nikoli jejich nabídku v přijímacím řízení, takže ukončení přijímání nových žáků nepotvrzuje ani nevyvrací; k formálnímu vyřazení těchto oborů z rejstříku k 30. 6. 2026 nedošlo."],"conclusion":"Škola pro školní rok 2026/2027 ukončila přijímání nových žáků do nástavbových oborů 23-43-L/51 Provozní technika a 66-42-L/51 Propagace (v přehledu oborů pro přijímací řízení 2026/2027 zůstává z nástavbových oborů pouze Podnikání). Obor Provozní technika přitom ve škole dobíhá s dříve přijatými ročníky – nejde o okamžitý zánik výuky, ale o ukončení nabídky pro nové uchazeče. Škola sama (REDIZO/IZO, název, sídlo) mezi roky 2025 a 2026 pokračuje beze změny.","alternative_explanations":["Nelze vyloučit, že škola přijímání do těchto nástavbových oborů jen přerušila (např. pro nízký zájem) a obnoví je v pozdějším roce; webové snímky popisují pouze nabídku pro rok 2026/2027.","Data fronty pokrývají pouze 1. kolo JPZ a denní studium; zdroje nevylučují, že byly tyto obory nabídnuty ve 2. kole 2026 nebo v jiné formě studia.","Rejstřík MŠMT eviduje obory Provozní technika a Propagace jako registrované (nikoli dobíhající) i ve snímku k 30. 6. 2026; škola tedy k tomuto datu nepodnikla formální kroky k vyřazení oborů z rejstříku, což odpovídá možnosti, že jejich nabídku pro nové uchazeče pouze dočasně pozastavila."],"relationship":{"type":"closed","from":["23-43-L/51 Provozní technika (2025)","66-42-L/51 Propagace (2025)"],"to":[]},"addresses":[{"text":"Plzeňská 298/217a, Praha 5 – Motol","role":"sídlo","izo":"izo_110001885","valid_period":"2024/2025–2026 (dle výroční zprávy a webu školy)","source_url":"https://www.sps-dopravni.cz/wp-content/uploads/2025/10/VZ_SPSD_24_25_final.pdf"},{"text":"Plzeňská 1315/137, Praha 5 – Košíře","role":"místo výuky","izo":"","valid_period":"školní rok 2024/2025 (odborný výcvik; ve výroční zprávě 2023/2024 uvedena i výuka oboru Provozní technika)","source_url":"https://www.sps-dopravni.cz/wp-content/uploads/2025/10/VZ_SPSD_24_25_final.pdf"},{"text":"Moravská 965/3, Praha 2 – Vinohrady","role":"místo výuky","izo":"","valid_period":"školní rok 2024/2025 (denní forma nástavby Propagace, obory Aranžér, Podnikání aj.)","source_url":"https://www.sps-dopravni.cz/wp-content/uploads/2025/10/VZ_SPSD_24_25_final.pdf"},{"text":"Sazečská 3206/3, Praha 10 – Strašnice","role":"místo výuky (dle rejstříku MŠMT)","izo":"izo_110001885","valid_period":"dle rejstříku ve všech snímcích 31. 3. 2025 až 30. 6. 2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld"},{"text":"náměstí Hrdinů 725/13, Praha 4 – Nusle","role":"místo výuky (dle rejstříku MŠMT)","izo":"izo_110001885","valid_period":"dle rejstříku ve všech snímcích 31. 3. 2025 až 30. 6. 2026","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005658","title":"Data CERMAT 1. kolo JPZ 2025 a 2026, denní studium (context_offers a issues Q0018, Q0019)","published_at":null,"checked_at":"2026-09-12","supports":"Nabídka oborů Provozní technika a Propagace v roce 2025 a jejich absence v roce 2026; shoda REDIZO/IZO, názvu a adresy školy v obou letech.","applicable_period":"přijímací řízení 2025 a 2026, 1. kolo, denní studium"},{"url":"https://web.archive.org/web/20251115122533/https://www.sps-dopravni.cz/pro-uchazece/seznam-oboru/","title":"Přehled oborů – web školy, archivní snímek z 15. 11. 2025","published_at":"2025-11-15","checked_at":"2026-09-12","supports":"Mezi nástavbovými obory jsou uvedeny Podnikání, Provozní technika i Propagace; Technické lyceum v nabídce není.","applicable_period":"podzim 2025 (před zveřejněním nabídky pro 2026/2027)"},{"url":"https://web.archive.org/web/20260123120119/https://www.sps-dopravni.cz/pro-uchazece/seznam-oboru/","title":"Přehled oborů – web školy, archivní snímek z 23. 1. 2026","published_at":"2026-01-23","checked_at":"2026-09-12","supports":"V sekci nástavbových oborů je uvedeno pouze Podnikání (denní a dálková forma); Provozní technika a Propagace již v nabídce pro nové uchazeče nejsou.","applicable_period":"přijímací řízení pro školní rok 2026/2027"},{"url":"https://web.archive.org/web/20260307210225/https://www.sps-dopravni.cz/pro-uchazece/seznam-oboru/78-42-m-01-technicke-lyceum/","title":"78-42-M/01 Technické lyceum – web školy, archivní snímek z 7. 3. 2026","published_at":"2026-03-07","checked_at":"2026-09-12","supports":"Menu přehledu oborů potvrzuje, že mezi nástavbovými obory je pouze Podnikání (a mezi čtyřletými maturitními nově Technické lyceum).","applicable_period":"přijímací řízení pro školní rok 2026/2027"},{"url":"https://www.sps-dopravni.cz/wp-content/uploads/2025/10/VZ_SPSD_24_25_final.pdf","title":"Výroční zpráva o činnosti školy SPŠ dopravní, a.s. za školní rok 2024/2025","published_at":"2025-10","checked_at":"2026-09-12","supports":"Učební obor Aranžér je označen jako dobíhající; nástavba Propagace se vyučuje v denní formě na Moravské 965/3; oba nástavbové obory (Provozní technika, Propagace) jsou v 24/25 vyučovány; místa výuky zapsaná v rejstříku.","applicable_period":"školní rok 2024/2025"},{"url":"https://www.sps-dopravni.cz/wp-content/uploads/2025/10/25_26_MZ_MOR-Provozni-technika-okruhy-temat-k-prakticke-MZ.pdf","title":"Praktická maturitní zkouška Provozní technika – okruhy témat, školní rok 2025/2026","published_at":"2025-10","checked_at":"2026-09-12","supports":"Žáci oboru 23-43-L/51 Provozní technika ve škole i ve školním roce 2025/2026 studují a připravují se na maturitní zkoušku – obor dobíhá, nezanikl okamžitě.","applicable_period":"školní rok 2025/2026"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2025)","published_at":"2025-03-31","checked_at":"2026-09-12","supports":"Subjekt REDIZO 600005658 i IZO 110001885 jsou vedeny v období 1. kola JPZ 2025; sídlo Plzeňská 298/217, Motol; obory Provozní technika a Propagace registrované, obor Aranžér označen jako dobíhající.","applicable_period":"stav rejstříku k 31. 3. 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2026)","published_at":"2026-03-31","checked_at":"2026-09-12","supports":"V období 1. kola JPZ 2026 subjekt, název, sídlo i místa výuky beze změny oproti roku 2025; skladba registrovaných oborů shodná se snímkem k 31. 3. 2025.","applicable_period":"stav rejstříku k 31. 3. 2026"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 30. 6. 2026)","published_at":"2026-06-30","checked_at":"2026-09-12","supports":"I po skončení školního roku 2025/2026 subjekt pokračuje beze změny názvu, sídla i míst výuky; Provozní technika a Propagace zůstávají registrované (nikoli dobíhající), obor Technické lyceum dosud evidován není.","applicable_period":"stav rejstříku k 30. 6. 2026"}],"history_comparability":"not_comparable","recommended_action":"record_only","related_task_ids":[],"unanswered_questions":["Zda škola přijímání do oborů Provozní technika a Propagace ukončila trvale, nebo jen pro rok 2026/2027, z dostupných datovaných zdrojů nevyplývá."]},{"issue_ids":["Q0338"],"status":"potvrzeno","observations":["V datech CERMAT z 1. kola 2026 se u školy Střední průmyslová škola dopravní, a.s. (REDIZO 600005658) objevuje nová nabídka čtyřletého maturitního oboru 78-42-M/01 Technické lyceum, která v datech 1. kola 2025 nebyla. Všechny ostatní čtyřleté obory školy (Informační technologie, Provoz a ekonomika dopravy, Mechanik elektrotechnik, Autotronik) v roce 2026 pokračují vedle ní – nejde o přejmenování ani náhradu jiného oboru.","Archivovaný přehled oborů na webu školy z 15. 11. 2025 Technické lyceum ještě neobsahuje (čtyřleté maturitní obory jsou jen Informační technologie a Provoz a ekonomika dopravy plus kombinované L+H obory).","Stránka oboru Technické lyceum je na webu školy doložena poprvé archivním snímkem ze 7. 3. 2026 a profil absolventa oboru (PDF) škola zveřejnila v únoru 2026 – tedy v době přijímacího řízení pro školní rok 2026/2027.","Výroční zpráva školy za školní rok 2024/2025 obor Technické lyceum nezmiňuje a za rok 2024/2025 uvádí ve skladbě oborů „beze změn“.","Rejstřík MŠMT vede školu (REDIZO 600005658, IZO 110001885) pod stejným názvem, sídlem Plzeňská 298/217, Motol a shodnými místy výuky ve snímku k 31. 3. 2025 i k 31. 3. 2026 a 30. 6. 2026 – novou nabídku tedy zařadil dosavadní subjekt, nikoli nová či sloučená škola. Obor 78-42-M/01 Technické lyceum však rejstřík ani ve snímku k 30. 6. 2026 mezi registrovanými obory školy neuvádí; registrace oboru se v rejstříku může projevit s odstupem (typicky před zahájením výuky k 1. 9. 2026), takže absence sama o sobě nabídce v přijímacím řízení neodporuje."],"conclusion":"Obor 78-42-M/01 Technické lyceum je nově otevřený čtyřletý maturitní obor, který škola zařadila do nabídky poprvé pro přijímací řízení na školní rok 2026/2027 (materiály k oboru zveřejnila v únoru–březnu 2026). Nemá proto žádného předchůdce v roce 2025 a historické statistiky na něj nelze přenášet z žádného jiného oboru školy.","alternative_explanations":["Zdroje nevylučují, že škola obor připravovala dříve a v roce 2025 ho nenabídla např. pro nedokončenou registraci; pro rok 2025 však žádná nabídka ani výuka doložena není.","Snímek rejstříku MŠMT k 30. 6. 2026 obor Technické lyceum mezi registrovanými obory školy dosud neeviduje; to je slučitelné s tím, že registrace proběhne až před zahájením výuky 1. 9. 2026, z rejstříku však zatím nelze potvrdit, že k ní skutečně došlo."],"relationship":{"type":"new_offer","from":[],"to":["78-42-M/01 Technické lyceum (2026)"]},"addresses":[{"text":"Plzeňská 298/217a, Praha 5 – Motol","role":"sídlo","izo":"izo_110001885","valid_period":"2025–2026","source_url":"https://web.archive.org/web/20260307210225/https://www.sps-dopravni.cz/pro-uchazece/seznam-oboru/78-42-m-01-technicke-lyceum/"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005658","title":"Data CERMAT 1. kolo JPZ 2025 a 2026, denní studium (context_offers a issue Q0338)","published_at":null,"checked_at":"2026-09-12","supports":"Nabídka oboru Technické lyceum pouze v roce 2026; pokračování všech ostatních čtyřletých oborů školy v obou letech.","applicable_period":"přijímací řízení 2025 a 2026, 1. kolo, denní studium"},{"url":"https://web.archive.org/web/20251115122533/https://www.sps-dopravni.cz/pro-uchazece/seznam-oboru/","title":"Přehled oborů – web školy, archivní snímek z 15. 11. 2025","published_at":"2025-11-15","checked_at":"2026-09-12","supports":"Technické lyceum v přehledu oborů školy dosud není uvedeno.","applicable_period":"podzim 2025"},{"url":"https://web.archive.org/web/20260307210225/https://www.sps-dopravni.cz/pro-uchazece/seznam-oboru/78-42-m-01-technicke-lyceum/","title":"78-42-M/01 Technické lyceum – web školy, archivní snímek z 7. 3. 2026","published_at":"2026-03-07","checked_at":"2026-09-12","supports":"Obor Technické lyceum je zařazen mezi čtyřleté obory s maturitou (stránka obsahuje odkazy na místo výuky, učební plán a kritéria přijetí).","applicable_period":"přijímací řízení pro školní rok 2026/2027"},{"url":"https://web.archive.org/web/20260418162623/https://www.sps-dopravni.cz/wp-content/uploads/2026/02/Technicke-lyceum_profil-absolventa.pdf","title":"Technické lyceum – profil absolventa (PDF, nahráno na web školy v únoru 2026)","published_at":"2026-02","checked_at":"2026-09-12","supports":"Škola připravila prezentační materiály k oboru Technické lyceum v únoru 2026, tedy těsně před 1. kolem přijímacího řízení 2026.","applicable_period":"přijímací řízení pro školní rok 2026/2027"},{"url":"https://www.sps-dopravni.cz/wp-content/uploads/2025/10/VZ_SPSD_24_25_final.pdf","title":"Výroční zpráva o činnosti školy SPŠ dopravní, a.s. za školní rok 2024/2025","published_at":"2025-10","checked_at":"2026-09-12","supports":"Za školní rok 2024/2025 škola uvádí ve skladbě oborů beze změn a Technické lyceum nezmiňuje – obor v té době ještě neexistoval v nabídce.","applicable_period":"školní rok 2024/2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/e9c07729-877e-4af0-be4a-9d36e45806ae/rssz-cela-cr-2025-03-31.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 31. 3. 2025)","published_at":"2025-03-31","checked_at":"2026-09-12","supports":"Skladba registrovaných oborů školy (22 oborů) k 31. 3. 2025 obor 78-42-M/01 Technické lyceum neobsahuje; subjekt veden pod shodným REDIZO/IZO, názvem a sídlem.","applicable_period":"stav rejstříku k 31. 3. 2025"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 30. 6. 2026)","published_at":"2026-06-30","checked_at":"2026-09-12","supports":"K 30. 6. 2026 subjekt pokračuje beze změny názvu, sídla i míst výuky; Technické lyceum mezi registrovanými obory dosud není – registrace se v rejstříku může projevit s odstupem.","applicable_period":"stav rejstříku k 30. 6. 2026"}],"history_comparability":"not_comparable","recommended_action":"approve_mapping","related_task_ids":[],"unanswered_questions":[]}]},"R-600005666":{"task_id":"R-600005666","queue_version":2,"processed_at":"2026-09-12","findings":[{"issue_ids":["Q0340"],"status":"potvrzeno","observations":["Jde o soukromou školu Gymnázium, střední odborná škola a Pražská taneční konzervatoř, s.r.o., REDIZO 600005666, se sídlem Laudova 1024/10, Praha 6 – Řepy. Identitu potvrzuje stránka školy 'Kdo jsme', která uvádí shodné REDIZO i IZO 110007701.","V datech CERMAT z 1. kola JPZ za rok 2025 škola nabízela tři denní obory: Obchodní akademii (63-41-M/02, bez uvedeného zaměření), Hotelnictví (65-42-M/01) a Kosmetické služby (69-41-L/01).","V roce 2026 jsou v datech čtyři nabídky: Obchodní akademie se zaměřením 'obchodní akademie', Obchodní akademie se zaměřením 'sportovní management' (obě pod týmž kódem KKOV 63-41-M/02, každá s vlastním ID nabídky), Hotelnictví a Kosmetické služby. Nepřiřazená nabídka z otázky Q0340 je právě Obchodní akademie – sportovní management.","Archivní snímek webu školy z 16. 5. 2025 (Wayback Machine) ukazuje, že pro školní rok 2025/2026 škola zveřejnila kritéria přijímacího řízení jen pro Obchodní akademii, Hotelnictví a Kosmetické služby; obor Sportovní management tehdy v nabídce ani v menu studijních oborů neexistoval.","Archivní snímek z 14. 12. 2025 již obsahuje Sportovní management v menu studijních oborů (příprava nabídky pro rok 2026/2027), zatímco obsah stránky přijímacího řízení ještě popisuje kolo 2025/2026.","Aktuální stránka přijímacího řízení školy uvádí pro školní rok 2026/2027 samostatná kritéria pro čtyři obory včetně 'Sportovní management 2026/2027'. Stránka oboru Sportovní management uvádí kód KKOV 63-41-M/02 a čtyřleté denní studium zakončené maturitou, tedy shodné parametry s nabídkou v datech 2026.","Na agregátoru SeznamŠkol.eu je u oboru Obchodní akademie této školy citováno vyjádření školy: 'V roce 2026/27 spouštíme nový projekt, Obchodní akademii se zaměřením na Sportovní management.'","Stránka oboru Sportovní management nemá ve Wayback Machine žádný archivní snímek (CDX dotaz vrátil prázdný výsledek), což je konzistentní s tím, že stránka vznikla až v souvislosti s novou nabídkou pro rok 2026/2027.","Rejstřík MŠMT vede subjekt Gymnázium, střední odborná škola a Pražská taneční konzervatoř, s.r.o. (REDIZO 600005666, IČ 25122690) ve všech čtyřech snímcích (31. 3. 2025, 31. 12. 2025, 31. 3. 2026, 30. 6. 2026) pod stejným REDIZO, názvem i sídlem Laudova 1024/10, Řepy; kontinuita právnické osoby mezi roky 2025 a 2026 je tak potvrzena.","Rejstřík vede pro IZO 110007701 (Střední škola) ve všech snímcích tři místa výuky: Laudova 1024/10, Řepy (C31), Za Poříčskou bránou 257/8, Karlín (C10) a Dykova 50/20, Vinohrady (C10). Adresa Laudova 1024 uvedená u nabídek v datech CERMAT odpovídá místu výuky Řepy i sídlu subjektu.","Rejstřík MŠMT vede u IZO 110007701 obor 63-41-M/02 Obchodní akademie (denní forma, čtyřleté studium) nepřetržitě od snímku k 31. 3. 2025 do snímku k 30. 6. 2026; otevřená data rejstříku zaměření oborů nerozlišují, takže nové zaměření sportovní management se v nich neprojevilo jako nový obor – to je konzistentní se závěrem, že jde o nové zaměření stávajícího zapsaného oboru, nikoli o nově zapsaný obor.","Mezi snímky k 31. 3. 2025 a 31. 12. 2025 rejstřík zaznamenal změny kapacit oborů u IZO 110007701: Obchodní akademie 170 → 200, Hotelnictví 160 → 110, Kosmetické služby 140 → 200; kapacita Gymnázia (79-41-K/41) zůstala 120."],"conclusion":"Nabídka Obchodní akademie – sportovní management (KKOV 63-41-M/02) je nové zaměření oboru, které škola otevřela pro školní rok 2026/2027 vedle pokračující obecné Obchodní akademie. Nejde o přejmenování ani o rozdělení stávající nabídky: obecná Obchodní akademie pokračuje v roce 2026 dál jako samostatná nabídka a škola samotná nové zaměření označuje za 'nový projekt' spouštěný v roce 2026/27. Návaznost: Obchodní akademie 2025 → Obchodní akademie (zaměření obchodní akademie) 2026 jako pokračování; Obchodní akademie – sportovní management 2026 je nová nabídka bez předchůdce v roce 2025.","alternative_explanations":["Teoreticky by zaměření sportovní management mohlo být jen nově odlišeným zápisem dosavadní interní specializace Obchodní akademie; tomu ale odporuje absence jakékoli zmínky o sportovním managementu na webu školy v květnu 2025 i výslovné označení 'nový projekt' pro rok 2026/27.","Přesné datum zápisu zaměření sportovní management do rejstříku škol zůstává nezjištěné: ověřené snímky otevřených dat MŠMT vedou obory jen na úrovni kódu KKOV bez zaměření, takže zaměření se v nich neprojeví. Zjištěné snímky ale potvrzují, že obor 63-41-M/02 byl zapsán nepřetržitě od 31. 3. 2025 do 30. 6. 2026; pro otázku návaznosti nabídek to není rozhodující."],"relationship":{"type":"new_offer","from":[],"to":["2026/63-41-M/02 Obchodní akademie – sportovní management (ID_SOF e0d54f45-d212-46e8-87b1-caa75079c3e0)"]},"addresses":[{"text":"Laudova 1024/10, 163 00 Praha 6 – Řepy","role":"sídlo","izo":"izo_110007701","valid_period":"2025–2026 (beze změny)","source_url":"https://sos.ptksos.cz/o-nas/kdo-jsme"},{"text":"Laudova 1024/10, 163 00 Praha 6 – Řepy","role":"místo výuky","izo":"izo_110007701","valid_period":"2025–2026","source_url":"fronta-dohledavani-2025-2026.json, úkol R-600005666"},{"text":"Laudova 1024/10, Řepy, 163 00 Praha","role":"sídlo","izo":"izo_110007701","valid_period":"31. 3. 2025 – 30. 6. 2026 (beze změny ve všech snímcích)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld"},{"text":"Laudova 1024/10, Řepy, 163 00 Praha","role":"místo výuky (C31)","izo":"izo_110007701","valid_period":"31. 3. 2025 – 30. 6. 2026 (ve všech snímcích)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld"},{"text":"Za Poříčskou bránou 257/8, Karlín, 186 00 Praha","role":"místo výuky (C10)","izo":"izo_110007701","valid_period":"31. 3. 2025 – 30. 6. 2026 (ve všech snímcích)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld"},{"text":"Dykova 50/20, Vinohrady, 101 00 Praha","role":"místo výuky (C10)","izo":"izo_110007701","valid_period":"31. 3. 2025 – 30. 6. 2026 (ve všech snímcích)","source_url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld"}],"evidence":[{"url":"fronta-dohledavani-2025-2026.json, úkol R-600005666","title":"Přiložená data fronty (context_offers 2025 a 2026)","published_at":null,"checked_at":"2026-09-12","supports":"Skladba nabídek školy v obou letech: v roce 2025 tři obory bez sportovního managementu, v roce 2026 čtyři nabídky včetně OA – sportovní management vedle pokračující obecné OA.","applicable_period":"přijímací řízení 2025 a 2026 (1. kolo JPZ, denní studium)"},{"url":"https://web.archive.org/web/20250516133902/https://sos.ptksos.cz/uchazecum/prijimaci-rizeni_1","title":"Přijímací řízení – archivní snímek webu školy z 16. 5. 2025","published_at" tav rejstříku k 31. 3. 2026 (období 1. kola JPZ 2026)"},{"url":"https://lkod-ftp.msmt.gov.cz/00022985/250d6b3f-71a2-4441-b8a0-4df141071f13/rssz-cela-cr-2026-06-30.jsonld","title":"Rejstřík škol a školských zařízení – celá ČR (snímek MŠMT k 30. 6. 2026)","published_at":"2026-06-30","checked_at":"2026-09-12","supports":"Nejnovější snímek potvrzuje bezezměňový stav: stejný název subjektu, sídlo Laudova 1024/10, Řepy, tři místa výuky IZO 110007701 (Řepy C31, Karlín C10, Vinohrady C10) a zapsaný obor 63-41-M/02.","applicable_period":"stav rejstříku k 30. 6. 2026"}],"history_comparability":"not_comparable","recommended_action":"record_only","related_task_ids":[],"unanswered_questions":["Přesné datum zápisu zaměření sportovní management do rejstříku škol nelze z otevřených dat MŠMT určit – snímky vedou obory jen na úrovni kódu KKOV bez zaměření (obor 63-41-M/02 je zapsán nepřetržitě od 31. 3. 2025); vyžadovalo by to plnou evidenci rejstříku včetně zápisů o zaměřeních.","Zda má zaměření sportovní management samostatný plánovaný počet přijímaných žáků oddělený od obecné Obchodní akademie, lze dořešit z PDF kritérií 2026/2027 na webu školy."]}],"registry_check":{"checked_at":"2026-09-12","snapshots":["2025-03-31","2025-12-31","2026-03-31","2026-06-30"],"summary":"Rejstřík MŠMT potvrdil všechny původní závěry: subjekt REDIZO 600005666 (Gymnázium, střední odborná škola a Pražská taneční konzervatoř, s.r.o.) je veden ve všech čtyřech snímcích beze změny názvu, sídla Laudova 1024/10, Řepy i míst výuky, a obor 63-41-M/02 Obchodní akademie je u IZO 110007701 zapsán nepřetržitě od 31. 3. 2025 do 30. 6. 2026 – nová nabídka sportovní management tedy skutečně vychází ze stávajícího zapsaného oboru. Absence rejstříku v původním nálezu nezpůsobila chybu, jen neověřenost identity a sídla, která je nyní potvrzena; otevřená data zaměření oborů nerozlišují, takže datum zápisu zaměření zůstává nezjištěné. Překvapení: IZO 110007701 má kromě sídla v Řepech další dvě místa výuky (Karlín, Vinohrady) a zapsaný obor Gymnázium 79-41-K/41, který se v nabídkách CERMAT 1. kola JPZ neobjevuje."}}}}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),isUrl=x=>/^https?:\/\//i.test(String(x??''));
const STATUS={potvrzeno:['Potvrzeno','st-potvrzeno'],'pravděpodobné':['Pravděpodobné','st-pravdepodobne'],rozpor_zdrojů:['Rozpor zdrojů','st-rozpor'],nedohledáno:['Nedohledáno','st-nedohledano']};
const ACTIONS={approve_mapping:'Schválit mapování',manual_review:'Ruční kontrola',record_only:'Pouze zaznamenat',no_action:'Bez akce'};
const REL={continuation:'Pokračování nabídky',rename_only:'Pouze přejmenování',new_offer:'Nová nabídka',closed:'Ukončená nabídka',merge:'Sloučení',split:'Rozdělení',moved:'Přesun místa výuky',unclear:'Nejasná návaznost'};
const HIST={comparable:'Srovnatelná',partially_comparable:'Částečně srovnatelná',not_comparable:'Nesrovnatelná',unknown:'Neurčeno'};
const tasks=D.tasks,results=D.results,byId=new Map(tasks.map(t=>[t.id,t]));
let active=tasks[0].id,page=0;
function offers(t,year){return t.context_offers?.[year]||[];}
function schoolName(t){return offers(t,'2026')[0]?.['NÁZEV ŠKOLY']||offers(t,'2025')[0]?.['NÁZEV ŠKOLY']||('REDIZO '+t.redizo.join(', '));}
function searchText(t){const os=[...offers(t,'2025'),...offers(t,'2026')];return norm([t.id,t.redizo.join(' '),...os.map(o=>[o['NÁZEV ŠKOLY'],o.OBEC,o['OBOR - NÁZEV'],o['ZAMĚŘENÍ OBORU'],o.KKOV].join(' '))].join(' '));}
function res(t){return results[t.id];}
function statusSet(t){return new Set((res(t)?.findings||[]).map(f=>f.status));}
function actionSet(t){return new Set((res(t)?.findings||[]).map(f=>f.recommended_action));}
function filtered(){const q=norm($('search').value),p=$('fProc').value,pr=$('fPrio').value,st=$('fStatus').value,ac=$('fAction').value;return tasks.filter(t=>{const done=!!res(t);if(p==='done'&&!done)return false;if(p==='todo'&&done)return false;if(pr&&String(t.priority)!==pr)return false;if(st&&!statusSet(t).has(st))return false;if(ac&&!actionSet(t).has(ac))return false;if(q&&!searchText(t).includes(q))return false;return true;});}
function renderList(){const rows=filtered();page=Math.max(0,Math.min(page,Math.max(0,Math.ceil(rows.length/40)-1)));$('count').textContent=`${rows.length} úkolů ve filtru`;$('list').innerHTML=rows.slice(page*40,page*40+40).map(t=>{const done=!!res(t),ni=t.issues.length;return `<button data-id="${esc(t.id)}" aria-current="${t.id===active}"><strong>${esc(schoolName(t))}</strong><small><span class="id">${esc(t.id)}</span> · ${ni} ${ni===1?'otázka':ni<5?'otázky':'otázek'} · priorita ${esc(t.priority)}</small><small><span class="badge ${done?'done':'todo'}">${done?'Zpracováno':'Nezahájeno'}</span>${done?' '+[...statusSet(t)].map(s=>`<span class="st ${STATUS[s]?.[1]||'st-nedohledano'}">${esc(STATUS[s]?.[0]||s)}</span>`).join(' '):''}</small></button>`;}).join('')||'<p class="empty">Žádný úkol neodpovídá filtru.</p>';$('page').textContent=`${rows.length?page+1:0} / ${Math.ceil(rows.length/40)}`;$('prevPage').disabled=page===0;$('nextPage').disabled=(page+1)*40>=rows.length;const i=rows.findIndex(t=>t.id===active);$('position').textContent=i<0?'Aktuální úkol je mimo zvolený filtr':`Úkol ${i+1} z ${rows.length} ve filtru`;$('prev').disabled=i<=0;$('next').disabled=i<0||i===rows.length-1;}
function fact(label,value){return `<div><dt>${esc(label)}</dt><dd>${esc(value??'—')}</dd></div>`;}
function addr(o){return [o.ULICE,o.OBEC,o['PSČ']].filter(Boolean).join(', ')||null;}
function offerCard(o){return `<div class="offer"><strong>${esc(o['OBOR - NÁZEV']||o.KKOV||'Nabídka')}${o['ZAMĚŘENÍ OBORU']?' · '+esc(o['ZAMĚŘENÍ OBORU']):''}</strong><p class="small" style="margin:0 0 4px">${esc(o['NÁZEV ŠKOLY'])}</p><dl class="facts">${fact('KKOV',o.KKOV)}${fact('Délka',o['DÉLKA STUDIA']!=null?o['DÉLKA STUDIA']+' let':null)}${fact('Forma',o['FORMA VZDĚLÁVÁNÍ'])}${fact('Jazyk',o['JAZYK STUDIA'])}${fact('Adresa',addr(o))}${fact('IZO',o.IZO)}${fact('REDIZO',o.REDIZO)}${fact('ID_SOF',o.ID_SOF)}</dl></div>`;}
function yearCol(year,list){return `<div class="year-col"><h4>Rok ${year} · ${list.length} ${list.length===1?'nabídka':list.length<5?'nabídky':'nabídek'}</h4>${list.map(offerCard).join('')||'<p class="muted">Žádná nabídka.</p>'}</div>`;}
function issuesTable(t){return `<table class="issues"><thead><tr><th>ID</th><th>Druh</th><th>Priorita</th><th>REDIZO</th><th>Záznamy</th></tr></thead><tbody>${t.issues.map(i=>`<tr><td class="id">${esc(i.id)}</td><td>${esc(i.kind)}</td><td>${esc(i.priority)}</td><td class="id">${esc(Array.isArray(i.redizo)?i.redizo.join(', '):i.redizo)}</td><td>${(i.records||[]).map(r=>`${esc(r.type)} ${esc(r.year)} #${esc(r.index)}`).join('<br>')}</td></tr>`).join('')}</tbody></table>`;}
function renderAddresses(list){if(!list?.length)return '';return `<h4>Adresy</h4>${list.map(a=>`<div class="addr"><p><strong>${esc(a.text)}</strong>${a.role?` <span class="badge">${esc(a.role)}</span>`:''}</p>${a.izo?`<p class="small">IZO: ${esc(a.izo)}</p>`:''}${a.valid_period?`<p class="small">Platnost: ${esc(a.valid_period)}</p>`:''}${a.registry_role?`<p class="small">Role v rejstříku: ${esc(a.registry_role)}</p>`:''}${a.source_url?`<p class="small">Zdroj: ${isUrl(a.source_url)?`<a target="_blank" rel="noopener noreferrer" href="${esc(a.source_url)}">${esc(a.source_url)}</a>`:esc(a.source_url)}</p>`:''}${a.registry_source_url?`<p class="small">Rejstřík: ${isUrl(a.registry_source_url)?`<a target="_blank" rel="noopener noreferrer" href="${esc(a.registry_source_url)}">${esc(a.registry_source_url)}</a>`:esc(a.registry_source_url)}</p>`:''}</div>`).join('')}`;}
function renderEvidence(list){if(!list?.length)return '<p class="muted">Bez přiložené evidence.</p>';return list.map(e=>`<div class="ev"><p><strong>${esc(e.title||e.url)}</strong></p><p>${isUrl(e.url)?`<a target="_blank" rel="noopener noreferrer" href="${esc(e.url)}">${esc(e.url)}</a>`:`<span class="muted">${esc(e.url)}</span>`}</p>${e.supports?`<p>${esc(e.supports)}</p>`:''}<p class="small muted">${[e.published_at?'Publikováno: '+e.published_at:null,e.checked_at?'Ověřeno: '+e.checked_at:null,e.applicable_period?'Období: '+e.applicable_period:null].filter(Boolean).map(esc).join(' · ')}</p></div>`).join('');}
function renderRelationship(rel){if(!rel)return '';const cell=(label,arr)=>`<div><dt>${label}</dt>${(arr&&arr.length?arr:['—']).map(x=>`<dd style="font-weight:500;margin-top:6px">${esc(x)}</dd>`).join('')}</div>`;return `<h4>Návaznost</h4><p><span class="badge">${esc(REL[rel.type]||rel.type)}</span></p><div class="rel">${cell('Z (from)',rel.from)}${cell('Do (to)',rel.to)}</div>`;}
function renderFinding(f){const [label,cls]=STATUS[f.status]||[f.status,'st-nedohledano'];return `<article class="finding"><div class="head"><span class="st ${cls}">${esc(label)}</span><span class="chips">${(f.issue_ids||[]).map(id=>`<span class="chipid">${esc(id)}</span>`).join('')}</span></div>${f.observations?.length?`<ul class="obs">${f.observations.map(o=>`<li>${esc(o)}</li>`).join('')}</ul>`:''}${f.conclusion?`<div class="conclusion"><strong>Závěr:</strong> ${esc(f.conclusion)}</div>`:''}${f.alternative_explanations?.length?`<details><summary>Alternativní vysvětlení (${f.alternative_explanations.length})</summary><ul class="obs">${f.alternative_explanations.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></details>`:''}${renderRelationship(f.relationship)}${renderAddresses(f.addresses)}<h4>Evidence</h4>${renderEvidence(f.evidence)}<dl class="facts">${fact('Srovnatelnost historie',HIST[f.history_comparability]||f.history_comparability)}${fact('Doporučená akce',ACTIONS[f.recommended_action]||f.recommended_action)}</dl>${f.related_task_ids?.length?`<p class="small">Související úkoly: ${f.related_task_ids.map(id=>byId.has(id)?`<a href="#" data-task="${esc(id)}">${esc(id)}</a>`:esc(id)).join(', ')}</p>`:''}${f.unanswered_questions?.length?`<div class="warn"><strong>Nezodpovězené otázky:</strong><ul class="obs">${f.unanswered_questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>`:''}</article>`;}
function renderDetail(){const t=byId.get(active),r=res(t);let html=`<span class="badge ${r?'done':'todo'}">${r?'Zpracováno':'Nezahájeno'}</span> <span class="badge">Priorita ${esc(t.priority)}</span><h2>${esc(schoolName(t))}</h2><p class="muted"><span class="id">${esc(t.id)}</span> · REDIZO ${esc(t.redizo.join(', '))}</p><section class="panel"><h3>Nabídky CERMAT k porovnání</h3><div class="years">${yearCol('2025',offers(t,'2025'))}${yearCol('2026',offers(t,'2026'))}</div></section><section class="panel"><h3>Otázky k dohledání (${t.issues.length})</h3>${issuesTable(t)}</section>`;if(r){html+=`<section class="panel registry"><h3>Kontrola rejstříku MŠMT</h3><p class="small muted">Ověřeno: ${esc(r.registry_check?.checked_at)} · snímky: ${(r.registry_check?.snapshots||[]).map(esc).join(', ')||'—'}</p><p>${esc(r.registry_check?.summary||'')}</p><p class="small muted">Zpracováno: ${esc(r.processed_at)} · verze fronty ${esc(r.queue_version)}</p></section><section class="panel"><h3>Nálezy (${(r.findings||[]).length})</h3>${(r.findings||[]).map(renderFinding).join('')||'<p class="muted">Žádné nálezy.</p>'}</section>`;}else{html+='<p class="notice">Úkol zatím nebyl zpracován – stav: nezahájeno. Nálezy se zde objeví po přidání souboru výsledků a opětovném sestavení prohlížeče.</p>';}$('detail').innerHTML=html;}
function choose(id){active=id;renderList();renderDetail();document.querySelector('main').scrollIntoView({block:'start',behavior:'instant'});}
function move(delta){const rows=filtered(),i=rows.findIndex(t=>t.id===active);if(rows[i+delta]){page=Math.floor((i+delta)/40);choose(rows[i+delta].id);window.scrollTo({top:0,behavior:'instant'});}}
$('list').onclick=e=>{const b=e.target.closest('button[data-id]');if(b)choose(b.dataset.id);};
$('detail').onclick=e=>{const a=e.target.closest('a[data-task]');if(a){e.preventDefault();choose(a.dataset.task);}};
['search','fProc','fPrio','fStatus','fAction'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;renderList();}));
$('prevPage').onclick=()=>{page--;renderList();};$('nextPage').onclick=()=>{page++;renderList();};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
(function summary(){const done=tasks.filter(t=>res(t)).length,counts={};tasks.forEach(t=>statusSet(t).forEach(s=>counts[s]=(counts[s]||0)+1));$('subtitle').textContent=`Verze fronty ${D.queue_version} · nástroj slouží pouze ke kontrole dat, nic nemění`;$('summary').innerHTML=[`<span class="chip"><strong>${tasks.length}</strong>úkolů celkem</span>`,`<span class="chip"><strong>${done}</strong>zpracováno</span>`,`<span class="chip"><strong>${tasks.length-done}</strong>nezahájeno</span>`,...Object.entries(STATUS).map(([k,[label]])=>counts[k]?`<span class="chip"><strong>${counts[k]}</strong>${esc(label.toLowerCase())}</span>`:'')].join('');})();
renderList();renderDetail();
</script></html>
